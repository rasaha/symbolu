# Independent distribution for the canonical Ugence Cloud Scaling Controller.
#
# This is the ONE canonical source tree (``src/ugence_cloud_scaling_controller``) for
# the coherence-aware adaptive scaling controller: it consumes normalized workload /
# infrastructure observations and produces deterministic, explainable scaling
# RECOMMENDATIONS. It is provider-neutral and advisory-only by default — it never
# scales infrastructure, calls a cloud-provider API, changes an HPA, runs kubectl or
# Terraform, opens a network listener, or invokes an LLM.
#
# Dependency policy: the core requires Python + NumPy only. The single optional
# runtime dependency is `requests` (behind the read-only `prometheus` / `shadow`
# extras) for the read-only Prometheus signal adapter. No cloud-provider SDK
# (kubernetes/boto3/azure/google-cloud), web framework, database driver,
# model-provider SDK, or Ugence governance/agent/control-plane package is a
# dependency. Execution/operations code lives OUTSIDE this distribution in the
# monorepo-only `cloud_scaling_operations` namespace.
#
# The legacy ``cloud_controller`` (repo root) and ``symbolu.cloud_controller``
# namespaces are logic-free compatibility surfaces that re-export this package with
# object identity preserved.
#
# Build:  python -m build packages/capabilities/cloud-scaling-controller
# Verify: python packages/capabilities/cloud-scaling-controller/verify_cloud_scaling_controller_distribution.py
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ugence-cloud-scaling-controller"
dynamic = ["version"]
description = "Ugence Cloud Scaling Controller — deterministic, provider-neutral, advisory-only adaptive scaling recommendations from normalized workload observations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Ugence Labs" }]
keywords = ["scaling", "autoscaling", "controller", "kubernetes", "advisory", "deterministic", "ugence"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
# Core runtime dependency: NumPy only.
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
# Read-only Prometheus ingestion adapter (signals/prometheus.py uses requests for
# HTTP GET queries only). This is the sole optional runtime dependency of packaged
# code after the operations code was separated out (v0.1.1).
prometheus = [
    "requests>=2.28.0",
]
# Read-only shadow evaluation: the HPA/state watcher reads via the Prometheus client
# (kube-state-metrics), NOT the Kubernetes SDK — so it needs only `requests`. No
# Kubernetes/AWS/Azure/GCP SDK is a dependency of this distribution.
shadow = [
    "requests>=2.28.0",
]
# Development / verification tooling.
dev = [
    "pytest>=7.0",
    "build>=1.0",
    "pip-audit>=2.6",
]

[project.scripts]
ugence-cloud-scaling = "ugence_cloud_scaling_controller.cli:main"

# Read statically from the version module's literal so the build backend never imports
# the package to resolve the version.
[tool.setuptools.dynamic]
version = { attr = "ugence_cloud_scaling_controller.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ugence_cloud_scaling_controller*"]

[tool.setuptools.package-data]
ugence_cloud_scaling_controller = ["py.typed"]
