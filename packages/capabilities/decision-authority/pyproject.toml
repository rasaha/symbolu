# Independent distribution for the canonical Ugence Decision Authority capability.
#
# Decision Authority is the bounded capability that governs when an AI
# recommendation may become a binding business decision. This is the ONE
# canonical source tree (``src/ugence_decision_authority``). The legacy
# ``decision_governance`` namespace at the repository root is a logic-free
# compatibility surface that re-exports from this package.
#
# Build:    python -m build packages/capabilities/decision-authority
# Verify:   python packages/capabilities/decision-authority/verify_decision_authority_distribution.py
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ugence-decision-authority"
dynamic = ["version"]
description = "Ugence Decision Authority — bounded binding-business-decision governance capability (frozen v1.0.0 kernel)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Rakesh Mohan" }]
keywords = ["governance", "decision-authority", "decision-governance", "ugence"]
# Depends only on pydantic (models) + the Python standard library. It does NOT
# depend on any other Ugence capability, provider, product, or platform service.
dependencies = ["pydantic>=2.0.0"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

# Read statically from the version module's literal so the build backend never
# needs to import the package (and thus pydantic) to resolve the version.
[tool.setuptools.dynamic]
version = { attr = "ugence_decision_authority.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ugence_decision_authority*"]
