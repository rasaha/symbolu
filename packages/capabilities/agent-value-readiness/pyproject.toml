# Independent distribution for the Ugence Agent Value Readiness Contracts.
#
# A narrow internal *technical* leaf (NOT a customer-facing module) holding the
# non-financial contract SHAPES for the Agent Value Readiness engine of Ugence
# Value Intelligence (GV-3R-a, milestone M-3R.1 of the UVI ADR
# docs/architecture/ADR_UGENCE_VALUE_INTELLIGENCE_GV2C_GV2E_GV3R.md).
#
# It defines the vocabulary for assessing whether an agent is ready for an
# intended outcome under a Geography/Domain/Intended-Outcome + Readiness policy
# context. It implements NO readiness evaluator, NO tier selection, NO deployment
# authority, and NO financial value. It depends only on the Python standard
# library and the two neutral contract leaves.
#
# Build:    python -m build packages/capabilities/agent-value-readiness
# Verify:   python packages/capabilities/agent-value-readiness/verify_agent_value_readiness_distribution.py
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ugence-agent-value-readiness"
dynamic = ["version"]
description = "Ugence Agent Value Readiness Contracts — non-financial readiness contract shapes (internal technical leaf, contracts only)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Rakesh Mohan" }]
keywords = ["ugence", "value-intelligence", "readiness", "contracts", "agent"]
# Depends ONLY on the neutral governance-contracts leaf (evidence vocabulary) and
# the uvi-policy-contracts leaf (policy/context shapes). No governed-value, no
# third-party runtime dependency. Every arrow points at a contract leaf (ADR §21).
dependencies = [
    "ugence-governance-contracts>=0.2.0",
    "ugence-uvi-policy-contracts>=0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.dynamic]
version = { attr = "ugence_agent_value_readiness.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ugence_agent_value_readiness*"]

[tool.setuptools.package-data]
ugence_agent_value_readiness = ["py.typed"]
