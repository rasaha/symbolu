# Ugence Governed Value — independently packaged governed-value accounting kernel.
#
# A stdlib-only leaf: no third-party runtime dependency (all money/rate math is
# exact `decimal.Decimal`) so the conformance suite runs in an isolated
# clean-venv install exactly like the other governance leaves. FastAPI is an
# optional extra used only by the (future) HTTP route adapter.
#
# Build:   python -m build packages/governed-value
# Verify:  python packages/governed-value/verify_governed_value_distribution.py
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ugence-governed-value"
dynamic = ["version"]
description = "Ugence Governed Value — net-governed-value-per-authorized-action accounting kernel."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Rakesh Mohan" }]
keywords = ["governance", "roi", "value", "authorization", "actiongate", "ugence"]
# A leaf: no third-party runtime dependency and no other Ugence package.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.dynamic]
version = { attr = "governed_value.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["governed_value*"]

[tool.setuptools.package-data]
governed_value = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
