# Independent distribution for the Ugence UVI Policy Authority.
#
# A narrow internal *technical* authority leaf (NOT a customer-facing module and
# NOT a general-purpose governance authority) that issues, signs, registers,
# resolves, verifies and revokes UVI policy versions for the five merged policy
# families, per ADR docs/architecture/ADR_UGENCE_VALUE_INTELLIGENCE_GV2C_GV2E_GV3R.md
# (D-1, D-16, §19, §23) — the approval / signing-issuance / policy-version
# revocation ownership that ADR §26.1 recorded as an open owner ruling.
#
# It does NOT author policy content, does NOT judge whether policy content is
# good, and NEVER approves its own policy: approval remains an external
# human/governance responsibility reaching the authority only through an
# injected, trusted approval-verification boundary. It implements NO readiness
# evaluator, NO financial valuation, NO forecasting, NO benchmark registry, and
# NO production persistence.
#
# It depends only on the Python standard library and the two neutral contract
# leaves. Ed25519 signing follows the repository's existing stdlib-only RFC 8032
# authority convention (risk_authority/crypto/signing.py) WITHOUT importing that
# package — a reverse dependency on another authority's internals is forbidden
# by ADR §21.
#
# Build:    python -m build packages/uvi-policy-authority
# Verify:   python packages/uvi-policy-authority/verify_uvi_policy_authority_distribution.py
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ugence-uvi-policy-authority"
dynamic = ["version"]
description = "Ugence UVI Policy Authority — technical issuance, registry, trusted resolution and policy-version revocation (internal technical leaf)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Rakesh Mohan" }]
keywords = ["ugence", "value-intelligence", "policy", "authority", "issuance", "revocation"]
# Depends ONLY on the neutral governance-contracts leaf and the uvi-policy-contracts
# leaf. No third-party runtime dependency, no readiness, no governed-value, no
# other authority. Every arrow points at a contract leaf (ADR §21).
dependencies = [
    "ugence-governance-contracts>=0.2.0",
    "ugence-uvi-policy-contracts>=0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.dynamic]
version = { attr = "ugence_uvi_policy_authority.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ugence_uvi_policy_authority*"]

# The package is fully type-annotated; ship the PEP 561 marker so typed consumers
# get the authority types under mypy/pyright.
[tool.setuptools.package-data]
ugence_uvi_policy_authority = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
