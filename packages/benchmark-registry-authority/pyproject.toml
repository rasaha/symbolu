# Independent distribution for the Ugence Benchmark Registry Authority (BR-2).
#
# The authority/registry layer of the shared, platform-wide Benchmark Registry,
# ratified in docs/architecture/ADR_UGENCE_TRUSTED_EVIDENCE_AND_BENCHMARK_REGISTRY.md
# (B-1, §6.2 as amended). ADR §6.2 records two layers: the FROZEN identity layer
# (ugence-benchmark-registry, 0.1.0) and this separate authority/registry layer.
# BR-2 behaviour never enters BR-1.
#
# BR-2A (0.1.0) — "Registry and exact-resolution CONTRACTS."
# Record, event, envelope and request shapes; the registry lifecycle vocabulary
# and its closed relation; exactly one structural representation bound to each
# transition; typed refusals; ports as Protocols; fifteen digest domains; pure
# validation. Contracts only.
#
# BR-2B (0.2.0) — "NON-AUTHORITATIVE LIFECYCLE KERNEL."
# Transition validation, predecessor checks, terminality, and conflict and
# idempotency calculation, all over CALLER-ASSERTED state. Three further digest
# domains. It determines what transition WOULD BE valid; nothing here makes one
# occur.
#
# BR-2C-RC (this release, 0.3.0rc1) — the BR-2C CANDIDATE HEAD. The three
# verification seams of BenchmarkApprovalVerifierPort implemented on the D-41
# pair inside one dedicated verifier module, and the exact deny-all default
# (BenchmarkDenyAllVerifier). The D-42 key-identifier and D-43 actor-identity
# grammar applied at construction. A CANDIDATE VERSION ONLY (owner ruling): it
# conveys no audit, independent-review or production-release claim; 0.3.0 is
# not taken until the D-38 independent external cryptographic reviewer is
# named and the review commissioned and completed.
#
# BR-2C-0 (0.2.1, 0.2.2 and 0.2.3) —
# BR-2C's ratified
# CONTRACT SURFACE, and no
# BR-2C capability (ADR §35.2 D-33 mints the rung and D-36 places all three
# versions on it; D-24, D-25 and D-26 rule the surface):
# the role-scoped trust-anchor record, the three distinct exact verified-result
# types, and the reshaped approval-verifier and trust-directory ports;
# BenchmarkTrustAnchorResolution (D-34), the anchor-resolution outcome carrying
# an anchor record XOR one of the seam's two typed refusals; and
# BENCHMARK_VERIFICATION_REFUSAL_REASONS (D-35), the twelve of the twenty-four a
# REFUSED verified result may carry, derived from the fault-class map and never
# written out. Four
# further digest domains.
#
# NOT in this distribution:
#   BR-2C (0.3.0) closure: the SAME verifier after the D-38 independent
#                 external cryptographic review and D-32(4)'s external
#                 cryptographic audit are commissioned, completed and recorded.
#                 Neither has occurred. The composition-root trust-resolver
#                 adapter and key entitlements remain with the composition root
#                 (D-04) and are not here.
#   BR-2D (0.4.0) durable registry authority: persistence, the trusted clock,
#                 compare-and-set transitions, immutable event history, the
#                 process-local in-memory adapter, registry-event signing, and
#                 the first authoritative admission, registration, revocation
#                 and exact resolution. Closes with the identity-locked
#                 composition root. Blocked on ADR DD-10.
#   BR-2E (0.5.0) production composition and operations: tenant authorization,
#                 service APIs, deployment controls, migrations,
#                 backup/recovery, observability, audit export.
#
# This package ships NO store of any kind, trust-anchor store, clock read,
# append path, authority-issued result, resolver, convenience resolver,
# selection API, supersession implementation, adapter registry, identity
# allow-list or production composition root. The candidate verifier
# establishes cryptographic verification against one anchor revision at one
# caller-supplied instant and nothing else: it cannot admit, register, revoke
# or resolve, holds no anchors and reads no clock. Every other capability that
# does not exist is unrepresentable in the type surface, not merely
# unimplemented. Automated tests enforce every one of those facts.
#
# EXACTLY THREE runtime dependencies: the frozen BR-1 identity layer, pinned to
# its 0.1 line, and the D-41 pair. Nothing else, Ugence or third party. The
# isolated --no-index install proof is exact: only those three (and the pair's
# own transitive dependencies) may be resolved, from a local wheelhouse, and the
# verifier fails if anything else is.
#
# Build:    python -m build packages/benchmark-registry-authority
# Verify:   python packages/benchmark-registry-authority/verify_benchmark_registry_authority_distribution.py
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ugence-benchmark-registry-authority"
dynamic = ["version"]
description = "Ugence Benchmark Registry Authority — BR-2C candidate head (0.3.0rc1): the candidate Ed25519 verifier (three verification seams on the cryptography + PyNaCl pair, inside one dedicated module) and the exact deny-all default, over BR-2C's contract surface, BR-2B's non-authoritative lifecycle kernel and BR-2A's registry and exact-resolution contracts: the administrative lifecycle and its closed transition relation, nested-binding record and event shapes, typed refusals, inert ports, transition planning over caller-asserted state, the role-scoped trust-anchor record, the three exact verified-result types, BenchmarkTrustAnchorResolution and BENCHMARK_VERIFICATION_REFUSAL_REASONS (internal platform infrastructure; no store, no clock, no append path, no authority-issued result; a CANDIDATE verifier only — engineered and tested, awaiting the D-38 independent external cryptographic review, and never described as reviewed or production-ready)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Rakesh Mohan" }]
keywords = [
    "ugence", "benchmark-registry", "benchmark-registry-authority",
    "contracts", "platform", "registry-lifecycle", "canonicalization", "digest",
]
# The frozen BR-1 identity layer, the D-41 pair, and the standard library.
# Nothing else. BR-1 is pinned to the 0.1 line: BR-2A binds BR-1's exact
# contract shapes, its canonicalization version and its pinned digests, so a
# minor-version bump of the identity layer is a BR-2 decision, not an
# automatic upgrade.
dependencies = [
    "ugence-benchmark-registry==0.1.*",
    # The D-41 pair, for the BR-2C candidate verifier and nothing else:
    # cryptography verifies Ed25519 signatures; PyNaCl (libsodium) validates
    # public-key points at anchor admission. Imported only inside
    # src/ugence_benchmark_registry_authority/verifier.py, under the release
    # transition the owner ratified for the candidate rung (D-40, D-41). Bounded
    # on both sides in the same style the trusted-evidence layer declares them —
    # the same SELECTION, never an import of that layer's code.
    "cryptography>=41.0.7,<47.0.0",
    "PyNaCl>=1.5.0,<2.0.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.dynamic]
# Points at the version MODULE, not at the package's __init__. setuptools reads
# a literal assignment out of the module's AST without importing it; pointing at
# __init__.__version__ would force an import of the whole package inside the
# isolated build environment, where the one runtime dependency is deliberately
# not installed — so the build would fail for a reason that has nothing to do
# with the version.
version = { attr = "ugence_benchmark_registry_authority.version.__version__" }

# Exactly one top-level namespace ships. Tests, probes, fixtures, the
# distribution verifier and the mutation sweep are all excluded.
[tool.setuptools.packages.find]
where = ["src"]
include = ["ugence_benchmark_registry_authority*"]

# The package is fully type-annotated; ship the PEP 561 marker so typed
# consumers get the contract types under mypy/pyright.
[tool.setuptools.package-data]
ugence_benchmark_registry_authority = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
