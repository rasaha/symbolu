# Ugence Model Egress Custody (GCP) — the production-form Secret Manager adapter.
#
#   THIS DISTRIBUTION HOLDS NO CREDENTIAL AND MAKES NO MODEL VENDOR CALL.
#   IT READS ONE PINNED SECRET VERSION THROUGH AN INJECTED CLIENT.
#
# The Google SDK is an OPTIONAL extra, imported inside
# build_google_secret_manager_client() and nowhere else. Installing this package
# without the extra gives you every refusal, every check and the full test suite with
# no Google dependency present; the deployment image installs the extra so its
# composition root can build a real client. That is why `pip install` of this package
# in CI reaches no Google service and why tests/test_boundaries.py can assert that no
# module imports a Google SDK at module scope.
#
# Dependency direction (one-way; the unit never imports this):
#     ugence-model-egress-unit
#         ▲
#     ugence-model-egress-custody-gcp (this package)
#         ▲
#     deployment/meu-validation-job
#
# Build:   python -m build packages/integration/model-egress-custody-gcp
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ugence-model-egress-custody-gcp"
dynamic = ["version"]
description = "Ugence Model Egress Custody (GCP) — the production-form Google Secret Manager custody adapter for the Model Egress Unit: one pinned numeric secret version, native GCP workload identity bound to the designated service account, an attested step-8 designation, sanitized provider errors and identifier-only audit. Holds no credential and makes no model vendor call."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Rakesh Mohan" }]
keywords = ["governance", "egress", "custody", "secret-manager", "gcp", "ugence"]
classifiers = ["Typing :: Typed"]
dependencies = [
    "ugence-model-egress-unit>=0.6.0",
]

[project.optional-dependencies]
# The real client. Imported only inside build_google_secret_manager_client().
google = ["google-cloud-secret-manager>=2.20.0"]
test = ["pytest>=7.0"]

[tool.setuptools.dynamic]
version = { attr = "ugence_model_egress_custody_gcp.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ugence_model_egress_custody_gcp*"]

[tool.setuptools.package-data]
ugence_model_egress_custody_gcp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
