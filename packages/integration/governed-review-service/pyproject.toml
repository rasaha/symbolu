# Ugence Governed Review Service — lists the review queue, renders a run, and records a
# human's decision, then re-arms the instance it binds to (GAS-7, step HR-C).
#
# Scoped and ruled by docs/architecture/ADR_UGENCE_HUMAN_REVIEW_DURABLE_RESUME_SCOPING.md
# (HR-1 to HR-5, 2026-09-05); routes per apps/ugence-governance-studio/docs/HUMAN_REVIEW_SCREEN_API_AUDIT.md.
#
#   THIS SERVICE RECORDS A DECISION A HUMAN ALREADY MADE.
#   IT NEVER APPROVES, AUTHENTICATES, MINTS AUTHORITY, CLEARS OR EXECUTES.
#
# Dependency direction (one-way, composition only):
#     ugence-governed-review      <- the binding (subject kind, instance:task reference)
#     ugence-approval-workflow    <- the ledger it records into and lists from
#     ugence-authority-directory  <- the eligibility adapter the queue reports from
#     ugence-durable-execution    <- the adapter it signals and resumes; the tables it reads
#     ugence-governance-contracts <- Validity, AuditReference
#     ugence-control-plane-root   <- the audit ledger a completed round trip's linkage is appended to (HE-1)
#     SQLAlchemy                  <- the read façade's query (the adapter's own driver)
#
# Nothing under packages/capabilities; no product; no identity provider; no cloud SDK;
# no clock. FastAPI is a presentation extra, imported only inside build_app.
#
# Build:   python -m build packages/integration/governed-review-service
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ugence-governed-review-service"
dynamic = ["version"]
description = "Ugence Governed Review Service — review queue, run detail and decision recording over the approval ledger and the DBOS adapter. Reference-grade, shadow-only; the approver is a presented reference; never approves, authenticates, clears or executes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Rakesh Mohan" }]
keywords = ["governance", "approval", "review", "durable-execution", "ugence"]
classifiers = ["Typing :: Typed"]
dependencies = [
    "ugence-governed-review>=0.2.0",
    "ugence-approval-workflow>=0.1.0",
    "ugence-authority-directory>=0.1.0",
    "ugence-durable-execution>=0.1.0",
    "ugence-governance-contracts>=0.4.0",
    "ugence-control-plane-root>=0.1.0",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
http = ["fastapi>=0.110", "starlette>=0.36"]
test = ["pytest>=7.0", "httpx>=0.27", "ugence-agent-runtime>=0.7.0",
        "ugence-agent-runtime-governance>=0.1.0", "ugence-risk-authority-runtime>=0.1.0"]

[tool.setuptools.dynamic]
version = { attr = "ugence_governed_review_service.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ugence_governed_review_service*"]

[tool.setuptools.package-data]
ugence_governed_review_service = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["matrix: a failure-matrix row from the human-review ADR"]
