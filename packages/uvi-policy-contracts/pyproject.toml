# Independent distribution for the Ugence UVI Policy & Assessment-Context Contracts.
#
# A narrow internal *technical* package (NOT a customer-facing module) that holds
# the immutable contract SHAPES for UVI governed assessment context and policy
# artifacts (GeographyPolicy / DomainPolicy / IntendedOutcomePolicy /
# ValuationPolicy / ReadinessPolicy + AssessmentContext), per ADR
# docs/architecture/ADR_UGENCE_VALUE_INTELLIGENCE_GV2C_GV2E_GV3R.md (D-2, D-13,
# D-15, §15, §20, milestone M-2C.1).
#
# It depends only on the Python standard library and the neutral
# ``ugence-governance-contracts`` leaf (for the reused evidence/benchmark
# vocabulary). It mints NO authority, implements NO Policy Authority, NO
# registry, NO readiness evaluator, NO forecasting, and NO financial valuation.
#
# Build:    python -m build packages/uvi-policy-contracts
# Verify:   python packages/uvi-policy-contracts/verify_uvi_policy_contracts_distribution.py
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ugence-uvi-policy-contracts"
dynamic = ["version"]
description = "Ugence UVI Policy & Assessment-Context Contracts — immutable policy/context contract shapes (internal technical package)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Rakesh Mohan" }]
keywords = ["ugence", "value-intelligence", "policy", "contracts", "assessment-context"]
# Depends ONLY on the neutral governance-contracts leaf (for the reused
# BenchmarkReference / evidence axes). No third-party runtime dependency and no
# other UVI or capability package. The arrow points at a neutral-contract
# package only (ADR §21).
dependencies = ["ugence-governance-contracts>=0.2.0"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.dynamic]
version = { attr = "ugence_uvi_policy_contracts.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ugence_uvi_policy_contracts*"]

# The package is fully type-annotated; ship the PEP 561 marker so typed consumers
# (the future readiness engine, governed-value valuation) get the contract types
# under mypy/pyright.
[tool.setuptools.package-data]
ugence_uvi_policy_contracts = ["py.typed"]
