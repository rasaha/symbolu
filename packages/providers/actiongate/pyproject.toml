# Independent distribution for the canonical Ugence ActionGate action-governance
# provider.
#
# This is the ONE canonical source tree (``src/ugence_actiongate_provider``) for the
# ActionGate provider: the vendor action-governance engine core plus the neutral
# ``ActionGovernanceProvider`` adapter (request/result mapping, error translation,
# fail-closed policy, configuration, health, observability, and conformance).
# ActionGate evaluates **authorization only** — it owns NO dispatch, execution,
# observation, or reconciliation surface.
#
# Dependency policy (ActionGate core):
#   * ugence-governance-provider-framework — the neutral provider framework whose
#     ``.api`` surface ActionGate consumes (the ONLY hard dependency).
#   * Python standard library.
# The ActionGate *core* (``core.py``, ``client/``) imports neither the framework nor
# the kernel. The Decision Authority kernel is reached ONLY through the framework's
# optional action control-plane adapter, so it is an OPTIONAL extra
# (``decision-authority``) — ActionGate never acquires a mandatory kernel dependency.
# ActionGate does NOT depend on TAP: ActionGate and TAP are independent peer
# providers. Remote mode uses the in-process client abstraction and adds no
# third-party HTTP dependency.
#
# The legacy ``actiongate_provider`` namespace (root of the repo) is a logic-free
# compatibility facade that re-exports this package.
#
# Build:  python -m build packages/providers/actiongate
# Verify: python packages/providers/actiongate/scripts/verify_actiongate_provider_distribution.py
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ugence-actiongate-provider"
dynamic = ["version"]
description = "Ugence ActionGate — an action-governance provider evaluating whether a proposed action is authorized under supplied authority, policy, risk, evidence, and decision context. Deterministic, offline core; owns no dispatch or execution authority."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Ugence Labs" }]
keywords = ["action", "governance", "authorization", "provider", "actiongate", "ugence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
# Core hard dependency: the neutral provider framework only. No kernel, no TAP, no
# AI Hiring, no model SDK, no web framework, no database driver, no cloud client, no
# enterprise execution connector.
dependencies = ["ugence-governance-provider-framework>=0.1.0"]

[project.optional-dependencies]
# The action control-plane integration (ActionGovernanceControlPlaneAdapter) is a
# framework adapter bound to the Decision Authority kernel; opt in via the
# framework's own ``adapters`` extra so ActionGate does not re-decide the framework's
# kernel wiring.
decision-authority = ["ugence-governance-provider-framework[adapters]>=0.1.0"]
dev = ["pytest>=7.0", "build>=1.0"]
all = ["ugence-governance-provider-framework[adapters]>=0.1.0"]

[project.scripts]
ugence-actiongate-provider = "ugence_actiongate_provider.cli:main"

[project.urls]
Documentation = "https://github.com/rasaha/symbolu/tree/main/packages/providers/actiongate/docs"

# Read statically from the version module's literal so the build backend never needs
# to import the package to resolve the version.
[tool.setuptools.dynamic]
version = { attr = "ugence_actiongate_provider.version.DISTRIBUTION_VERSION" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["ugence_actiongate_provider*"]

[tool.setuptools.package-data]
ugence_actiongate_provider = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--import-mode=importlib"
