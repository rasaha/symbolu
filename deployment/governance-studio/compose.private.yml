# Private reference deployment (P3E §21). Single hardened service, one TLS port.
# Secrets and certificates are provided via an operator .env / mounted files — never
# committed. Copy .env.example to .env and fill it in; keep .env out of version control.
services:
  governance-studio:
    build:
      context: ../..            # repository root
      dockerfile: deployment/governance-studio/Dockerfile
    image: governance-studio-private-hosted:0.1.0
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/run/ugence-studio
    ports:
      - "8443:8443"
    environment:
      UGENCE_STUDIO_DEPLOYMENT_MODE: production
      UGENCE_STUDIO_USERNAME: ${UGENCE_STUDIO_USERNAME:?set in .env}
      UGENCE_STUDIO_PASSWORD_HASH: ${UGENCE_STUDIO_PASSWORD_HASH:?generate with generate_password_hash}
      UGENCE_STUDIO_ALLOWED_HOSTS: ${UGENCE_STUDIO_ALLOWED_HOSTS:?comma-separated hostnames}
      UGENCE_STUDIO_TLS_CERT_FILE: /run/secrets/tls/server.crt
      UGENCE_STUDIO_TLS_KEY_FILE: /run/secrets/tls/server.key
      # CR-2: the governed runtime worker's private TLS listener; unset = review screens
      # report a typed gap. The only outbound destination this profile permits.
      UGENCE_STUDIO_REVIEW_SERVICE_URL: ${UGENCE_STUDIO_REVIEW_SERVICE_URL:-}
      # Front-door seam 1: the sqlite policy registry under the runtime volume; unset =
      # the Constitution screen reports a typed gap. No key material is ever mounted.
      UGENCE_STUDIO_CONSTITUTION_REGISTRY_PATH: ${UGENCE_STUDIO_CONSTITUTION_REGISTRY_PATH:-}
      # Front-door seam 2: the tenant displayed and the typed policy identities the
      # Authority screen may list; read-only; unset = typed gap.
      UGENCE_STUDIO_TENANT_ID: ${UGENCE_STUDIO_TENANT_ID:-}
      UGENCE_STUDIO_POLICY_IDENTITIES: ${UGENCE_STUDIO_POLICY_IDENTITIES:-}
      # Front-door seam 3: '1' hands the Simulate screen the one pinned in-image no-I/O
      # provider; the governance hook stays the runtime's fail-closed default; unset = typed gap.
      UGENCE_STUDIO_SIMULATION_PROVIDER: ${UGENCE_STUDIO_SIMULATION_PROVIDER:-}
      # Front-door seam 5: the sqlite system registry under the runtime volume, bound to
      # UGENCE_STUDIO_TENANT_ID; register is the only write; unset = typed gap.
      UGENCE_STUDIO_SYSTEM_REGISTRY_PATH: ${UGENCE_STUDIO_SYSTEM_REGISTRY_PATH:-}
    volumes:
      # certificate material is mounted READ-ONLY; the private key is never baked in
      - type: bind
        source: ${UGENCE_STUDIO_TLS_DIR:?path to a directory containing server.crt and server.key}
        target: /run/secrets/tls
        read_only: true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: on-failure:3
    healthcheck:
      test: ["CMD", "python", "/app/container-healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
