[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "governance-studio-deployment"
version = "0.12.0"
description = "Private hosted, HTTPS-only, synthetic-data-only deployment wrapper for the frozen Governance Studio frontend and P3B backend. No permission granting, no agent execution, no business-action authorization."
requires-python = ">=3.11"
dependencies = [
  "starlette>=0.36",
  "uvicorn>=0.27",
  "argon2-cffi>=23.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
governance_studio_deployment = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = [
  "src",
  "tests",
  "../../apps/ugence-governance-studio/backend/src",
  "../../packages/capabilities/agent-workforce-composer/src",
  "../../packages/tooling/policy-workflow-compiler/src",
  "../../packages/runtime/agent-runtime/src",
  "../../packages/integration/agent-constitution-activation/src",
  "../../packages/integration/agent-constitution-policy/src",
  "../../packages/integration/agent-constitution-conformance/src",
  "../../packages/capabilities/agentic-proposer/src",
  "../../packages/policy-authority/src",
  "../../packages/uvi-policy-contracts/src",
  "../../packages/governance-contracts/src",
  "../../packages/jcs/src",
  "../../packages/integration/ai-system-registry/src",
  "../../packages/integration/data-use-admission/src",
  "../../packages/integration/vendor-dependency/src",
  "../../packages/integration/clearance-export/src",
  "../../packages/capabilities/action-clearance/src",
  "../../packages/integration/agent-constitution-policy/tests",
  "../../packages/integration/agent-constitution-activation/tests",
  "../../packages/policy-authority/tests",
]
testpaths = ["tests"]
addopts = "-q"
