name: cloud-scaling-operations-package-ci

# Scoped CI for the controlled-execution Cloud Scaling Operations package. This package
# is execution-capable, so CI proves the authority boundary, not advisory-only-ness.
# No real cluster credentials are used and no external infrastructure is mutated: all
# execution tests use local fakes.

on:
  push:
    paths:
      - "packages/capabilities/cloud-scaling-operations/**"
      - "packages/capabilities/cloud-scaling-controller/**"
      - "cloud_scaling_operations/**"
      - "cloud_controller/**"
      - "symbolu/__init__.py"
      - "tests/cloud_controller/**"
      - "conftest.py"
      # The sweep engine. A change to an operator or a detector changes what this
      # package's guard sweep measures without touching a byte inside the package.
      - "scripts/cloud_scaling/guard_sweep.py"
      - "scripts/cloud_scaling/tests/**"
      - ".github/workflows/cloud-scaling-operations-package-ci.yml"
  pull_request:
    paths:
      - "packages/capabilities/cloud-scaling-operations/**"
      - "packages/capabilities/cloud-scaling-controller/**"
      - "cloud_scaling_operations/**"
      - "cloud_controller/**"
      - "symbolu/__init__.py"
      - "tests/cloud_controller/**"
      - "conftest.py"
      # The sweep engine. A change to an operator or a detector changes what this
      # package's guard sweep measures without touching a byte inside the package.
      - "scripts/cloud_scaling/guard_sweep.py"
      - "scripts/cloud_scaling/tests/**"
      - ".github/workflows/cloud-scaling-operations-package-ci.yml"

jobs:
  cloud-scaling-operations-package:
    runs-on: ubuntu-latest
    env:
      OPS: packages/capabilities/cloud-scaling-operations
      ADV: packages/capabilities/cloud-scaling-controller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tooling
        run: python -m pip install --upgrade pip build pytest pip-audit numpy

      - name: Byte-compile (syntax) check
        run: python -m py_compile $(git ls-files "$OPS/src" | grep '\.py$')

      - name: Forbidden-import scan (core imports no cloud SDK at top level)
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          src = pathlib.Path("packages/capabilities/cloud-scaling-operations/src/ugence_cloud_scaling_operations")
          forbidden_top = {"boto3","botocore","azure","kubernetes","prometheus_client",
                           "opentelemetry","yaml","fastapi","uvicorn","flask"}
          bad = []
          for p in src.rglob("*.py"):
              for node in ast.parse(p.read_text()).body:
                  mods = []
                  if isinstance(node, ast.Import):
                      mods = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                      mods = [node.module.split(".")[0]]
                  bad += [f"{p}: {m}" for m in mods if m in forbidden_top]
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("forbidden-import scan clean")
          PY

      - name: Operations package tests (authority / execution / modes / security)
        run: python -m pytest "$OPS/tests" -q

      - name: Advisory-boundary regression (advisory stays advisory-only)
        run: python -m pytest "$ADV/tests" -q

      - name: Existing Cloud Scaling regression (legacy identity intact)
        run: python -m pytest tests/cloud_controller -q

      - name: Build wheel + sdist
        run: python -m build "$OPS" -o "$OPS/dist"

      - name: Clean-environment distribution verifier
        run: python "$OPS/verify_cloud_scaling_operations_distribution.py"

      - name: CLI smoke (non-mutating default)
        run: |
          python - <<'PY'
          import json, subprocess, sys, os, re, pathlib
          src = "packages/capabilities/cloud-scaling-operations/src"
          adv = "packages/capabilities/cloud-scaling-controller/src"
          # Track the single source of truth (version.py) rather than a hardcoded literal,
          # so an operations version bump can never silently drift this smoke check.
          expected_version = re.search(
              r'__version__\s*=\s*"([^"]+)"',
              pathlib.Path(src, "ugence_cloud_scaling_operations", "version.py").read_text(),
          ).group(1)
          def run(args, **kw):
              return subprocess.run([sys.executable, "-m",
                  "ugence_cloud_scaling_operations.cli", *args],
                  env={"PYTHONPATH": os.pathsep.join([src, adv]), "PATH": os.environ["PATH"]},
                  capture_output=True, text=True, **kw)
          v = run(["version"]); assert v.returncode == 0 and expected_version in v.stdout, (expected_version, v.stdout, v.stderr)
          i = run(["inspect-capabilities"]); assert "INFRASTRUCTURE_MUTATION" in i.stdout, i.stderr
          e = run(["execute"]); assert e.returncode != 0, "execute must not mutate by default"
          print("CLI smoke OK")
          PY

      - name: pip check + pip-audit (installed runtime closure)
        run: |
          python -m build "$ADV" -o "$OPS/dist"
          python -m venv /tmp/cso-audit
          /tmp/cso-audit/bin/python -m pip install --quiet --find-links "$OPS/dist" ugence-cloud-scaling-operations
          /tmp/cso-audit/bin/python -m pip check
          /tmp/cso-audit/bin/python -m pip freeze \
            | grep -ivE "^(pip|setuptools|wheel|ugence-cloud-scaling-operations|ugence-cloud-scaling-controller)==" \
            > /tmp/cso-reqs.txt
          echo "auditing runtime closure:" && cat /tmp/cso-reqs.txt
          python -m pip_audit -r /tmp/cso-reqs.txt

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-scaling-operations-evidence
          path: |
            packages/capabilities/cloud-scaling-operations/artifacts/*.json
            packages/capabilities/cloud-scaling-operations/dist/*
          if-no-files-found: warn

  guard-sweep:
    name: Guard inventory is re-derivable, and every scored site is killed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        # The suite runs from a bare checkout — the tests' conftest resolves this
        # package's src and the advisory controller through the checkout. Nothing is
        # pip-installed on purpose: an editable install of the repository would shadow
        # the disposable copy the sweep mutates, and every mutant would import unmutated
        # code.
        #
        # ``requests`` is the Cloud Scaling Controller's declared optional dependency,
        # behind its read-only ``prometheus`` / ``shadow`` extras. This suite constructs
        # a ProductionOrchestrator, which builds the controller's signal pipeline, which
        # builds a PrometheusClient — so without it one boundary test fails on an
        # ImportError rather than on a violation, and the sweep refuses the red baseline.
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy "requests>=2.28.0"

      - name: The checked-in inventory is regenerated, not hand-edited
        # `--inventory-only` also fails on an exclusion that names no guard, one with a
        # reason outside the closed vocabulary, an `except` arm with no declared collapse
        # sentinel, and — since the nested-module hardening — a production module that is
        # neither walked by module_order nor excluded with a concrete reason.
        run: |
          python scripts/cloud_scaling/guard_sweep.py operations --inventory-only
          git diff --exit-code -- \
            packages/capabilities/cloud-scaling-operations/GUARD_INVENTORY.md \
            packages/capabilities/cloud-scaling-operations/guard_inventory.json \
            packages/capabilities/cloud-scaling-operations/guard_classification.json

      - name: The sweep's own enforcement machinery is measured, not assumed
        run: python -m pytest scripts/cloud_scaling/tests -q

      - name: Sweep every site
        # 55 sites against a ~2s suite: a single shard finishes in minutes. Refuses a red
        # baseline outright (exit 2) rather than scoring against it, and exits non-zero
        # on a surviving scored guard or an unscored one.
        run: python scripts/cloud_scaling/guard_sweep.py operations --shard 1/1

      - name: The tracked tree was not mutated
        run: git diff --exit-code
        if: always()

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operations-guard-sweep-shard-1
          path: /tmp/ugence-sweep-operations/*.json
          if-no-files-found: warn

  guard-sweep-aggregate:
    name: Every inventoried site produced exactly one result
    runs-on: ubuntu-latest
    needs: guard-sweep
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: operations-guard-sweep-shard-*
          merge-multiple: true
          path: shards
      - name: Prove the sweep was total, and block on every way it can be incomplete
        run: |
          python scripts/cloud_scaling/guard_sweep.py operations \
            --aggregate shards --shards 1
      - name: The totals are the ones this package ratified
        # The doctrine-extension ruling's bar (2026-08-31): zero surviving SCORED, zero
        # unscored and zero message-only kills, with exclusions allowed solely in the
        # process-entrypoint layer, named individually.
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys

          report = json.load(
              open(
                  "packages/capabilities/cloud-scaling-operations/"
                  "guard_sweep_aggregate.json"
              )
          )
          excluded = sorted(
              f"{row['module']}:{row['line']}"
              for row in report["classification"].values()
              if row["status"] == "EXCLUDED"
          )
          print(
              f"inventory={report['inventory_total']} killed={len(report['killed'])} "
              f"survived={len(report['survived'])} unscored={len(report['unscored'])} "
              f"excluded={len(excluded)} minting={len(report['minting_guards'])} "
              f"message_only={len(report['message_only_kills'])} "
              f"baselines={report['baselines']}"
          )
          problems = []
          # Re-measured for 0.2.0 (orchestrator containment ruling): the suite grew to
          # 179 with tests/boundaries/test_orchestrator_containment.py, and the three
          # containment guards (engine, rollback monitor, service entrypoint) raise the
          # inventory to 58 and the killed count to 54.
          if report["baselines"] != {"1": 179}:
              problems.append(
                  f"baseline collected {report['baselines']}, expected {{'1': 179}}"
              )
          if report["inventory_total"] != 58:
              problems.append(f"inventory is {report['inventory_total']}, not 58")
          if len(report["killed"]) != 54:
              problems.append(f"{len(report['killed'])} sites killed, not 54")
          if report["message_only_kills"]:
              problems.append(
                  f"message-only kills: {report['message_only_kills']}; the extension "
                  "ruling forbids scoring a kill attributable to prose alone"
              )
          expected = [
              "cli.py:229",
              "main.py:282",
              "main.py:339",
              "main.py:340",
          ]
          if excluded != expected:
              problems.append(f"excluded sites are {excluded}, not {expected}")
          if problems:
              sys.exit("FAIL: " + "; ".join(problems))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operations-guard-sweep-aggregate
          path: packages/capabilities/cloud-scaling-operations/guard_sweep_aggregate.json
          if-no-files-found: warn
