name: governance-studio-p3d-frontend-ci

# Path-scoped: frontend, the frozen contract, the backend it consumes, the
# canonical + v2 fixtures, the P3D audits and this workflow. No deploy, no
# secrets, no external model APIs.
on:
  push:
    paths:
      - "apps/ugence-governance-studio/frontend/**"
      - "apps/ugence-governance-studio/contracts/openapi.json"
      - "apps/ugence-governance-studio/contracts/openapi_v2.json"
      - "apps/ugence-governance-studio/backend/**"
      - "apps/ugence-governance-studio/demo_data/**"
      - "apps/ugence-governance-studio/expected_outputs/**"
      - "packages/capabilities/agent-workforce-composer/conformance/**"
      - "docs/audits/ugence_governance_studio_p3d/**"
      - ".github/workflows/governance-studio-p3d-frontend-ci.yml"
  pull_request:
    paths:
      - "apps/ugence-governance-studio/frontend/**"
      - "apps/ugence-governance-studio/contracts/openapi.json"
      - "apps/ugence-governance-studio/contracts/openapi_v2.json"
      - "apps/ugence-governance-studio/backend/**"
      - ".github/workflows/governance-studio-p3d-frontend-ci.yml"

env:
  FE: apps/ugence-governance-studio/frontend
  PYTHONPATH: >-
    apps/ugence-governance-studio/backend/src:packages/capabilities/agent-workforce-composer/src:packages/tooling/policy-workflow-compiler/src

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ugence-governance-studio/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/ugence-governance-studio/frontend/package-lock.json
      - run: npm ci

      - name: openapi-client-freeze
        run: npm run verify:openapi
      - name: public-api-operation-allowlist
        run: npm run verify:api-boundary

      # --- Governed Agent Studio (GAS-4/5) -------------------------------
      # Separate steps from the v1 ones above, because the two contracts are
      # frozen independently and a shared gate would couple them.
      - name: v2-openapi-client-drift
        run: npm run verify:openapi-v2

      - name: v2-api-boundary-and-sd2
        run: npm run verify:v2-api-boundary
      - name: architecture-boundary
        run: npm run verify:boundary
      - name: terminology
        run: npm run verify:terminology
      - name: permission-proposal-terminology
        run: npx vitest run tests/permission-scope.test.tsx
      - name: contrast-verification
        run: npm run verify:contrast
      - name: contrast-classification
        run: npx vitest run tests/contrast.test.ts
      - name: v1-surface-must-be-byte-identical
        working-directory: .
        run: |
          # The GAS-4/5 constraint, checked against git: v2 exists, and none of v1's
          # frozen artifacts moved. A regenerated-but-self-consistent v1 still fails.
          for f in \
            apps/ugence-governance-studio/contracts/openapi.json \
            apps/ugence-governance-studio/frontend/src/generated/api.ts \
            apps/ugence-governance-studio/frontend/src/generated/openapi.hash.json \
            apps/ugence-governance-studio/frontend/security/approved-api-operations.json; do
            if ! git diff --quiet HEAD -- "$f"; then
              echo "v1 surface modified: $f — v2 must be additive."
              git --no-pager diff -- "$f"
              exit 1
            fi
          done
          echo "v1 surface unchanged."

      - name: frontend-version-consistency
        run: npm run verify:version
      - name: tracked-source-verification
        run: npm run verify:tracked-sources
      - name: production-dependency-audit
        run: npm run audit:dependencies
      - name: dependency-exception-validation
        run: npx vitest run tests/dependency-audit.test.ts
      - name: typecheck
        run: npm run type-check
      - name: lint
        run: npm run lint
      - name: response-decoder-tests
        run: npx vitest run tests/decoders.test.ts
      - name: api-allowlist-tests
        run: npx vitest run tests/api-allowlist.test.ts
      - name: unit-tests
        run: npx vitest run tests/unit.test.ts tests/client.test.ts
      - name: component-tests
        run: npx vitest run tests/screens.test.tsx tests/roles.test.tsx tests/compatibility.test.tsx
      - name: ranking-ui-suite
        run: npx vitest run tests/p3d-screens.test.tsx -t "Ranking Explorer"
      - name: composition-ui-suite
        run: npx vitest run tests/p3d-screens.test.tsx -t "Composition Explorer"
      - name: plan-state-domain-rendering
        run: npx vitest run tests/plan-states.test.tsx
      - name: permission-proposal-suite
        run: npx vitest run tests/p3d-screens.test.tsx -t "Permission proposals"
      - name: fallback-suite
        run: npx vitest run tests/p3d-screens.test.tsx -t "Fallback Explorer"
      - name: replay-suite
        run: npx vitest run tests/p3d-screens.test.tsx -t "Replay"
      - name: comparison-suite
        run: npx vitest run tests/p3d-screens.test.tsx -t "Comparison"
      - name: what-if-suite
        run: npx vitest run tests/p3d-screens.test.tsx -t "Controlled what-if"
      - name: what-if-request-matrix
        run: npx vitest run tests/whatif-mapping.test.ts tests/whatif-screen.test.tsx
      - name: accessibility-suite
        run: npx vitest run tests/a11y.test.tsx
      - name: production-build
        run: npm run build
      - name: bundle-report
        run: du -sh dist && ls -la dist/assets
      - name: clean-checkout-build
        working-directory: ${{ github.workspace }}
        run: |
          set -e
          TMP="$(mktemp -d)"
          # archive the committed tree (frontend + the frozen contract it reads)
          git archive HEAD apps/ugence-governance-studio/frontend apps/ugence-governance-studio/contracts | tar -x -C "$TMP"
          cd "$TMP/apps/ugence-governance-studio/frontend"
          # the archived tree is not a git repo, so tracked-source (git ls-files) runs
          # in the main job; here we prove the committed files alone build cleanly.
          test -f src/lib/config.ts && test -f src/lib/domain.ts && test -f src/lib/domain-p3d.ts
          npm ci
          npm run verify:version
          npm run verify:api-boundary
          npm run type-check
          npm run build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/ugence-governance-studio/frontend/package-lock.json
      - name: Install backend + tooling
        run: |
          # Install the compiler + AWC editables in the SAME resolver transaction as the
          # backend so the backend's local `ugence-agent-workforce-composer` dependency
          # resolves from the monorepo instead of being sought on PyPI.
          pip install -c apps/ugence-governance-studio/backend/constraints.txt \
            "pydantic>=2" "fastapi>=0.110" "uvicorn>=0.27" "starlette>=0.36" httpx pytest \
            -e packages/tooling/policy-workflow-compiler \
            -e packages/capabilities/agent-workforce-composer \
            apps/ugence-governance-studio/backend

      - name: p3c-prerequisite
        run: python -m pytest apps/ugence-governance-studio/backend/tests -q

      - name: p3b-contract-adequacy
        # the frozen contract must still expose every operation P3D consumes
        run: |
          python - <<'PY'
          import json, hashlib, pathlib
          p = pathlib.Path("apps/ugence-governance-studio/contracts/openapi.json")
          data = p.read_bytes()
          sha = hashlib.sha256(data).hexdigest()
          assert sha == "dc309eab216e1a4c2f63f286887a4ef218a96ac34f8fa8614bff176db7c36656", sha
          spec = json.loads(data)
          ops = {o["operationId"] for path in spec["paths"].values()
                 for o in path.values() if isinstance(o, dict) and "operationId" in o}
          required = {
              "get_scenario_ranking", "get_scenario_plan", "explain_plan", "explain_ranking",
              "replay_plan", "compare_plans", "scenario_what_if", "export_scenario",
              "get_scenario_eligibility", "explain_eligibility", "list_scenarios",
          }
          missing = required - ops
          assert not missing, f"contract missing P3D operations: {missing}"
          print("P3B contract adequacy OK — sha256 unchanged, all P3D operations present")
          PY

      - name: awc-version-compatibility
        run: |
          python -c "import ugence_agent_workforce_composer.api as a; \
          assert a.__version__=='0.2.1', a.__version__; \
          from ugence_governance_studio_api.version import awc_version_supported; \
          assert awc_version_supported('0.2.1') and not awc_version_supported('0.3.0'); \
          print('AWC compatibility OK')"

      - name: fixture-bundle-integrity
        run: python apps/ugence-governance-studio/backend/scripts/verify_fixture_bundle.py

      - name: Install frontend + browser
        working-directory: apps/ugence-governance-studio/frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: backend-integration
        working-directory: apps/ugence-governance-studio/frontend
        run: npx playwright test e2e/eligibility-explorer.spec.ts

      - name: browser-e2e-all-scenarios
        working-directory: apps/ugence-governance-studio/frontend
        # all four planning-explorer scenario flows against the real local backend
        run: npx playwright test e2e/planning-explorer.spec.ts

      - name: what-if-real-backend-matrix
        working-directory: apps/ugence-governance-studio/frontend
        # all nine controlled what-if operations against the real local backend
        run: npx playwright test e2e/what-if-matrix.spec.ts

      - name: platform-freeze
        run: python -m platform_freeze.verify
