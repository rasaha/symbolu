name: GCC Safety Enforcement (C-1)

# =============================================================================
# Generative Containment Constraint (GCC) CI
# =============================================================================
# This workflow enforces the C-1 safety constraint:
#   - Static scanning of constrained modules
#   - Runtime guard validation
#   - Ledger invariant verification
#   - Determinism verification (100 runs)
#
# FAIL-CLOSED: Any violation blocks the merge.
# =============================================================================

on:
  push:
    branches: ["main", "master", "dev", "claude/**"]
    paths:
      - "symbolu/ontology/router/**"
      - "symbolu/ledger/**"
      - "symbolu/safety/**"
      - "tests/test_gcc_enforcement.py"
      - ".github/workflows/gcc-safety-ci.yml"
  pull_request:
    branches: ["main", "master", "dev", "claude/**"]
    paths:
      - "symbolu/ontology/router/**"
      - "symbolu/ledger/**"
      - "symbolu/safety/**"
      - "tests/test_gcc_enforcement.py"
      - ".github/workflows/gcc-safety-ci.yml"
  workflow_dispatch:

jobs:
  # ===========================================================================
  # Static Analysis - Forbidden Symbol Scanner
  # ===========================================================================
  gcc-static-scan:
    name: GCC Static Scanner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .

      - name: Run GCC Static Scanner
        id: static-scan
        run: |
          echo "=========================================="
          echo "GCC STATIC SCANNER - FORBIDDEN SYMBOLS"
          echo "=========================================="
          python -m symbolu.safety.gcc_static_scanner \
            --repo-root . \
            --output text \
            2>&1 | tee gcc-static-scan.log
          exit_code=${PIPESTATUS[0]}
          echo "scanner_exit_code=$exit_code" >> $GITHUB_OUTPUT
          if [ $exit_code -eq 0 ]; then
            echo "status=PASS" >> $GITHUB_OUTPUT
          else
            echo "status=FAIL" >> $GITHUB_OUTPUT
          fi
          exit $exit_code

      - name: Upload Static Scan Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc-static-scan-log
          path: gcc-static-scan.log

  # ===========================================================================
  # Runtime Guard Tests
  # ===========================================================================
  gcc-runtime-tests:
    name: GCC Runtime Guard Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Load cached dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-gcc-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-gcc-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .
          pip install pytest pytest-cov

      - name: Run GCC Runtime Guard Tests
        run: |
          echo "=========================================="
          echo "GCC RUNTIME GUARD TESTS"
          echo "=========================================="
          pytest tests/test_gcc_enforcement.py \
            -v \
            --tb=short \
            --disable-warnings \
            2>&1 | tee gcc-runtime-tests.log

      - name: Upload Runtime Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc-runtime-tests-log
          path: gcc-runtime-tests.log

  # ===========================================================================
  # Determinism Verification (100 Runs)
  # ===========================================================================
  gcc-determinism:
    name: GCC Determinism Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .
          pip install pytest

      - name: Run Determinism Tests (100 Runs)
        run: |
          echo "=========================================="
          echo "GCC DETERMINISM VERIFICATION (100 RUNS)"
          echo "=========================================="
          pytest tests/test_gcc_enforcement.py \
            -v \
            -k "determinism" \
            --tb=short \
            --disable-warnings \
            2>&1 | tee gcc-determinism.log

      - name: Upload Determinism Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc-determinism-log
          path: gcc-determinism.log

  # ===========================================================================
  # Ledger Invariant Verification
  # ===========================================================================
  gcc-ledger-invariant:
    name: GCC Ledger Invariant Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .
          pip install pytest

      - name: Run Ledger Invariant Tests
        run: |
          echo "=========================================="
          echo "GCC LEDGER INVARIANT VERIFICATION"
          echo "=========================================="
          pytest tests/test_gcc_enforcement.py \
            -v \
            -k "Ledger" \
            --tb=short \
            --disable-warnings \
            2>&1 | tee gcc-ledger-invariant.log

      - name: Upload Ledger Invariant Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc-ledger-invariant-log
          path: gcc-ledger-invariant.log

  # ===========================================================================
  # Integration with Existing Router Tests
  # ===========================================================================
  gcc-router-integration:
    name: GCC Router Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .
          pip install pytest

      - name: Run Router + GCC Integration Tests
        run: |
          echo "=========================================="
          echo "GCC + ONTOLOGICAL ROUTER INTEGRATION"
          echo "=========================================="
          pytest tests/ontology_router/test_ontological_router_r1.py \
            tests/test_ledger_replay_verifier.py \
            tests/test_gcc_enforcement.py::TestExistingValidPaths \
            -v \
            --tb=short \
            --disable-warnings \
            2>&1 | tee gcc-router-integration.log

      - name: Upload Integration Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gcc-router-integration-log
          path: gcc-router-integration.log

  # ===========================================================================
  # Final Safety Gate
  # ===========================================================================
  gcc-safety-gate:
    name: GCC Safety Gate (FINAL)
    runs-on: ubuntu-latest
    needs:
      - gcc-static-scan
      - gcc-runtime-tests
      - gcc-determinism
      - gcc-ledger-invariant
      - gcc-router-integration

    steps:
      - name: GCC Safety Gate Check
        run: |
          echo "=========================================="
          echo "GCC SAFETY GATE: ALL CHECKS PASSED"
          echo "=========================================="
          echo ""
          echo "VERIFIED INVARIANTS:"
          echo "  [x] Static scan: No forbidden symbols"
          echo "  [x] Runtime guard: All violations rejected"
          echo "  [x] Determinism: 100-run consistency"
          echo "  [x] Ledger invariant: No semantic content"
          echo "  [x] Router integration: Valid paths unchanged"
          echo ""
          echo "=========================================="
          echo "C-1 GENERATIVE CONTAINMENT CONSTRAINT: ENFORCED"
          echo "=========================================="

      - name: Create Safety Report
        run: |
          cat > gcc-safety-report.md << 'EOF'
          # GCC Safety Report (C-1)

          ## Status: PASS

          All Generative Containment Constraint checks passed.

          ### Verified Invariants

          | Invariant | Status |
          |-----------|--------|
          | NON_EXPRESSIVE | ENFORCED |
          | FAIL_CLOSED | ENFORCED |
          | NO_FREE_TEXT | ENFORCED |
          | NO_SEMANTICS | ENFORCED |
          | NO_GENERATION | ENFORCED |
          | DETERMINISTIC | ENFORCED |
          | AUDITABLE | ENFORCED |

          ### Checks Completed

          - Static Scanner: No forbidden symbols in constrained modules
          - Runtime Guard: All violation types properly rejected
          - Determinism: Consistent over 100 runs
          - Ledger Invariant: No semantic content allowed
          - Router Integration: Existing valid paths unchanged

          ---
          *This constraint is PERMANENT and IRREVERSIBLE.*
          EOF

      - name: Upload Safety Report
        uses: actions/upload-artifact@v4
        with:
          name: gcc-safety-report
          path: gcc-safety-report.md
