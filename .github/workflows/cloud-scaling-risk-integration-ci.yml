name: cloud-scaling-risk-integration-ci

# Scoped CI for the Cloud Scaling Phase 4C adapter
# (ugence-cloud-scaling-risk-integration): the one-way, non-executing projection of an
# advisory CapacityActionRecommendation into the Risk Authority v2 subject-risk contract.
#
# This workflow is additive and path-scoped: it does NOT touch or weaken
# cloud-scaling-controller-package-ci or risk-authority-ci. It runs the adapter suite
# (including the adversarial and gate-removal probes), proves the Cloud Scaling
# Controller and Risk Authority baselines remain green and unchanged, re-verifies the
# frozen v1/v2 request digests, and builds + installs the wheel offline to prove that
# installed behavior matches source behavior digest for digest.

on:
  pull_request:
    paths:
      - "packages/integration/cloud-scaling-risk-integration/**"
      - "packages/capabilities/cloud-scaling-controller/**"
      - "packages/risk_authority/**"
      - "docs/architecture/ADR_CLOUD_SCALING_RISK_AUTHORITY_INTEGRATION_PHASE4.md"
      - "docs/architecture/ADR_CLOUD_SCALING_GUARD_COVERAGE.md"
      # The sweep engine. A change to an operator or a detector changes what this
      # package's guard sweep measures without touching a byte inside the package, so
      # a filter that omits it lets the engine drift past this gate unmeasured. An
      # audit of the guard-coverage work found a real defect of exactly that shape:
      # a bare-name match in `_raising_helpers` let a non-guard call be inventoried
      # and scored KILLED, and no package-scoped filter would have re-run this sweep
      # to catch it.
      - "scripts/cloud_scaling/guard_sweep.py"
      - "scripts/cloud_scaling/tests/**"
      - ".github/workflows/cloud-scaling-risk-integration-ci.yml"
  push:
    branches:
      - "claude/cloud-scaling-phase-4c-**"
      - "claude/setup-symbolu-monorepo-**"
      - "claude/guard-coverage-**"
    paths:
      - "packages/integration/cloud-scaling-risk-integration/**"
      - "scripts/cloud_scaling/guard_sweep.py"
      - "scripts/cloud_scaling/tests/**"
      - ".github/workflows/cloud-scaling-risk-integration-ci.yml"

defaults:
  run:
    shell: bash

jobs:
  adapter-suite:
    name: Phase 4C adapter suite (source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling + first-party packages (editable)
        run: |
          python -m pip install --upgrade pip
          pip install pytest build numpy
          pip install -e packages/risk_authority
          pip install -e packages/capabilities/cloud-scaling-controller
          pip install -e packages/integration/cloud-scaling-risk-integration
      - name: Adapter suite (projection, authenticity, adversarial, time, abstention)
        run: python -m pytest packages/integration/cloud-scaling-risk-integration/tests -q
      - name: Security gates — adversarial + gate-removal probes (explicit acceptance gate)
        run: |
          python -m pytest \
            packages/integration/cloud-scaling-risk-integration/tests/test_authenticity.py \
            packages/integration/cloud-scaling-risk-integration/tests/test_adversarial.py \
            packages/integration/cloud-scaling-risk-integration/tests/test_gate_removal_probes.py \
            packages/integration/cloud-scaling-risk-integration/tests/test_phase_boundary.py \
            packages/integration/cloud-scaling-risk-integration/tests/test_token_integrity.py -q
      - name: Frozen-digest regression (v1 + Phase 4A v2 must be byte-identical)
        run: |
          python -m pytest \
            packages/integration/cloud-scaling-risk-integration/tests/test_frozen_digests.py -q

  baseline-regression:
    name: Controller + Risk Authority baselines remain green & unchanged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          # `build` is required by the Risk Authority distribution verifier below, which
          # builds and installs the RA wheel into a throwaway environment.
          pip install pytest numpy build
          pip install -e packages/risk_authority
          pip install -e packages/capabilities/cloud-scaling-controller
      - name: Risk Authority conformance suite (must remain green + unchanged)
        run: python -m pytest packages/risk_authority/tests -q
      - name: Cloud Scaling Controller suite (must remain green + unchanged)
        run: python -m pytest packages/capabilities/cloud-scaling-controller/tests -q
      - name: Risk Authority distribution verifier (v2 Phase 4A/4B digests)
        run: python packages/risk_authority/verify_risk_authority_distribution.py

  isolated-install:
    name: Wheel build + offline isolated install + source-vs-installed probes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Host-side tooling only. This is the RUNNER environment, not the isolated
      # installation under test: the verifier builds its own throwaway virtualenv and
      # installs into it with the index structurally disabled (--no-index, PIP_NO_INDEX,
      # an unroutable sentinel index, no cache, no pip upgrade, no editable install).
      - name: Install build tooling (host environment)
        run: |
          python -m pip install --upgrade pip
          # numpy is required by the HOST step that computes the source-side expected
          # digests: it imports the controller from the source tree, and the controller
          # imports numpy. It is unrelated to the isolated environment, which gets its
          # own numpy from the local wheelhouse with no index reachable.
          pip install build wheel pytest numpy
      - name: Genuinely offline isolated install + negative controls + source-vs-installed
        # Phase A (online) builds first-party wheels and downloads the full dependency
        # closure — including numpy — into a local wheelhouse. Phase B installs from that
        # wheelhouse alone with no index reachable. Phase C proves the guarantee by
        # negative control: a missing wheel fails, a bogus index cannot rescue it, and a
        # failed install leaves nothing importable.
        run: python packages/integration/cloud-scaling-risk-integration/scripts/verify_isolated_install.py
      - name: Build sdist + wheel (distribution artifacts)
        run: python -m build packages/integration/cloud-scaling-risk-integration
      - name: Package boundary tests (declared deps, no reverse cycle, leaves preserved)
        run: |
          pip install -e packages/risk_authority \
                      -e packages/capabilities/cloud-scaling-controller \
                      -e packages/integration/cloud-scaling-risk-integration
          python -m pytest packages/integration/cloud-scaling-risk-integration/tests/packaging -q
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-scaling-risk-integration-dist
          path: packages/integration/cloud-scaling-risk-integration/dist/*
          if-no-files-found: warn

  guard-sweep:
    name: Guard inventory is re-derivable, and every scored site is killed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling + first-party packages (editable)
        # numpy is not optional here: the controller's Phase-3 planning pipeline needs it,
        # and the adapter suite builds every recommendation through that real pipeline. A
        # runner without it does not fail the sweep, it fails *collection* — which the
        # engine reports as an unscorable baseline rather than a red suite.
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy
          pip install -e packages/risk_authority
          pip install -e packages/capabilities/cloud-scaling-controller
          pip install -e packages/integration/cloud-scaling-risk-integration

      - name: The checked-in inventory is regenerated, not hand-edited
        # Runs before the sweep, deliberately: this is the cheap check that catches a guard
        # added without a classification or removed without anyone noticing, and a stale
        # inventory would make every number below answer a question about a different
        # program. `--inventory-only` also fails on an exclusion that names no guard, one
        # with a reason outside the closed vocabulary, one whose key is ambiguous, and an
        # `except` arm whose reason vocabulary has no declared collapse sentinel.
        run: |
          python scripts/cloud_scaling/guard_sweep.py risk-integration --inventory-only
          git diff --exit-code -- \
            packages/integration/cloud-scaling-risk-integration/GUARD_INVENTORY.md \
            packages/integration/cloud-scaling-risk-integration/guard_inventory.json \
            packages/integration/cloud-scaling-risk-integration/guard_classification.json

      - name: The sweep's own enforcement machinery is measured, not assumed
        # This package is the only one that enables all three additive classes, so it is
        # the only place D-GC-3's reason-collapse operator has a member at all. The sweep
        # measures the *suite*; these tests measure the *mutation*, which a sweep cannot
        # distinguish from a mutation that silently did nothing.
        run: python -m pytest scripts/cloud_scaling/tests -q

      - name: Sweep every site
        # Refuses a red baseline outright (exit 2) rather than scoring against it: a test
        # that was already failing satisfies "some test failed" without the mutation having
        # done anything, which would credit every guard with a kill it did not earn. Also
        # exits non-zero on a surviving scored guard or an unscored one.
        run: python scripts/cloud_scaling/guard_sweep.py risk-integration --shard 1/1

      - name: The tracked tree was not mutated
        # The sweep works in a disposable copy outside the repository. This is what proves it.
        run: git diff --exit-code
        if: always()

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: risk-integration-guard-sweep-shard-1
          path: /tmp/ugence-sweep-risk-integration/*.json
          if-no-files-found: warn

  guard-sweep-aggregate:
    name: Every inventoried site produced exactly one result
    runs-on: ubuntu-latest
    needs: guard-sweep
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: risk-integration-guard-sweep-shard-*
          merge-multiple: true
          path: shards
      - name: Prove the sweep was total, and block on every way it can be incomplete
        # A single shard still has to prove totality: a job that died halfway produces no
        # duplicate either, so absence is checked directly against the real inventory
        # rather than inferred from the shard arithmetic. At `--shards 1` two of the
        # aggregator's checks are vacuous and are not claimed here — `misassigned_guards`
        # is always empty because `shard_of(i, 1)` is 1 for every i, and `baseline_agrees`
        # is trivially true over one baseline value. The step below pins the baseline
        # population instead.
        run: |
          python scripts/cloud_scaling/guard_sweep.py risk-integration \
            --aggregate shards --shards 1
      - name: The totals are the ones this package ratified
        # The aggregator proves the sweep was well-formed; this asserts the *result*. The
        # owner ruled on 2026-08-30 that Risk adopts CI only at zero surviving SCORED,
        # zero unscored and zero message-only kills, with exclusions allowed solely where
        # the reason is positively shown. A future change that quietly traded a killed
        # site for an excluded one would pass every check above and fail here, where the
        # closed exclusion vocabulary is not a decision CI may make on its own.
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys

          report = json.load(
              open(
                  "packages/integration/cloud-scaling-risk-integration/"
                  "guard_sweep_aggregate.json"
              )
          )
          excluded = sorted(
              f"{row['module']}:{row['line']}"
              for row in report["classification"].values()
              if row["status"] == "EXCLUDED"
          )
          print(
              f"inventory={report['inventory_total']} killed={len(report['killed'])} "
              f"survived={len(report['survived'])} unscored={len(report['unscored'])} "
              f"excluded={len(excluded)} minting={len(report['minting_guards'])} "
              f"message_only={len(report['message_only_kills'])} "
              f"baselines={report['baselines']}"
          )
          problems = []
          # The baseline population, pinned because `baseline_agrees` cannot check it at
          # n=1. A sweep whose baseline collected a different number of tests is measuring
          # a different suite, and every other check above would still pass.
          if report["baselines"] != {"1": 374}:
              problems.append(
                  f"baseline collected {report['baselines']}, expected {{'1': 374}}"
              )
          if report["inventory_total"] != 100:
              problems.append(f"inventory is {report['inventory_total']}, not 100")
          if len(report["killed"]) != 92:
              problems.append(f"{len(report['killed'])} sites killed, not 92")
          # Named individually, not counted. An exclusion is a ratified statement about a
          # specific site; a count would let one be swapped for another silently.
          expected = [
              "adapter.py:152",
              "adapter.py:186",
              "adapter.py:211",
              "adapter.py:222",
              "adapter.py:266",
              "adapter.py:271",
              "identifiers.py:88",
              "projection.py:252",
          ]
          if excluded != expected:
              problems.append(f"excluded sites are {excluded}, not {expected}")
          if problems:
              sys.exit("FAIL: " + "; ".join(problems))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: risk-integration-guard-sweep-aggregate
          path: packages/integration/cloud-scaling-risk-integration/guard_sweep_aggregate.json
          if-no-files-found: warn
