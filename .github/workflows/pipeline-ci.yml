name: SymbolU Pipeline CI

on:
  push:
    branches: ["main", "master"]
    paths:
      - "symbolu/mechanical/pipeline/**"
      - "symbolu/mechanical/persona/**"
      - "symbolu/mechanical/fusion/**"
      - "symbolu/mechanical/hrm/**"
      - "symbolu/mechanical/lcm/**"
      - "symbolu/mechanical/lam/**"
      - "symbolu/mechanical/mlcr/**"
      - "symbolu/mechanical/renderer/**"
      - "symbolu/mechanical/dha/**"
      - "symbolu/temporal/**"
      - "symbolu/core/coherence/**"
      - "symbolu/formulas/**"
      - "symbolu/api/**"
      - "symbolu/policy/**"
      - "symbolu/adapter/**"
      - "tests/test_phase28_symbolic_harmonization_renderer.py"
      - "tests/test_phase29_persona_resonance.py"
      - "tests/test_phase30_cross_layer_resonance_mapping.py"
      - "tests/test_phase32_insight_window.py"
      - "tests/test_phase33_schema_adaptive_routing.py"
      - "tests/test_phase34_identity_harmonics.py"
      - "symbolu/service/**"
      - "symbolu/service/security/**"
      - "symbolu/service/sessions/**"
      - "symbolu/service/preferences/**"
      - "symbolu/intent/**"
      - "symbolu/identity/**"
      - "symbolu/motivation/**"
      - "symbolu/core/motivation_drift_tests/**"
      - "symbolu/tools/coherence_dashboard/**"
      - "symbolu/tools/unified_dashboard/**"
      - "docs/**"
      - ".github/workflows/pipeline-ci.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "symbolu/mechanical/pipeline/**"
      - "symbolu/mechanical/persona/**"
      - "symbolu/mechanical/fusion/**"
      - "symbolu/mechanical/hrm/**"
      - "symbolu/mechanical/lcm/**"
      - "symbolu/mechanical/lam/**"
      - "symbolu/mechanical/mlcr/**"
      - "symbolu/mechanical/renderer/**"
      - "symbolu/mechanical/dha/**"
      - "symbolu/temporal/**"
      - "symbolu/core/coherence/**"
      - "symbolu/formulas/**"
      - "symbolu/api/**"
      - "symbolu/policy/**"
      - "symbolu/adapter/**"
      - "tests/test_phase28_symbolic_harmonization_renderer.py"
      - "tests/test_phase29_persona_resonance.py"
      - "tests/test_phase30_cross_layer_resonance_mapping.py"
      - "tests/test_phase32_insight_window.py"
      - "tests/test_phase33_schema_adaptive_routing.py"
      - "tests/test_phase34_identity_harmonics.py"
      - "symbolu/service/**"
      - "symbolu/service/security/**"
      - "symbolu/service/sessions/**"
      - "symbolu/service/preferences/**"
      - "symbolu/intent/**"
      - "symbolu/identity/**"
      - "symbolu/motivation/**"
      - "symbolu/core/motivation_drift_tests/**"
      - "symbolu/tools/coherence_dashboard/**"
      - "symbolu/tools/unified_dashboard/**"
      - "docs/**"
      - ".github/workflows/pipeline-ci.yml"
  workflow_dispatch:

jobs:
  pipeline-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Load cached dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .
          pip install pytest pytest-cov coverage pydantic 'fastapi[standard]' uvicorn httpx

      - name: Run pipeline integration tests with coverage
        run: |
          pytest symbolu/mechanical/pipeline/integration_tests \
            --cov=symbolu/mechanical/pipeline \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=85 \
            --disable-warnings --maxfail=1 -q \
            2>&1 | tee pipeline-pytest.log

      - name: Run Persona Snapshot Tests
        run: |
          REGENERATE_SNAPSHOTS=0 pytest symbolu/mechanical/pipeline/tests_persona/test_persona_snapshots.py \
            --disable-warnings -q \
            2>&1 | tee persona-snapshot-pytest.log

      - name: Run Fusion Snapshot Tests
        run: |
          REGENERATE_SNAPSHOTS=0 pytest symbolu/mechanical/pipeline/tests_fusion/test_fusion_snapshots.py \
            --disable-warnings -q \
            2>&1 | tee fusion-snapshot-pytest.log

      - name: Run HRM Tests
        run: |
          pytest symbolu/mechanical/hrm/tests \
            --disable-warnings -q \
            2>&1 | tee hrm-pytest.log

      - name: Run LCM Tests
        run: |
          pytest symbolu/mechanical/lcm/tests \
            --disable-warnings -q \
            2>&1 | tee lcm-pytest.log

      - name: Run LAM Tests
        run: |
          pytest symbolu/mechanical/lam/tests \
            --disable-warnings -q \
            2>&1 | tee lam-pytest.log

      - name: Run Pipeline Mapper Integration Tests
        run: |
          pytest symbolu/mechanical/pipeline/integration_tests/test_mapper_integration.py \
            --disable-warnings -q \
            2>&1 | tee mapper-integration-pytest.log

      - name: Run Pipeline End-to-End Snapshot Tests
        run: |
          REGENERATE_SNAPSHOTS=0 pytest symbolu/mechanical/pipeline/tests_pipeline_snapshots/test_pipeline_snapshots.py \
            --disable-warnings -q \
            2>&1 | tee pipeline-e2e-snapshot-pytest.log

      - name: Run Pipeline Multi-Turn Snapshot Tests
        run: |
          REGENERATE_SNAPSHOTS=0 pytest symbolu/mechanical/pipeline/tests_pipeline_snapshots/test_pipeline_multiturn_snapshots.py \
            --disable-warnings -q \
            2>&1 | tee pipeline-multiturn-snapshot-pytest.log

      - name: Run Temporal Pipeline Snapshot Tests
        run: |
          REGENERATE_SNAPSHOTS=0 pytest symbolu/mechanical/pipeline/tests_pipeline_temporal/test_temporal_pipeline_snapshots.py \
            --disable-warnings -q \
            2>&1 | tee temporal-pipeline-snapshot-pytest.log

      - name: Run Delta Snapshot Tests
        run: |
          pytest symbolu/mechanical/pipeline/tests_delta/test_delta_pipeline.py \
            --disable-warnings -q \
            2>&1 | tee delta-snapshot-pytest.log

      - name: Upload Delta Report
        uses: actions/upload-artifact@v4
        with:
          name: delta-report
          path: symbolu/mechanical/pipeline/tests_delta/delta_report.json

      - name: Run Coherence Observability Tests
        run: |
          pytest symbolu/mechanical/pipeline/integration_tests/test_pipeline_coherence_api.py \
            symbolu/mechanical/pipeline/integration_tests/test_coherence_observability.py \
            --disable-warnings -q \
            2>&1 | tee coherence-observability-pytest.log

      - name: Run Unified API Tests
        run: |
          pytest symbolu/mechanical/pipeline/integration_tests/test_unified_api_output.py \
            --disable-warnings -q \
            2>&1 | tee unified-api-pytest.log

      - name: Run Phase 3 Derived Formula Metrics Tests
        run: |
          pytest symbolu/mechanical/pipeline/integration_tests/test_phase3_derived_formula_metrics.py \
            --disable-warnings -q \
            2>&1 | tee phase3-derived-metrics-pytest.log

      - name: Run Phase 4 Coherence v2 Integration Tests
        run: |
          pytest symbolu/mechanical/pipeline/integration_tests/test_phase4_coherence_v2_integration.py \
            --disable-warnings -q \
            2>&1 | tee phase4-coherence-v2-pytest.log

      - name: Run Phase 5 Formula UI Behavior Tests
        run: |
          pytest symbolu/mechanical/pipeline/integration_tests/test_phase5_formula_ui_behavior.py \
            --disable-warnings -q \
            2>&1 | tee phase5-formula-ui-pytest.log

      - name: Run Phase 8 Guna/Kosha Resonance Integration Tests
        run: |
          pytest symbolu/mechanical/pipeline/integration_tests/test_phase8_resonance_integration.py \
            --disable-warnings -q \
            2>&1 | tee phase8-resonance-integration-pytest.log

      - name: Run Phase 9 Guna/Kosha Mapper Modulation Tests
        run: |
          pytest symbolu/mechanical/pipeline/integration_tests/test_phase9_guna_kosha_mapper_modulation.py \
            --disable-warnings -q \
            2>&1 | tee phase9-mapper-modulation-pytest.log

      - name: Run Phase 10 Coherence v3 Formula Fusion Tests
        run: |
          pytest symbolu/mechanical/pipeline/integration_tests/test_phase10_coherence_v3_formula_fusion.py \
            --disable-warnings -q \
            2>&1 | tee phase10-coherence-v3-pytest.log

      - name: Run Phase 11 Selective Domain Activation Tests
        run: |
          pytest symbolu/mechanical/pipeline/integration_tests/test_phase11_coherence_v3_activation.py \
            --disable-warnings -q \
            2>&1 | tee phase11-v3-activation-pytest.log

      - name: Run Phase 12 Coherence v3 Quality Tests
        run: |
          pytest symbolu/core/coherence/tests/test_coherence_v3_quality.py \
            --disable-warnings -q \
            2>&1 | tee phase12-v3-quality-pytest.log

      - name: Run Phase 12 v3 Quality Integration Tests
        run: |
          pytest symbolu/mechanical/pipeline/integration_tests/test_phase12_v3_quality_integration.py \
            --disable-warnings -q \
            2>&1 | tee phase12-v3-quality-integration-pytest.log

      - name: Run Policy Engine Tests
        run: |
          pytest symbolu/policy/tests/test_policy_engine.py \
            --disable-warnings -q \
            2>&1 | tee policy-engine-pytest.log

      - name: Run DILchat Adapter Tests
        run: |
          pytest symbolu/adapter/tests/test_dilchat_adapter.py \
            --disable-warnings -q \
            2>&1 | tee dilchat-adapter-pytest.log

      - name: Run API Server Tests
        run: |
          pytest symbolu/service/tests/test_api_server.py \
            --disable-warnings -q \
            2>&1 | tee api-server-pytest.log

      - name: Run API Security Tests
        run: |
          pytest symbolu/service/tests/test_api_security.py \
            --disable-warnings -q \
            2>&1 | tee api-security-pytest.log

      - name: Run Session Management Tests
        run: |
          pytest symbolu/service/tests/test_sessions.py \
            --disable-warnings -q \
            2>&1 | tee sessions-pytest.log

      - name: Run Session Policy Tests
        run: |
          pytest symbolu/policy/tests/test_session_policy.py \
            --disable-warnings -q \
            2>&1 | tee session-policy-pytest.log

      - name: Run Session Memory Tests
        run: |
          pytest symbolu/service/tests/test_session_memory.py \
            --disable-warnings -q \
            2>&1 | tee session-memory-pytest.log

      - name: Run Session Summarizer Tests
        run: |
          pytest symbolu/service/tests/test_session_summarizer.py \
            --disable-warnings -q \
            2>&1 | tee session-summarizer-pytest.log

      - name: Run Intent Arc Tests
        run: |
          pytest symbolu/intent/tests/test_intent_arc_engine.py \
            --disable-warnings -q \
            2>&1 | tee intent-arc-pytest.log

      - name: Run Identity Signature Tests
        run: |
          pytest symbolu/identity/tests/test_identity_signature_engine.py \
            --disable-warnings -q \
            2>&1 | tee identity-signature-pytest.log

      - name: Run Motivation Flow Tests
        run: |
          pytest symbolu/motivation/tests/test_motivation_engine.py \
            --disable-warnings -q \
            2>&1 | tee motivation-flow-pytest.log

      - name: Run Trading Formula Guardrail Tests
        run: |
          pytest symbolu/policy/tests/test_trading_formula_guardrails.py \
            --disable-warnings -q \
            2>&1 | tee trading-guardrails-pytest.log

      - name: Run Phase 15 Interaction Mode Tests
        run: |
          pytest symbolu/policy/tests/test_phase15_interaction_modes.py \
            --disable-warnings -q \
            2>&1 | tee phase15-interaction-modes-pytest.log

      - name: Run Phase 15B Preference Store Tests
        run: |
          pytest symbolu/service/tests/test_phase15b_preferences.py \
            --disable-warnings -q \
            2>&1 | tee phase15b-preferences-pytest.log

      - name: Run Phase 16 Formula Fusion Stabilizer Tests
        run: |
          pytest symbolu/core/formula_drift_tests/test_phase16_formula_fusion_stabilizer.py \
            --disable-warnings -q \
            2>&1 | tee phase16-fusion-stabilizer-pytest.log

      - name: Run Phase 17 Semantic Integrity & Cognitive Drift Tests
        run: |
          pytest symbolu/core/formula_drift_tests/test_phase17_semantic_integrity_and_drift.py \
            --disable-warnings -q \
            2>&1 | tee phase17-semantic-integrity-drift-pytest.log

      - name: Run Phase 18 Temporal Entropy Differential Tests
        run: |
          pytest symbolu/core/formula_drift_tests/test_phase18_temporal_entropy_differential.py \
            --disable-warnings -q \
            2>&1 | tee phase18-temporal-entropy-differential-pytest.log

      - name: Run Phase 21 Mirror-Time Loop Tests
        run: |
          pytest tests/test_phase21_mirror_time_loop.py \
            --disable-warnings -q \
            2>&1 | tee mirror_time-loop-pytest.log

      - name: Run Phase 22 Mirror-Time Cycle Tests
        run: |
          pytest tests/test_phase22_mirror_time_cycle.py \
            --disable-warnings -q \
            2>&1 | tee phase22-mirror-time-cycle-pytest.log

      - name: Run Phase 27 Symbolic Harmonization Tests
        run: |
          pytest tests/test_phase27_symbolic_harmonization.py \
            --disable-warnings -q \
            2>&1 | tee phase27-symbolic-harmonization-pytest.log

      - name: Run Phase 28 Symbolic Harmonization → Renderer Tests
        run: |
          pytest tests/test_phase28_symbolic_harmonization_renderer.py \
            --disable-warnings -q \
            2>&1 | tee phase28-symbolic-harmonization-renderer.log

      - name: Run Phase 29 Persona Resonance Integration Tests
        run: |
          pytest tests/test_phase29_persona_resonance.py \
            --disable-warnings -q \
            2>&1 | tee phase29-persona-resonance.log

      - name: Run Phase 30 Cross-Layer Resonance Persona Mapping Tests
        run: |
          pytest tests/test_phase30_cross_layer_resonance_mapping.py \
            --disable-warnings -q \
            --maxfail=1 \
            2>&1 | tee phase30-cross-layer-resonance.log

      - name: Run Phase 32 Insight Window Gating Tests
        run: |
          pytest tests/test_phase32_insight_window.py \
            --disable-warnings -q \
            --maxfail=1 \
            2>&1 | tee phase32-insight-window.log

      - name: Run Phase 33 Persona Schema Adaptive Routing Tests
        run: |
          pytest tests/test_phase33_schema_adaptive_routing.py \
            --disable-warnings -q \
            --maxfail=1 \
            2>&1 | tee phase33-schema-adaptive-routing.log

      - name: Run Phase 34 Identity Harmonics Layer Tests
        run: |
          pytest tests/test_phase34_identity_harmonics.py \
            --disable-warnings -q \
            --maxfail=1 \
            2>&1 | tee phase34-identity-harmonics.log

      - name: Upload Phase 34 Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase34-identity-harmonics-log
          path: phase34-identity-harmonics.log
          if-no-files-found: ignore

      - name: Run Phase 20 Unified Dashboard Tests
        run: |
          pytest symbolu/tools/unified_dashboard/tests/test_unified_dashboard.py \
            --disable-warnings -q \
            2>&1 | tee phase20-unified-dashboard-pytest.log

      - name: Run Motivation Drift Tests
        run: |
          pytest symbolu/core/motivation_drift_tests \
            --disable-warnings -q \
            2>&1 | tee motivation-drift-pytest.log

      - name: Upload Motivation Drift Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motivation-drift-pytest-log
          path: motivation-drift-pytest.log
          if-no-files-found: ignore

      - name: Upload Coherence Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coherence-observability-reports
          path: symbolu/tools/coherence_dashboard/output/

      - name: Run Temporal Persona Drift Tests
        run: |
          pytest symbolu/mechanical/pipeline/tests_persona_temporal/test_temporal_persona_drift.py \
            --disable-warnings -q \
            2>&1 | tee persona-drift-pytest.log

      - name: Upload Temporal Persona Drift Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: persona-temporal-drift-report
          path: symbolu/mechanical/pipeline/tests_persona_temporal/persona_temporal_drift_report.json

      - name: Upload pipeline CI snapshots
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-ci-snapshots
          path: |
            coverage.xml
            htmlcov/
            pipeline-pytest.log
            persona-snapshot-pytest.log
            fusion-snapshot-pytest.log
            hrm-pytest.log
            lcm-pytest.log
            lam-pytest.log
            mapper-integration-pytest.log
            pipeline-e2e-snapshot-pytest.log
            pipeline-multiturn-snapshot-pytest.log
            temporal-pipeline-snapshot-pytest.log
            delta-snapshot-pytest.log
            coherence-observability-pytest.log
            persona-drift-pytest.log
            unified-api-pytest.log
            phase3-derived-metrics-pytest.log
            phase4-coherence-v2-pytest.log
            phase5-formula-ui-pytest.log
            phase8-resonance-integration-pytest.log
            phase9-mapper-modulation-pytest.log
            phase10-coherence-v3-pytest.log
            phase11-v3-activation-pytest.log
            phase12-v3-quality-pytest.log
            phase12-v3-quality-integration-pytest.log
            policy-engine-pytest.log
            dilchat-adapter-pytest.log
            api-server-pytest.log
            api-security-pytest.log
            sessions-pytest.log
            session-policy-pytest.log
            session-memory-pytest.log
            session-summarizer-pytest.log
            intent-arc-pytest.log
            identity-signature-pytest.log
            motivation-flow-pytest.log
            trading-guardrails-pytest.log
            phase15-interaction-modes-pytest.log
            phase15b-preferences-pytest.log
            phase16-fusion-stabilizer-pytest.log
            phase17-semantic-integrity-drift-pytest.log
            phase18-temporal-entropy-differential-pytest.log
            mirror_time-loop-pytest.log
            phase22-mirror-time-cycle-pytest.log
            phase27-symbolic-harmonization-pytest.log
            phase28-symbolic-harmonization-renderer.log
            phase29-persona-resonance.log
            phase30-cross-layer-resonance.log
            phase32-insight-window.log
            phase20-unified-dashboard-pytest.log
            motivation-drift-pytest.log

      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-snapshot-diffs
          path: |
            symbolu/mechanical/pipeline/snapshots/*.diff
            symbolu/mechanical/pipeline/tests_persona/*.diff
            symbolu/mechanical/pipeline/tests_fusion/*.diff
            symbolu/mechanical/pipeline/tests_pipeline_snapshots/*.diff
            symbolu/mechanical/pipeline/tests_pipeline_temporal/*.diff
            symbolu/mechanical/pipeline/tests_delta/*.diff
            symbolu/mechanical/pipeline/tests_delta/delta_report.json
            symbolu/mechanical/pipeline/tests_persona_temporal/*.diff
            symbolu/mechanical/pipeline/tests_persona_temporal/persona_temporal_drift_report.json

      - name: Upload Temporal Snapshot Diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-pipeline-snapshot-diffs
          path: |
            symbolu/mechanical/pipeline/tests_pipeline_temporal/*.diff

      - name: Upload pipeline debug logs
        if: hashFiles('symbolu/mechanical/pipeline/**/*.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-debug-logs
          path: |
            symbolu/mechanical/pipeline/pipeline-debug.log
            symbolu/mechanical/pipeline/persona.log
            symbolu/mechanical/pipeline/fusion.log
            symbolu/mechanical/pipeline/mlcr.log
            symbolu/mechanical/pipeline/dha.log
            symbolu/mechanical/pipeline/renderer.log
