name: SymbolU Pipeline CI

on:
  push:
    branches: ["main", "master"]
    paths:
      - "symbolu/mechanical/pipeline/**"
      - "symbolu/mechanical/persona/**"
      - "symbolu/mechanical/fusion/**"
      - "symbolu/temporal/**"
      - ".github/workflows/pipeline-ci.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "symbolu/mechanical/pipeline/**"
      - "symbolu/mechanical/persona/**"
      - "symbolu/mechanical/fusion/**"
      - "symbolu/temporal/**"
      - ".github/workflows/pipeline-ci.yml"
  workflow_dispatch:

jobs:
  pipeline-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Load cached dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .
          pip install pytest pytest-cov coverage pydantic

      - name: Run pipeline integration tests with coverage
        run: |
          pytest symbolu/mechanical/pipeline/integration_tests \
            --cov=symbolu/mechanical/pipeline \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=85 \
            --disable-warnings --maxfail=1 -q \
            2>&1 | tee pipeline-pytest.log

      - name: Run Persona Snapshot Tests
        run: |
          REGENERATE_SNAPSHOTS=0 pytest symbolu/mechanical/pipeline/tests_persona/test_persona_snapshots.py \
            --disable-warnings -q \
            2>&1 | tee persona-snapshot-pytest.log

      - name: Run Fusion Snapshot Tests
        run: |
          REGENERATE_SNAPSHOTS=0 pytest symbolu/mechanical/pipeline/tests_fusion/test_fusion_snapshots.py \
            --disable-warnings -q \
            2>&1 | tee fusion-snapshot-pytest.log

      - name: Run Pipeline End-to-End Snapshot Tests
        run: |
          REGENERATE_SNAPSHOTS=0 pytest symbolu/mechanical/pipeline/tests_pipeline_snapshots/test_pipeline_snapshots.py \
            --disable-warnings -q \
            2>&1 | tee pipeline-e2e-snapshot-pytest.log

      - name: Run Pipeline Multi-Turn Snapshot Tests
        run: |
          REGENERATE_SNAPSHOTS=0 pytest symbolu/mechanical/pipeline/tests_pipeline_snapshots/test_pipeline_multiturn_snapshots.py \
            --disable-warnings -q \
            2>&1 | tee pipeline-multiturn-snapshot-pytest.log

      - name: Run Temporal Pipeline Snapshot Tests
        run: |
          REGENERATE_SNAPSHOTS=0 pytest symbolu/mechanical/pipeline/tests_pipeline_temporal/test_temporal_pipeline_snapshots.py \
            --disable-warnings -q \
            2>&1 | tee temporal-pipeline-snapshot-pytest.log

      - name: Run Delta Snapshot Tests
        run: |
          pytest symbolu/mechanical/pipeline/tests_delta/test_delta_pipeline.py \
            --disable-warnings -q \
            2>&1 | tee delta-snapshot-pytest.log

      - name: Upload Delta Report
        uses: actions/upload-artifact@v4
        with:
          name: delta-report
          path: symbolu/mechanical/pipeline/tests_delta/delta_report.json

      - name: Upload pipeline CI snapshots
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-ci-snapshots
          path: |
            coverage.xml
            htmlcov/
            pipeline-pytest.log
            persona-snapshot-pytest.log
            fusion-snapshot-pytest.log
            pipeline-e2e-snapshot-pytest.log
            pipeline-multiturn-snapshot-pytest.log
            temporal-pipeline-snapshot-pytest.log
            delta-snapshot-pytest.log

      - name: Upload snapshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-snapshot-diffs
          path: |
            symbolu/mechanical/pipeline/snapshots/*.diff
            symbolu/mechanical/pipeline/tests_persona/*.diff
            symbolu/mechanical/pipeline/tests_fusion/*.diff
            symbolu/mechanical/pipeline/tests_pipeline_snapshots/*.diff
            symbolu/mechanical/pipeline/tests_pipeline_temporal/*.diff
            symbolu/mechanical/pipeline/tests_delta/*.diff
            symbolu/mechanical/pipeline/tests_delta/delta_report.json

      - name: Upload Temporal Snapshot Diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-pipeline-snapshot-diffs
          path: |
            symbolu/mechanical/pipeline/tests_pipeline_temporal/*.diff

      - name: Upload pipeline debug logs
        if: hashFiles('symbolu/mechanical/pipeline/**/*.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-debug-logs
          path: |
            symbolu/mechanical/pipeline/pipeline-debug.log
            symbolu/mechanical/pipeline/persona.log
            symbolu/mechanical/pipeline/fusion.log
            symbolu/mechanical/pipeline/mlcr.log
            symbolu/mechanical/pipeline/dha.log
            symbolu/mechanical/pipeline/renderer.log
