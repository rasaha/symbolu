name: cloud-scaling-authorization-contracts-ci

# Scoped CI for the Cloud Scaling Phase 5A authorization contracts
# (ugence-cloud-scaling-authorization-contracts): the non-authoritative binding of a
# reconciled Phase 4C projection + Risk Authority decision into a
# CapacityAuthorizationCandidate. A candidate grants nothing.
#
# This workflow is ADDITIVE and PATH-SCOPED. It does not touch, weaken or modify
# cloud-scaling-risk-integration-ci, cloud-scaling-controller-package-ci or any Risk
# Authority workflow. It runs the Phase 5A suite (including the adversarial, authority
# exclusion, non-reachability and validated-pair probes), proves the upstream baselines
# remain green and unchanged, re-verifies the frozen Phase 5A digests, and builds and
# installs the wheel offline to prove installed behavior matches source behavior digest
# for digest.

on:
  pull_request:
    paths:
      - "packages/integration/cloud-scaling-authorization-contracts/**"
      - "packages/integration/cloud-scaling-risk-integration/**"
      - "packages/capabilities/cloud-scaling-controller/**"
      - "packages/risk_authority/**"
      - "packages/trusted-evidence-authority/**"
      - "docs/architecture/ADR_CLOUD_SCALING_AUTHORIZATION_PHASE5.md"
      - ".github/workflows/cloud-scaling-authorization-contracts-ci.yml"
  push:
    branches:
      - "claude/cloud-scaling-phase-5a-**"
      - "claude/setup-symbolu-monorepo-**"
    paths:
      - "packages/integration/cloud-scaling-authorization-contracts/**"
      - ".github/workflows/cloud-scaling-authorization-contracts-ci.yml"

defaults:
  run:
    shell: bash

jobs:
  authorization-contracts-suite:
    name: Phase 5A authorization-contracts suite (source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling + first-party packages (editable)
        run: |
          python -m pip install --upgrade pip
          pip install pytest build numpy
          pip install -e packages/risk_authority
          pip install -e packages/capabilities/cloud-scaling-controller
          pip install -e packages/integration/cloud-scaling-risk-integration
          pip install -e packages/integration/cloud-scaling-authorization-contracts
      - name: Phase 5A suite (happy path, reconciliation, adversarial, packaging)
        run: python -m pytest packages/integration/cloud-scaling-authorization-contracts/tests -q
      - name: Security gates — adversarial + containment probes (explicit acceptance gate)
        run: |
          python -m pytest \
            packages/integration/cloud-scaling-authorization-contracts/tests/test_adversarial.py \
            packages/integration/cloud-scaling-authorization-contracts/tests/test_authority_exclusion.py \
            packages/integration/cloud-scaling-authorization-contracts/tests/test_non_reachability.py \
            packages/integration/cloud-scaling-authorization-contracts/tests/test_import_boundary.py \
            packages/integration/cloud-scaling-authorization-contracts/tests/test_time_authority.py \
            packages/integration/cloud-scaling-authorization-contracts/tests/test_validated_pair.py \
            packages/integration/cloud-scaling-authorization-contracts/tests/test_builder_gates.py \
            packages/integration/cloud-scaling-authorization-contracts/tests/test_digest_completeness.py \
            packages/integration/cloud-scaling-authorization-contracts/tests/test_class_constants.py \
            packages/integration/cloud-scaling-authorization-contracts/tests/test_recommendation_identity.py -q
      - name: Frozen-digest regression (the production-shaped chain must be byte-identical)
        run: |
          python -m pytest \
            packages/integration/cloud-scaling-authorization-contracts/tests/test_frozen_digests.py \
            packages/integration/cloud-scaling-authorization-contracts/tests/test_digest_format.py -q

  baseline-regression:
    name: Phase 4C + Controller + Risk Authority baselines remain green & unchanged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          # `build` is required by the Risk Authority distribution verifier below, which
          # builds and installs the RA wheel into a throwaway environment. `pydantic` is
          # required by the platform-freeze verifier: it snapshots `decision_governance`,
          # which imports `ugence_decision_authority`, which is built on pydantic. Without
          # it the verifier fails on an import, not on a freeze violation.
          # `cryptography` + `PyNaCl` are TEV's declared runtime dependencies. This job
          # runs the TEV suite (the F-1 coverage gap), and TEV deliberately has no
          # pure-Python cryptographic fallback, so without them the TEV steps below fail at
          # import rather than on a boundary violation. Bounds mirror TEV's own pyproject
          # and its dedicated workflow.
          pip install pytest numpy build pydantic \
                      "cryptography>=41.0.7,<47.0.0" "PyNaCl>=1.5.0,<2.0.0"
          pip install -e packages/risk_authority
          pip install -e packages/capabilities/cloud-scaling-controller
          pip install -e packages/integration/cloud-scaling-risk-integration
      - name: Risk Authority conformance suite (must remain green + unchanged)
        run: python -m pytest packages/risk_authority/tests -q
      - name: Cloud Scaling Controller suite (must remain green + unchanged)
        run: python -m pytest packages/capabilities/cloud-scaling-controller/tests -q
      - name: Phase 4C adapter suite (must remain green + unchanged)
        run: python -m pytest packages/integration/cloud-scaling-risk-integration/tests -q
      # F-1 coverage gap. The Phase 5A workflow did not run TEV-1, so a Phase 5A change
      # that turned TEV-1's reverse-dependency test red reached the head with CI green.
      # TEV-1 is a stdlib-only leaf and its suite is fast; running it on every Phase 5A
      # change closes the gap. This does NOT modify or weaken TEV-1's own workflow.
      - name: TEV-1 consumer-boundary regression (F-1 — must remain green)
        run: |
          python -m pytest \
            packages/trusted-evidence-authority/tests/packaging/test_dependency_boundary.py -q
      - name: TEV-1 complete suite (must remain green + unchanged)
        run: python -m pytest packages/trusted-evidence-authority -q
      - name: Risk Authority distribution verifier (v2 Phase 4A/4B digests)
        run: python packages/risk_authority/verify_risk_authority_distribution.py
      - name: Platform freeze verifier (substantive digest must not move)
        run: python -m platform_freeze.verify

  isolated-install:
    name: Wheel build + offline isolated install + source-vs-installed probes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Host-side tooling only. This is the RUNNER environment, not the isolated
      # installation under test: the verifier builds its own throwaway virtualenv and
      # installs into it with the index structurally disabled (--no-index, PIP_NO_INDEX,
      # an unroutable sentinel index, no cache, no pip upgrade, no editable install).
      - name: Install build tooling (host environment)
        run: |
          python -m pip install --upgrade pip
          # numpy is required by the HOST step that computes the source-side expected
          # digests: it imports the controller from the source tree, and the controller
          # imports numpy. It is unrelated to the isolated environment, which gets its own
          # numpy from the local wheelhouse with no index reachable.
          pip install build wheel pytest numpy
      - name: Genuinely offline isolated install + negative controls + source-vs-installed
        # Phase A (online) builds first-party wheels and downloads the full dependency
        # closure into a local wheelhouse. Phase B installs from that wheelhouse alone with
        # no index reachable — that is the guarantee, and the closing banner names exactly
        # it. Phase C proves it by negative control: a missing wheel fails, a bogus index
        # cannot rescue it, and a failed install leaves nothing importable. Phase D probes
        # installed behavior against the source digests.
        run: python packages/integration/cloud-scaling-authorization-contracts/scripts/verify_isolated_install.py
      - name: Build sdist + wheel (distribution artifacts)
        run: python -m build packages/integration/cloud-scaling-authorization-contracts
      - name: Wheel contents — no test, fixture or conftest leakage
        run: |
          python - <<'PY'
          import pathlib, zipfile
          dist = pathlib.Path("packages/integration/cloud-scaling-authorization-contracts/dist")
          wheels = sorted(dist.glob("*.whl"))
          assert wheels, "no wheel was built"
          names = zipfile.ZipFile(wheels[-1]).namelist()
          top = {n.split("/")[0] for n in names}
          assert top <= {
              "ugence_cloud_scaling_authorization_contracts",
              "ugence_cloud_scaling_authorization_contracts-0.1.0.dist-info",
          }, f"unexpected top-level entries in the wheel: {sorted(top)}"
          for n in names:
              base = n.split("/")[-1]
              assert base != "conftest.py", f"conftest leaked: {n}"
              assert not base.startswith("test_"), f"test module leaked: {n}"
              assert "/tests/" not in n, f"test package leaked: {n}"
          assert any(n.endswith("py.typed") for n in names), "py.typed missing from the wheel"
          print(f"wheel contents OK ({len(names)} entries): {wheels[-1].name}")
          PY
      - name: Package boundary tests (declared deps, no reverse cycle, leaves preserved)
        run: |
          pip install -e packages/risk_authority \
                      -e packages/capabilities/cloud-scaling-controller \
                      -e packages/integration/cloud-scaling-risk-integration \
                      -e packages/integration/cloud-scaling-authorization-contracts
          python -m pytest packages/integration/cloud-scaling-authorization-contracts/tests/packaging -q
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-scaling-authorization-contracts-dist
          path: packages/integration/cloud-scaling-authorization-contracts/dist/*
          if-no-files-found: warn

  documentation:
    name: Terminology + documentation-link validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Terminology validation
        run: python scripts/validate_terminology.py
      - name: Documentation-link validation
        run: python scripts/check_doc_links.py
