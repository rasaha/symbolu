name: cloud-scaling-authorization-contracts-ci

# Scoped CI for the Cloud Scaling Phase 5A authorization contracts
# (ugence-cloud-scaling-authorization-contracts): the non-authoritative binding of a
# reconciled Phase 4C projection + Risk Authority decision into a
# CapacityAuthorizationCandidate. A candidate grants nothing.
#
# This workflow is ADDITIVE and PATH-SCOPED. It does not touch, weaken or modify
# cloud-scaling-risk-integration-ci, cloud-scaling-controller-package-ci or any Risk
# Authority workflow. It runs the Phase 5A suite (including the adversarial, authority
# exclusion, non-reachability and validated-pair probes), proves the upstream baselines
# remain green and unchanged, re-verifies the frozen Phase 5A digests, and builds and
# installs the wheel offline to prove installed behavior matches source behavior digest
# for digest.

on:
  pull_request:
    paths:
      - "packages/integration/cloud-scaling-authorization-contracts/**"
      - "packages/integration/cloud-scaling-risk-integration/**"
      - "packages/capabilities/cloud-scaling-controller/**"
      - "packages/risk_authority/**"
      - "packages/trusted-evidence-authority/**"
      - "docs/architecture/ADR_CLOUD_SCALING_AUTHORIZATION_PHASE5.md"
      # The sweep engine. A change to an operator or a detector changes what this
      # package's guard sweep measures without touching a byte inside the package, so
      # a filter that omits it lets the engine drift past this gate unmeasured. An
      # audit of the guard-coverage work found a real defect of exactly that shape:
      # a bare-name match in `_raising_helpers` let a non-guard call be inventoried
      # and scored KILLED, and no package-scoped filter would have re-run this sweep
      # to catch it.
      - "scripts/cloud_scaling/guard_sweep.py"
      - "scripts/cloud_scaling/tests/**"
      - ".github/workflows/cloud-scaling-authorization-contracts-ci.yml"
  push:
    branches:
      - "claude/cloud-scaling-phase-5a-**"
      - "claude/setup-symbolu-monorepo-**"
    paths:
      - "packages/integration/cloud-scaling-authorization-contracts/**"
      - "scripts/cloud_scaling/guard_sweep.py"
      - "scripts/cloud_scaling/tests/**"
      - ".github/workflows/cloud-scaling-authorization-contracts-ci.yml"

defaults:
  run:
    shell: bash

jobs:
  authorization-contracts-suite:
    name: Phase 5A authorization-contracts suite (source)
    runs-on: ubuntu-latest
    env:
      # A baseline the surface ratchet cannot resolve is a skip locally and a FAILURE here: a
      # gate that quietly skips where it is supposed to run is not a gate.
      UGENCE_RATCHET_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the surface ratchet's baseline
        # The allowlist of public non-field members is ratcheted against history, so the
        # "before" cannot be edited by the commit that changes the "after". The default
        # branch is named by the event rather than hardcoded — this repository's default
        # branch is not called "main".
        #
        # This step used to be a single unconditional `git merge-base HEAD <default>`,
        # with no default-branch arm and no vacuity guard. Measured on run 33317988694
        # (the push of merge commit a24d9c6b): merge-base resolved to HEAD itself, so
        # UGENCE_RATCHET_BASE equalled the head SHA, the ratchet compared the merge
        # against itself, and the job went green — vacuous on every default-branch push,
        # failing open where the partition ratchet's resolver fails closed. This is now
        # the policy-authenticity resolver (its PR #1519 form, resilient to a concurrent
        # merge advancing the ref mid-step), and `tests/_surface_ratchet.py` refuses a
        # HEAD-containing baseline a second time, in the tested code, because a guard
        # that lives only in YAML is covered by nothing.
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          base='${{ github.event.pull_request.base.sha }}'
          source='pull request base sha'
          if [ -z "${base}" ]; then
            default='${{ github.event.repository.default_branch }}'
            git fetch --no-tags origin \
              "+refs/heads/${default}:refs/remotes/origin/ratchet-base"
            if git merge-base --is-ancestor "${head}" refs/remotes/origin/ratchet-base; then
              # A push ON the default branch: HEAD is on that branch's history, however
              # far the ref has advanced since (ancestor test, not equality — the
              # equality form is exactly what PR #1515 raced in the policy-authenticity
              # workflow). The honest "before" is the commit this one landed on top of —
              # for a merge commit, its first parent, i.e. the previous default tip.
              base=$(git rev-parse "HEAD^1")
              source='first parent (push on the default branch)'
            else
              base=$(git merge-base HEAD refs/remotes/origin/ratchet-base)
              source="merge base with ${default}"
            fi
          fi
          git rev-parse --verify "${base}^{commit}" >/dev/null
          if git merge-base --is-ancestor "${head}" "${base}"; then
            echo "::error::the surface ratchet baseline (${source}) resolved to ${base}, which already contains HEAD (${head}); comparing the change against itself reports no growth for every widening on it, so the gate would pass vacuously"
            exit 1
          fi
          echo "UGENCE_RATCHET_BASE=${base}" >> "$GITHUB_ENV"
          echo "surface ratchet baseline: ${base} (${source})"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling + first-party packages (editable)
        run: |
          python -m pip install --upgrade pip
          pip install pytest build numpy
          pip install -e packages/risk_authority
          pip install -e packages/capabilities/cloud-scaling-controller
          pip install -e packages/integration/cloud-scaling-risk-integration
          pip install -e packages/integration/cloud-scaling-authorization-contracts
      - name: Phase 5A suite (happy path, reconciliation, adversarial, packaging)
        run: python -m pytest packages/integration/cloud-scaling-authorization-contracts/tests -q
      - name: Security gates — adversarial + containment probes (explicit acceptance gate)
        run: |
          python -m pytest \
            packages/integration/cloud-scaling-authorization-contracts/tests/test_adversarial.py \
            packages/integration/cloud-scaling-authorization-contracts/tests/test_authority_exclusion.py \
            packages/integration/cloud-scaling-authorization-contracts/tests/test_non_reachability.py \
            packages/integration/cloud-scaling-authorization-contracts/tests/test_import_boundary.py \
            packages/integration/cloud-scaling-authorization-contracts/tests/test_time_authority.py \
            packages/integration/cloud-scaling-authorization-contracts/tests/test_validated_pair.py \
            packages/integration/cloud-scaling-authorization-contracts/tests/test_builder_gates.py \
            packages/integration/cloud-scaling-authorization-contracts/tests/test_digest_completeness.py \
            packages/integration/cloud-scaling-authorization-contracts/tests/test_class_constants.py \
            packages/integration/cloud-scaling-authorization-contracts/tests/test_recommendation_identity.py -q
      - name: Frozen-digest regression (the production-shaped chain must be byte-identical)
        run: |
          python -m pytest \
            packages/integration/cloud-scaling-authorization-contracts/tests/test_frozen_digests.py \
            packages/integration/cloud-scaling-authorization-contracts/tests/test_digest_format.py -q

  baseline-regression:
    name: Phase 4C + Controller + Risk Authority baselines remain green & unchanged
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          # `build` is required by the Risk Authority distribution verifier below, which
          # builds and installs the RA wheel into a throwaway environment. `pydantic` is
          # required by the platform-freeze verifier: it snapshots `decision_governance`,
          # which imports `ugence_decision_authority`, which is built on pydantic. Without
          # it the verifier fails on an import, not on a freeze violation.
          # `cryptography` + `PyNaCl` are TEV's declared runtime dependencies. This job
          # runs the TEV suite (the F-1 coverage gap), and TEV deliberately has no
          # pure-Python cryptographic fallback, so without them the TEV steps below fail at
          # import rather than on a boundary violation. Bounds mirror TEV's own pyproject
          # and its dedicated workflow.
          pip install pytest numpy build pydantic \
                      "cryptography>=41.0.7,<47.0.0" "PyNaCl>=1.5.0,<2.0.0"
          pip install -e packages/risk_authority
          pip install -e packages/capabilities/cloud-scaling-controller
          pip install -e packages/integration/cloud-scaling-risk-integration
      - name: Risk Authority conformance suite (must remain green + unchanged)
        run: python -m pytest packages/risk_authority/tests -q
      - name: Cloud Scaling Controller suite (must remain green + unchanged)
        run: python -m pytest packages/capabilities/cloud-scaling-controller/tests -q
      - name: Phase 4C adapter suite (must remain green + unchanged)
        run: python -m pytest packages/integration/cloud-scaling-risk-integration/tests -q
      # F-1 coverage gap. The Phase 5A workflow did not run TEV-1, so a Phase 5A change
      # that turned TEV-1's reverse-dependency test red reached the head with CI green.
      # TEV-1 is a stdlib-only leaf and its suite is fast; running it on every Phase 5A
      # change closes the gap. This does NOT modify or weaken TEV-1's own workflow.
      - name: TEV-1 consumer-boundary regression (F-1 — must remain green)
        run: |
          python -m pytest \
            packages/trusted-evidence-authority/tests/packaging/test_dependency_boundary.py -q
      - name: TEV-1 complete suite (must remain green + unchanged)
        run: python -m pytest packages/trusted-evidence-authority -q
      - name: Risk Authority distribution verifier (v2 Phase 4A/4B digests)
        run: python packages/risk_authority/verify_risk_authority_distribution.py
      - name: Platform freeze verifier (substantive digest must not move)
        run: python -m platform_freeze.verify

  isolated-install:
    name: Wheel build + offline isolated install + source-vs-installed probes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Host-side tooling only. This is the RUNNER environment, not the isolated
      # installation under test: the verifier builds its own throwaway virtualenv and
      # installs into it with the index structurally disabled (--no-index, PIP_NO_INDEX,
      # an unroutable sentinel index, no cache, no pip upgrade, no editable install).
      - name: Install build tooling (host environment)
        run: |
          python -m pip install --upgrade pip
          # numpy is required by the HOST step that computes the source-side expected
          # digests: it imports the controller from the source tree, and the controller
          # imports numpy. It is unrelated to the isolated environment, which gets its own
          # numpy from the local wheelhouse with no index reachable.
          pip install build wheel pytest numpy
      - name: Genuinely offline isolated install + negative controls + source-vs-installed
        # Phase A (online) builds first-party wheels and downloads the full dependency
        # closure into a local wheelhouse. Phase B installs from that wheelhouse alone with
        # no index reachable — that is the guarantee, and the closing banner names exactly
        # it. Phase C proves it by negative control: a missing wheel fails, a bogus index
        # cannot rescue it, and a failed install leaves nothing importable. Phase D probes
        # installed behavior against the source digests.
        run: python packages/integration/cloud-scaling-authorization-contracts/scripts/verify_isolated_install.py
      - name: Build sdist + wheel (distribution artifacts)
        run: python -m build packages/integration/cloud-scaling-authorization-contracts
      - name: Wheel contents — no test, fixture or conftest leakage
        run: |
          python - <<'PY'
          import pathlib, re, zipfile
          dist = pathlib.Path("packages/integration/cloud-scaling-authorization-contracts/dist")
          wheels = sorted(dist.glob("*.whl"))
          assert wheels, "no wheel was built"
          names = zipfile.ZipFile(wheels[-1]).namelist()
          top = {n.split("/")[0] for n in names}
          # The version is read from the source rather than written here, so a deliberate
          # version bump does not fail this assertion for the wrong reason. What is asserted
          # stays the same: the wheel's dist-info is the version the source declares, and the
          # wheel's top level holds nothing else.
          version = re.search(
              r'^__version__\s*(?::[^=]*)?=\s*"([^"]+)"',
              pathlib.Path(
                  "packages/integration/cloud-scaling-authorization-contracts/src/ugence_cloud_scaling_authorization_contracts/version.py"
              ).read_text(),
              re.M,
          ).group(1)
          assert top <= {
              "ugence_cloud_scaling_authorization_contracts",
              f"ugence_cloud_scaling_authorization_contracts-{version}.dist-info",
          }, f"unexpected top-level entries in the wheel (source version {version}): {sorted(top)}"
          for n in names:
              base = n.split("/")[-1]
              assert base != "conftest.py", f"conftest leaked: {n}"
              assert not base.startswith("test_"), f"test module leaked: {n}"
              assert "/tests/" not in n, f"test package leaked: {n}"
          assert any(n.endswith("py.typed") for n in names), "py.typed missing from the wheel"
          print(f"wheel contents OK ({len(names)} entries): {wheels[-1].name}")
          PY
      - name: Package boundary tests (declared deps, no reverse cycle, leaves preserved)
        run: |
          pip install -e packages/risk_authority \
                      -e packages/capabilities/cloud-scaling-controller \
                      -e packages/integration/cloud-scaling-risk-integration \
                      -e packages/integration/cloud-scaling-authorization-contracts
          python -m pytest packages/integration/cloud-scaling-authorization-contracts/tests/packaging -q
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-scaling-authorization-contracts-dist
          path: packages/integration/cloud-scaling-authorization-contracts/dist/*
          if-no-files-found: warn

  documentation:
    name: Terminology + documentation-link validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Terminology validation
        run: python scripts/validate_terminology.py
      - name: Documentation-link validation
        run: python scripts/check_doc_links.py

  guard-inventory:
    name: Guard inventory is re-derivable and reconciles with both ratified counts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerate the inventory and prove it is unchanged
        # Fast and deterministic — no suite runs here. This is the check that catches a guard
        # added without a classification or removed without anyone noticing, which is the
        # drift a sweep alone would not report until the next full run.
        run: |
          python scripts/cloud_scaling/guard_sweep.py authorization-contracts --inventory-only
          git diff --exit-code -- \
            packages/integration/cloud-scaling-authorization-contracts/GUARD_INVENTORY.md \
            packages/integration/cloud-scaling-authorization-contracts/guard_inventory.json \
            packages/integration/cloud-scaling-authorization-contracts/guard_classification.json

      - name: The sweep's own enforcement machinery is measured, not assumed
        # The message-only rule was inert for this PR's whole history: the detector read a
        # tbstyle-rendered explanation under --tb=no and matched nothing, so every mutant
        # looked type-killed. These tests run the generated plugin itself against a suite
        # built to fail in each shape, so a detector that stops seeing source fails here
        # rather than silently passing every guard.
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          python -m pytest scripts/cloud_scaling/tests -q
  guard-sweep:
    name: Gate-removal mutation sweep (shard ${{ matrix.shard }} of 8)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling + first-party packages (editable)
        run: |
          python -m pip install --upgrade pip
          pip install pytest build numpy
          # Exactly the four this workflow's other jobs install, in their order, and exactly
          # the three first-party dependencies `pyproject.toml` declares plus the package
          # itself. This workflow defines no $FIRST_PARTY, and Phase 5A depends on neither
          # the Policy Authority nor the Trusted Evidence Authority — inventing a longer
          # list is what broke the first run.
          pip install -e packages/risk_authority
          pip install -e packages/capabilities/cloud-scaling-controller
          pip install -e packages/integration/cloud-scaling-risk-integration
          pip install -e packages/integration/cloud-scaling-authorization-contracts
      - name: Sweep this shard
        # Sharded because it cannot be anything else. At adoption this was 109 guards
        # against a 138s suite — four wall-clock hours in one job — and eight shards put
        # each at roughly half an hour.
        #
        # The suite is now ~4.7x faster (measured, this branch): the reference Ed25519's
        # modular inverse moved from Fermat's exponentiation to extended Euclid, and
        # `builtins.pow` had been ~93% of every run. The shard count is deliberately
        # UNCHANGED: at the effective runner concurrency this repository actually gets
        # (~6.7 concurrent jobs, measured across a full fan-out), wall clock tracks total
        # runner-minutes rather than how the work is divided, so re-sharding buys nothing
        # while the pool is saturated. Fewer minutes is the whole win.
        env:
          UGENCE_RATCHET_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: python scripts/cloud_scaling/guard_sweep.py authorization-contracts --shard ${{ matrix.shard }}/8
      - name: The tracked tree was not mutated
        # The sweep works in a disposable copy outside the repository. This is what proves it.
        run: git diff --exit-code
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authorization-contracts-guard-sweep-shard-${{ matrix.shard }}
          path: /tmp/ugence-sweep-authorization-contracts/*.json
          if-no-files-found: warn

  guard-sweep-aggregate:
    name: Every inventoried guard produced exactly one result
    runs-on: ubuntu-latest
    needs: guard-sweep
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: authorization-contracts-guard-sweep-shard-*
          merge-multiple: true
          path: shards
      - name: Prove the sweep was total and non-overlapping
        # Three separate claims, each measured against the real inventory rather than the
        # shard arithmetic: every index belongs to one shard, every index produced exactly
        # one terminal result, and every shard measured the same collected population. A
        # shard that never ran produces no duplicate either, so absence is checked directly.
        run: python scripts/cloud_scaling/guard_sweep.py authorization-contracts --aggregate shards --shards 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authorization-contracts-guard-sweep-aggregate
          path: packages/integration/cloud-scaling-authorization-contracts/guard_sweep_aggregate.json
          if-no-files-found: warn
