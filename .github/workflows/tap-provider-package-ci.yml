name: tap-provider-package-ci

# Scoped CI for the canonical TAP assertion-governance package migration.
# No live remote service and no network-dependent test runs here: the in-process
# reference engine is deterministic and offline, and the clean-install proof uses
# ``pip install --no-index`` against locally built wheels only.
#
# Suites run on 3.10, 3.11 and 3.12 — the whole range this package declares with
# requires-python >=3.10 and its 3.10, 3.11 and 3.12 classifiers. The 3.10 leg was blocked until now by three couplings in test
# code and committed artifacts, none of them in any package's src/: a bare
# `import tomllib` (stdlib only from 3.11) now falls back to the `tomli` backport, which
# the install steps below provide; public_api.json manifests recorded
# `BaseException.add_note`, a 3.11 addition that made the artifact a statement about the
# interpreter that generated it, and the generators now exclude inherited exception
# methods so the manifest reproduces on any interpreter; and one assertion pinned
# CPython's exact AttributeError wording, which 3.10 spells differently for the same
# refusal. Each was fixed at the coupling, never by relaxing what the test discriminates.
#
# The suites run across interpreters in their own job. The single ``tap-package`` job
# below stays on 3.11 because what it proves is about *artifacts* — bit-for-bit wheel
# reproducibility, the committed behavioural-equivalence and API-surface baselines, and
# the platform freeze manifest — all of which are pinned to one interpreter by
# construction; running them twice would compare a baseline against itself on a second
# machine, not test anything more.

concurrency:
  # A superseded run proves nothing about the commit that replaced it. Cancel
  # in-flight runs for the same ref on pull requests; never on a branch push,
  # where each commit's run is the evidence that commit was green.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    paths:
      - "packages/providers/tap/**"
      - "tap_provider/**"
      - "packaging/dgm-tap-provider/**"
      - "docs/TAP_PROVIDER.md"
      - "docs/audits/tap_packaging/**"
      - "platform/PLATFORM_FREEZE_V1.json"
      - "platform_freeze/**"
      - ".github/workflows/tap-provider-package-ci.yml"
  pull_request:
    paths:
      - "packages/providers/tap/**"
      - "tap_provider/**"
      - "packaging/dgm-tap-provider/**"
      - "docs/TAP_PROVIDER.md"
      - "docs/audits/tap_packaging/**"
      - "platform/PLATFORM_FREEZE_V1.json"
      - "platform_freeze/**"
      - ".github/workflows/tap-provider-package-ci.yml"

jobs:
  tap-suites:
    name: TAP suites (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # One interpreter's failure must not hide the other's.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install tooling
        run: python -m pip install --upgrade pip pytest pydantic tomli
      - name: Canonical package tests (isolation)
        run: python -m pytest packages/providers/tap/tests -q
      - name: Monorepo TAP tests (through the facade)
        run: python -m pytest tap_provider/tests -q

  tap-package:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "1704067200"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install tooling
        run: python -m pip install --upgrade pip build pytest pydantic

      - name: Canonical package tests (isolation)
        run: python -m pytest packages/providers/tap/tests -q

      - name: Monorepo TAP tests (through the facade)
        run: python -m pytest tap_provider/tests -q

      - name: Authority / outcome-safety / dependency-boundary tests
        run: |
          python -m pytest \
            packages/providers/tap/tests/authority \
            packages/providers/tap/tests/boundaries \
            packages/providers/tap/tests/mapping -q

      - name: Behavioral-equivalence comparison (before == canonical == legacy)
        run: |
          python scripts/tap_equivalence_capture.py ugence_tap_provider /tmp/after_canonical.json
          python scripts/tap_equivalence_capture.py tap_provider /tmp/after_legacy.json
          python - <<'PY'
          import json
          def norm(f):
              d = json.load(open(f)); d.pop("namespace", None); return d
          before = norm("docs/audits/tap_packaging/artifacts/tap_equivalence_before.json")
          canon = norm("/tmp/after_canonical.json")
          legacy = norm("/tmp/after_legacy.json")
          assert before == canon == legacy, "TAP behavioral regression"
          print("behavioral equivalence: OK")
          PY
        env:
          PYTHONPATH: ".:packages/providers/tap/src:packages/governance-provider-framework/src:packages/governance-contracts/src:packages/capabilities/decision-authority/src"

      - name: API-snapshot comparison (.api surface byte-identical)
        run: |
          python scripts/tap_api_snapshot.py ugence_tap_provider /tmp/api_canonical.json
          python scripts/tap_api_snapshot.py tap_provider /tmp/api_legacy.json
          python - <<'PY'
          import json
          a = json.load(open("/tmp/api_canonical.json"))["api"]
          b = json.load(open("/tmp/api_legacy.json"))["api"]
          base = json.load(open("docs/audits/tap_packaging/artifacts/tap_public_api_baseline.json"))["api"]
          assert a == b == base, "TAP public .api surface changed"
          print("api-surface equivalence: OK")
          PY
        env:
          PYTHONPATH: ".:packages/providers/tap/src:packages/governance-provider-framework/src:packages/governance-contracts/src:packages/capabilities/decision-authority/src"

      - name: Build wheel + sdist (canonical) and legacy wheel
        run: |
          python -m build packages/providers/tap --outdir dist_tap
          python -m build packaging/dgm-tap-provider --outdir dist_tap
          ls -l dist_tap

      - name: Wheel reproducibility (bit-for-bit)
        run: |
          python -m build --wheel packages/providers/tap --outdir dist_repro
          A=$(sha256sum dist_tap/ugence_tap_provider-*.whl | cut -d" " -f1)
          B=$(sha256sum dist_repro/ugence_tap_provider-*.whl | cut -d" " -f1)
          test "$A" = "$B" && echo "wheel reproducible: $A"

      - name: Clean-environment install + framework registry + ActionGate-absent + CLI
        run: python packages/providers/tap/scripts/verify_tap_provider_distribution.py

      - name: Platform-freeze verification
        run: python -m platform_freeze.verify --manifest platform/PLATFORM_FREEZE_V1.json
