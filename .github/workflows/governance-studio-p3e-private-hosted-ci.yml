name: governance-studio-p3e-private-hosted-ci

# Path-scoped: the deployment package, the frozen frontend/backend/contract it packages,
# the synthetic fixtures, the P3E audits and this workflow. No deploy, no secrets, no
# external model APIs. Container build/run + image scan are gated in a separate job that
# only runs where a container runtime is available.
on:
  push:
    paths:
      - "deployment/governance-studio/**"
      - "apps/ugence-governance-studio/frontend/**"
      - "apps/ugence-governance-studio/backend/**"
      - "apps/ugence-governance-studio/contracts/openapi.json"
      - "apps/ugence-governance-studio/demo_data/**"
      - "docs/audits/ugence_governance_studio_p3e/**"
      - ".github/workflows/governance-studio-p3e-private-hosted-ci.yml"
  pull_request:
    paths:
      - "deployment/governance-studio/**"
      - "apps/ugence-governance-studio/**"
      - ".github/workflows/governance-studio-p3e-private-hosted-ci.yml"
  workflow_dispatch:  # manual base-image digest resolution (resolve-base-images job)

env:
  PYTHONPATH: >-
    deployment/governance-studio/src:apps/ugence-governance-studio/backend/src:packages/capabilities/agent-workforce-composer/src:packages/tooling/policy-workflow-compiler/src

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/ugence-governance-studio/frontend/package-lock.json

      # Two stdlib-only static conformance checks, deliberately ahead of install so a
      # violation fails fast. ratified-pin-conformance is ALSO the first step of the
      # container job; it is repeated here because the container job only runs where a
      # container runtime and registry access exist, so this job is the one that
      # actually guards every push.
      - name: ratified-pin-conformance
        run: python deployment/governance-studio/ci/verify_ratified_pins.py

      - name: gate-identifier-conformance
        # The P3E audit records must reference only the canonical container-gate
        # identifiers published in CONTAINER_GATE_DEFINITION.json (or a declared
        # deprecated alias, and only inside a field that quotes a superseded list).
        run: python deployment/governance-studio/ci/verify_gate_identifiers.py

      - name: install
        run: |
          pip install "pydantic>=2" "fastapi>=0.110" "uvicorn>=0.27" "starlette>=0.36" httpx pytest pip-audit
          # install every local package (incl. the deployment package, which declares
          # argon2-cffi) in ONE resolver transaction so the backend's local AWC dependency
          # resolves and Argon2id is importable.
          pip install \
            -e packages/tooling/policy-workflow-compiler \
            -e packages/capabilities/agent-workforce-composer \
            -e apps/ugence-governance-studio/backend \
            -e deployment/governance-studio
          python -c "import argon2, governance_studio_deployment, ugence_agent_workforce_composer.api as a; assert a.__version__=='0.2.1'; print('install OK: argon2 + deployment + AWC', a.__version__)"

      - name: p3d-prerequisite
        working-directory: apps/ugence-governance-studio/frontend
        run: |
          npm ci
          npm run verify:openapi
          npm run verify:api-boundary
          npm run verify:version
          npm run verify:tracked-sources

      - name: openapi-freeze
        run: |
          test "$(sha256sum apps/ugence-governance-studio/contracts/openapi.json | cut -d' ' -f1)" = "dc309eab216e1a4c2f63f286887a4ef218a96ac34f8fa8614bff176db7c36656"

      - name: platform-freeze
        run: python -m platform_freeze.verify

      - name: frontend-regression
        working-directory: apps/ugence-governance-studio/frontend
        run: npx vitest run

      - name: backend-regression
        run: python -m pytest apps/ugence-governance-studio/backend/tests -q

      - name: password-hashing-tests
        working-directory: deployment/governance-studio
        run: python -m pytest tests/test_passwords.py -q

      - name: python-runtime-audit
        run: pip-audit -r <(printf 'starlette\nuvicorn\nargon2-cffi\nfastapi\npydantic\n')

      - name: frontend-build
        working-directory: apps/ugence-governance-studio/frontend
        run: npm run build

      - name: synthetic-data-integrity
        run: python -c "from governance_studio_deployment.synthetic import SyntheticManifest, verify_bundle; m=SyntheticManifest.load('deployment/governance-studio/synthetic-scenarios-manifest.json'); assert verify_bundle(m,'apps/ugence-governance-studio/demo_data')==[], 'bundle drift'; print('synthetic bundle OK')"

      # startup-integrity / authentication / https / trusted-host / origin-protection /
      # security-header / request-limit / logging-redaction / governance-boundary /
      # runtime-egress / packaged-real-backend-e2e / all-four-scenario-e2e are all in the
      # deployment pytest suite (blocking).
      - name: deployment-suite
        working-directory: deployment/governance-studio
        run: python -m pytest

      - name: npm-production-audit
        working-directory: apps/ugence-governance-studio/frontend
        # blocking on high/critical; report accurate severity counts (moderate allowed,
        # never described as "clean" when present).
        run: |
          npm audit --omit=dev --json > /tmp/npm-audit.json || true
          python - <<'PY'
          import json
          v = json.load(open("/tmp/npm-audit.json")).get("metadata", {}).get("vulnerabilities", {})
          print("npm production vulnerabilities:", v)
          assert v.get("critical", 0) == 0 and v.get("high", 0) == 0, "blocking: high/critical npm vulnerabilities"
          if v.get("moderate", 0) or v.get("low", 0):
              print(f"NOTE: {v.get('moderate',0)} moderate / {v.get('low',0)} low advisories present (documented, not blocking)")
          PY

  resolve-base-images:
    # Resolution stage (§3): resolve live base-image digests from the registry manifest
    # API and upload a machine-readable report. Run manually (workflow_dispatch) to obtain
    # digests to commit; it does NOT silently update the approved pins.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: resolve
        run: |
          python deployment/governance-studio/ci/resolve_base_images.py \
            deployment/governance-studio/base-images.json /tmp/base-image-resolution.json
          cat /tmp/base-image-resolution.json
      - uses: actions/upload-artifact@v4
        with: { name: base-image-resolution, path: /tmp/base-image-resolution.json }

  container:
    # Requires a container runtime AND container-registry access to pull the pinned base
    # images. base-image-digest-verification is BLOCKING: a null/unresolved or drifted
    # digest, an unpinned Dockerfile, or an inaccessible registry all fail the job — the
    # container gates never report as passed without a real build.
    runs-on: ubuntu-latest
    needs: application
    env:
      IMAGE: governance-studio-private-hosted:ci
      # Runtime evidence is written OUTSIDE the checkout, to a fresh directory keyed by
      # run id and attempt, so a committed or stale file can never be hashed as this
      # run's evidence. Reference records live in reference-evidence/ and are not read.
      EVIDENCE_DIR: ${{ runner.temp }}/p3e-evidence-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: evidence-dir-init
        # Must be empty at creation: a pre-populated directory is a failure, not a base.
        run: |
          if [ -e "$EVIDENCE_DIR" ]; then echo "FAIL evidence dir already exists: $EVIDENCE_DIR"; exit 1; fi
          mkdir -p "$EVIDENCE_DIR"
          [ -z "$(ls -A "$EVIDENCE_DIR")" ] || { echo "FAIL evidence dir not empty"; exit 1; }
          echo "evidence dir initialised empty: $EVIDENCE_DIR"

      - name: install-e2e-driver-deps
        run: pip install -e packages/tooling/policy-workflow-compiler -e packages/capabilities/agent-workforce-composer -e apps/ugence-governance-studio/backend -e deployment/governance-studio

      - name: ratified-pin-conformance
        # BLOCKING, and deliberately ahead of every other container step. Asserts
        # base-images.json == Dockerfile == the owner-ratified supply decision in
        # docs/audits/ugence_governance_studio_p3e/BASE_IMAGE_MIRROR_DECISION.json.
        # Combined with base-image-digest-verification below (live registry ==
        # base-images.json), this makes the ratified digest the transitive
        # authority for what is actually built: a re-pin or a substituted image
        # cannot land without editing the ratification record, which requires
        # owner re-ratification.
        run: python deployment/governance-studio/ci/verify_ratified_pins.py

      - name: base-image-digest-verification
        run: |
          python deployment/governance-studio/ci/resolve_base_images.py \
            deployment/governance-studio/base-images.json /tmp/live-resolution.json
          python - <<'PY'
          import json, sys
          pins = json.load(open("deployment/governance-studio/base-images.json"))
          live = {(r["repository"], r["tag"]): r for r in json.load(open("/tmp/live-resolution.json"))["results"]}
          df = open("deployment/governance-studio/Dockerfile").read()
          fail = []
          for e in pins["base_images"]:
              key = (e["repository"], e["tag"]); ref = f'{e["registry"]}/{e["repository"]}:{e["tag"]}'
              d = e.get("manifest_digest")
              if not d: fail.append(f"{ref}: pinned digest is null (blocking)"); continue
              lr = live.get(key, {})
              if lr.get("status") != "resolved": fail.append(f"{ref}: registry status {lr.get('status')}")
              elif lr.get("manifest_digest") != d: fail.append(f"{ref}: live {lr.get('manifest_digest')} != pinned {d}")
              if f"@{d}" not in df: fail.append(f"{ref}: Dockerfile does not pin {d}")
              if e.get("platform") != pins.get("platform", "linux/amd64"): fail.append(f"{ref}: platform mismatch")
          if fail: print("\n".join("FAIL "+f for f in fail), file=sys.stderr); sys.exit(1)
          print("base images: digest-pinned, live-verified, Dockerfile-pinned, platform-verified")
          PY

      - name: container-build
        run: |
          DFSHA=$(sha256sum deployment/governance-studio/Dockerfile | cut -d' ' -f1)
          docker buildx build --platform linux/amd64 --load -t "$IMAGE" -f deployment/governance-studio/Dockerfile .
          docker image inspect "$IMAGE" --format 'id={{.Id}} arch={{.Architecture}} os={{.Os}} size={{.Size}}'
          echo "IMAGE_ID=$(docker image inspect "$IMAGE" --format '{{.Id}}')" >> "$GITHUB_ENV"
          echo "DOCKERFILE_SHA256=$DFSHA" >> "$GITHUB_ENV"

      - name: image-inspection
        run: |
          test "$(docker inspect --format '{{.Config.User}}' "$IMAGE")" = "10001:10001"
          docker inspect --format '{{json .Config.ExposedPorts}}' "$IMAGE" | python -c "import json,sys; p=json.load(sys.stdin); assert list(p)==['8443/tcp'], p; print('exposes only 8443/tcp')"
          for t in npm node tsc gcc cc; do if docker run --rm --entrypoint sh "$IMAGE" -c "command -v $t" 2>/dev/null; then echo "FAIL $t present in runtime"; exit 1; fi; done
          echo "no npm/node/compiler in runtime image"
      - name: runtime-package-inventory
        id: runtime_package_inventory
        run: docker run --rm --entrypoint python "$IMAGE" -m pip freeze | tee "$EVIDENCE_DIR/runtime-image-packages.txt"

      - name: image-layer-secret-scan
        id: image_layer_secret_scan
        run: |
          # config/history first, then genuine per-layer CONTENT scan
          ! docker history --no-trunc "$IMAGE" | grep -Ei 'PASSWORD=|server\.key|BEGIN [A-Z ]*PRIVATE KEY|_TOKEN=|AWS_SECRET'
          python deployment/governance-studio/ci/scan_image_layers.py "$IMAGE" "$EVIDENCE_DIR/secret-scan.json"

      - name: container-runtime-verification
        id: container_runtime_verification
        run: |
          mkdir -p /tmp/tls
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/tls/server.key -out /tmp/tls/server.crt -days 2 -subj "/CN=localhost" -addext "subjectAltName=IP:127.0.0.1" 2>/dev/null
          openssl genrsa -out /tmp/tls/mismatch.key 2048 2>/dev/null   # for the cert/key-mismatch startup negative
          chmod +x deployment/governance-studio/ci/verify_container.sh
          deployment/governance-studio/ci/verify_container.sh "$IMAGE" /tmp/tls operator "demo-pass-123"

      - name: image-sbom
        id: image_sbom
        # pinned SBOM action (Syft); binds the SBOM to the built image
        uses: anchore/sbom-action@v0.17.9
        with:
          image: governance-studio-private-hosted:ci
          format: cyclonedx-json
          output-file: ${{ env.EVIDENCE_DIR }}/sbom.image.cdx.json

      - name: container-vulnerability-scan
        id: container_vulnerability_scan
        # pinned Trivy action; blocking on HIGH/CRITICAL, JSON evidence
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: governance-studio-private-hosted:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: json
          output: ${{ env.EVIDENCE_DIR }}/container-scan.json

      - name: evidence-manifest
        if: always()
        # Hashes ONLY artifacts this run's producer step created successfully. A producer
        # that failed, was skipped or never ran yields a null hash and marks the manifest
        # INCOMPLETE; there is no fallback to a pre-existing file. The manifest records the
        # commit, run id, run attempt and the producing step for every entry.
        run: |
          python deployment/governance-studio/ci/build_evidence_manifest.py \
            --evidence-dir "$EVIDENCE_DIR" \
            --out "$EVIDENCE_DIR/evidence-manifest.json" \
            --producers "$PRODUCERS"
        env:
          PRODUCERS: >-
            {"runtime-package-inventory": "${{ steps.runtime_package_inventory.outcome }}",
             "image-layer-secret-scan": "${{ steps.image_layer_secret_scan.outcome }}",
             "image-sbom": "${{ steps.image_sbom.outcome }}",
             "container-vulnerability-scan": "${{ steps.container_vulnerability_scan.outcome }}",
             "container-runtime-verification": "${{ steps.container_runtime_verification.outcome }}"}

      - name: clean-checkout-reproducibility
        run: |
          TMP="$(mktemp -d)"; git archive HEAD | tar -x -C "$TMP"
          docker buildx build --platform linux/amd64 --load -t governance-studio-private-hosted:clean -f "$TMP/deployment/governance-studio/Dockerfile" "$TMP"
          A=$(docker image inspect "$IMAGE" --format '{{.Id}}'); B=$(docker image inspect governance-studio-private-hosted:clean --format '{{.Id}}')
          echo "primary=$A clean=$B"
          # application-artifact reproducibility is asserted in the application job; image
          # bit-reproducibility is reported (build timestamps/metadata may differ) — not a
          # P3E acceptance requirement.
          [ "$A" = "$B" ] && echo "image bit-reproducible" || echo "image not bit-reproducible (documented; application artifacts are reproducible)"

      - name: upload-evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3e-container-evidence
          path: ${{ env.EVIDENCE_DIR }}/*
