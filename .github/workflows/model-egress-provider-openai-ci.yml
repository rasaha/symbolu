name: model-egress-provider-openai-ci

# Scoped CI for ugence-model-egress-provider-openai (LP-6 step 6).
#
# The suite needs no database and no network: the adapter's transport is injected
# and the only one shipped is a fake. What CI adds over a local run is the
# isolated-install proof: the wheel is installed into a clean environment with the
# unit as its one dependency, and the installed distribution — not the source tree
# — is interrogated for its posture. The final step fails the job if any test
# skipped, and a separate job proves no socket is opened while the suite runs.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - "packages/integration/model-egress-provider-openai/**"
      - "packages/integration/model-egress-unit/**"
      - ".github/workflows/model-egress-provider-openai-ci.yml"
  push:
    branches:
      - "claude/**"
    paths:
      - "packages/integration/model-egress-provider-openai/**"
      - "packages/integration/model-egress-unit/**"
      - ".github/workflows/model-egress-provider-openai-ci.yml"

defaults:
  run:
    shell: bash

jobs:
  adapter-suite:
    name: Adapter suite (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the unit and the adapter from source, without a database driver
        run: |
          python -m pip install --upgrade pip
          pip install pytest tomli
          pip install --no-deps packages/integration/model-egress-unit
          pip install --no-deps packages/integration/model-egress-provider-openai
      - name: Adapter suite, with every socket refused
        run: |
          cd packages/integration/model-egress-provider-openai
          python - <<'PY'
          # A socket opened during the suite is a failure, not a warning: the
          # package's whole posture is that it cannot open one.
          import socket, sys, pytest
          def refuse(*a, **k):
              raise AssertionError("the adapter suite opened a socket")
          socket.socket.connect = refuse
          socket.create_connection = refuse
          sys.exit(pytest.main(["-o", "addopts=", "-v", "--no-header",
                                "--junitxml=/tmp/meu-openai.xml", "tests"]))
          PY
      - name: Fail if any test was skipped
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse("/tmp/meu-openai.xml").getroot()
          skipped = [tc.get("name") for tc in root.iter("testcase") if tc.find("skipped") is not None]
          total = len(list(root.iter("testcase")))
          if total == 0:
              print("No tests were collected at all — that is not a pass."); sys.exit(1)
          if skipped:
              print("A skipped row is NOT a passing row. Skipped:"); [print(f"  - {n}") for n in skipped]; sys.exit(1)
          print(f"{total} tests, none skipped.")
          PY

  distribution:
    name: Wheel build + isolated install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Build both wheels and install the adapter into a clean environment
        run: |
          python -m pip install --upgrade pip build
          python -m build packages/integration/model-egress-unit
          python -m build packages/integration/model-egress-provider-openai
          python -m venv /tmp/meu-openai-venv
          /tmp/meu-openai-venv/bin/pip install --upgrade pip
          /tmp/meu-openai-venv/bin/pip install \
            --find-links packages/integration/model-egress-unit/dist \
            packages/integration/model-egress-provider-openai/dist/*.whl
      - name: Interrogate the installed distribution, not the source tree
        run: |
          cd /tmp
          /tmp/meu-openai-venv/bin/python - <<'PY'
          import importlib.metadata as md
          import ugence_model_egress_provider_openai as pkg
          import ugence_model_egress_unit as meu
          assert pkg.LIVE_VENDOR_EGRESS is False and pkg.ENFORCEMENT_ENABLED is False
          assert pkg.MATURITY == "REFERENCE_GRADE_SHADOW_ONLY", pkg.MATURITY
          assert meu.genuine_call_admitted() is False, (meu.COMMISSIONING_STATUS, meu.LIVE_SYNTHETIC_VALIDATION_AUTHORIZATION)
          requires = md.requires("ugence-model-egress-provider-openai") or []
          runtime = [r for r in requires if "extra ==" not in r]
          assert runtime == ["ugence-model-egress-unit>=0.4.1"], runtime
          for forbidden in ("openai", "httpx", "requests", "aiohttp"):
              try:
                  md.distribution(forbidden)
              except md.PackageNotFoundError:
                  continue
              raise SystemExit(f"{forbidden} is installed beside the adapter; it must not be")
          # The installed adapter refuses a production posture with only the unit on the path.
          import uuid, datetime
          now = datetime.datetime(2026, 9, 11, tzinfo=datetime.timezone.utc)
          tenant = uuid.uuid4()
          req = meu.EgressRequest.create(
              request_id=uuid.uuid4(), tenant_id=tenant, correlation_id=uuid.uuid4(),
              submitted_at=now, not_valid_after=now + datetime.timedelta(hours=1),
              authorization=meu.reference_clearance(tenant_id=tenant, vendor="openai", model=pkg.DESIGNATED_MODEL),
              minimized_context=[meu.MinimizedUnit("u-1", "probe text", 2)],
              parameters={"max_output_tokens": 8})
          provider = pkg.OpenAIResponsesProvider(
              transport=pkg.FakeTransport(), custody=meu.ReferenceCustodyAdapter(vendor="openai", credential_profile="p"),
              budget=meu.CallBudget(), credential_profile="p")
          try:
              provider.execute(req, now=now, production=True)
          except meu.ProviderRefusedInProduction:
              print("installed adapter refuses a production posture:", pkg.__version__)
          else:
              raise SystemExit("the installed adapter did NOT refuse production")
          result = provider.execute(req, now=now)
          assert result.provenance["genuine_call"] is False
          assert result.payload.startswith(pkg.FAKE_RESPONSE_MARKER)
          print("fake transport answered with the marker; genuine_call is false")
          PY
