name: context-minimization-ci

# Scoped CI for the independent ugence-context-minimization leaf package. Runs the
# package suite (structural + oracle-verified safety, protection, budgets/determinism,
# public-API agreement, import-boundary), the migrated Console structural parity (the console
# now ships as packages/integration/console-api under ruling CP-2), the
# wheel + sdist build with isolated clean-venv install and a product-neutral demo, and
# platform-freeze verification. Triggered only by changes to the package, its migrated
# consumer, or this workflow.

concurrency:
  # A superseded run proves nothing about the commit that replaced it. Cancel
  # in-flight runs for the same ref on pull requests; never on a branch push,
  # where each commit's run is the evidence that commit was green.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - "packages/capabilities/context-minimization/**"
      - "packages/integration/console-api/src/ugence_console_api/capabilities/context_gateway.py"
      - "conftest.py"
      - ".github/workflows/context-minimization-ci.yml"
  push:
    # Feature-branch pushes AND the repository's actual default branch, so a merge
    # touching the package (matching the path filter) gets a recorded CI run.
    branches:
      - "claude/setup-symbolu-monorepo-**"
      - "claude/package-context-minimization-**"
      - "claude/context-minimization-**"
    paths:
      - "packages/capabilities/context-minimization/**"
      - "packages/integration/console-api/src/ugence_console_api/capabilities/context_gateway.py"
      - "conftest.py"
      - ".github/workflows/context-minimization-ci.yml"

defaults:
  run:
    shell: bash

jobs:
  package-suite:
    name: Context Minimization package suite (source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest build
      - name: Package suite (structural, oracle safety, protection, determinism, boundaries, packaging)
        run: python -m pytest packages/capabilities/context-minimization/tests -q
      - name: Artifacts are in sync with the implementation
        run: |
          python packages/capabilities/context-minimization/scripts/generate_artifacts.py
          git diff --exit-code packages/capabilities/context-minimization/artifacts

  console-parity:
    name: Migrated Console structural parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies (the console is a FastAPI service)
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic fastapi httpx
      - name: Console context-gateway parity + governed-loop
        # The parity test imports ugence_console_api, which since ruling CP-2 lives
        # under packages/integration/console-api/src. Named explicitly rather than
        # left to a root conftest: an importorskip that silently skips would report
        # green for a parity check that never ran.
        run: |
          PYTHONPATH="$PWD/packages/integration/console-api/src:$PYTHONPATH" \
            python -m pytest \
              packages/capabilities/context-minimization/tests/compatibility -q
          python -m pytest \
            packages/integration/console-api/tests/test_governed_loop.py -q

  isolated-install:
    name: Wheel + sdist build + isolated installation + demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build pytest
      - name: Build wheel + sdist, install into a clean --no-index venv, run the leaf proof
        run: python packages/capabilities/context-minimization/scripts/verify_context_minimization_distribution.py

  freeze:
    name: Platform-freeze verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic
      - name: Freeze verification (blocking — frozen artifacts must be unchanged)
        run: python -m platform_freeze.verify --manifest platform/PLATFORM_FREEZE_V1.json
