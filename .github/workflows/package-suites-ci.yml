name: package-suites-ci

# Runs the test suites of the packages that no other workflow ran.
#
# The repository's convention is one workflow per package, and it works — until a
# package ships without one. Twenty-two of sixty-one had a suite nothing executed
# when this was added, including every package of the wave 2 and wave 3 governance
# programme and four of the five wave 1 seams. Each was added with its suite green
# locally and nothing running it afterwards.
#
# So this workflow is the catch-all, and scripts/check_package_ci_coverage.py is the
# thing that keeps it honest: it fails when a package with a tests/ directory is
# named by no workflow at all, so the next package cannot drift the same way.
# tests/boundaries/test_package_ci_coverage.py asserts the same in the local suite.
#
# scripts/check_package_license.py is the second gate, on the same pattern and for the
# same reason: thirty-two of seventy-two packages shipped with no LICENSE while all
# seventy-two declared one in pyproject.toml. Its local twin is
# tests/boundaries/test_package_license.py.
#
# Each package runs from its own directory, because several rely on their own
# conftest.py to put src/ and their first-party dependencies on sys.path and cannot
# be collected from the repository root.
#
# Suites run on 3.10, 3.11 and 3.12 — the whole range these packages declare with
# requires-python >=3.10. The 3.10 leg was blocked until now by three couplings in test
# code and committed artifacts, none of them in any package's src/: a bare
# `import tomllib` (stdlib only from 3.11) now falls back to the `tomli` backport, which
# the install steps below provide; public_api.json manifests recorded
# `BaseException.add_note`, a 3.11 addition that made the artifact a statement about the
# interpreter that generated it, and the generators now exclude inherited exception
# methods so the manifest reproduces on any interpreter; and one assertion pinned
# CPython's exact AttributeError wording, which 3.10 spells differently for the same
# refusal. Each was fixed at the coupling, never by relaxing what the test discriminates.

on:
  pull_request:
    paths:
      - "packages/**"
      - "scripts/check_package_ci_coverage.py"
      - "scripts/check_package_license.py"
      - "tests/boundaries/test_package_ci_coverage.py"
      - "tests/boundaries/test_package_license.py"
      - ".github/workflows/package-suites-ci.yml"
  push:
    branches:
      - "claude/setup-symbolu-monorepo-**"
      - "claude/**"
    paths:
      - "packages/**"
      - "scripts/check_package_ci_coverage.py"
      - "scripts/check_package_license.py"
      - "tests/boundaries/test_package_ci_coverage.py"
      - "tests/boundaries/test_package_license.py"
      - ".github/workflows/package-suites-ci.yml"

defaults:
  run:
    shell: bash

jobs:
  coverage-gate:
    name: Every package suite is named by some workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: No package may ship a suite nothing runs
        run: python scripts/check_package_ci_coverage.py

  license-gate:
    name: Every package ships a LICENSE its metadata agrees with
    runs-on: ubuntu-latest
    # Thirty-two of seventy-two packages had no LICENSE while all seventy-two
    # declared one in pyproject.toml, so the file's presence recorded nothing. The
    # thirty-two were normalized before this gate landed — a gate introduced midway
    # through a migration fails on work nobody has done yet, and teaches everyone to
    # ignore it. It checks agreement, not byte-equality: five distinct proprietary
    # texts exist, all naming the same license, and a package may say more about it
    # than the bare word so long as it does not say something else.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: No package may ship without a LICENSE, or with one it contradicts
        run: python scripts/check_package_license.py

  package-suite:
    name: ${{ matrix.package }} (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # One package's failure must not hide another's: this is the first run these
      # suites have ever had in CI, so surface all of them. The same applies across
      # interpreters — a 3.12-only failure must not be masked by a green 3.11 leg.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        package:
          - packages/capabilities/action-clearance
          - packages/capabilities/agent-value-readiness
          - packages/capabilities/llm-steering-controller
          - packages/capabilities/model-selection
          - packages/capabilities/readiness-comparison
          - packages/capabilities/reasoning-method-advisor
          - packages/capabilities/reasoning-method-governance
          - packages/capabilities/storygraph
          - packages/capabilities/workflow-fit-pilot
          - packages/governance-provider-framework
          - packages/governed-value
          - packages/integration/agent-assurance-evidence
          - packages/integration/ai-system-registry
          - packages/integration/approval-workflow
          - packages/integration/authority-directory
          - packages/integration/cloud-scaling-action-admission
          - packages/integration/cloud-scaling-bounded-execution
          - packages/integration/cloud-scaling-credential-broker
          - packages/integration/cloud-scaling-envelope-issuance
          - packages/integration/clearance-export
          - packages/integration/console-api
          - packages/integration/control-plane-root
          - packages/integration/data-use-admission
          - packages/integration/execution-reservation
          - packages/integration/incident-response
          - packages/integration/vendor-dependency
          - packages/tooling/workflow-converters
          - packages/uvi-policy-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Install test dependencies
        # numpy is a real transitive requirement of the four cloud-scaling packages:
        # each composes ugence-cloud-scaling-controller, whose controller.py imports
        # it (capabilities/cloud-scaling-controller/.../controller.py:13). It is
        # installed rather than the suites being excluded — a package whose
        # dependency is missing is a package whose tests did not run.
        # cryptography and pynacl are likewise real and fail-closed. The four
        # cloud-scaling packages reach trusted-evidence-authority through their
        # fixture chain, and it refuses to import without either — deliberately:
        # "There is no pure-Python fallback: a trusted-evidence verifier must not
        # silently downgrade to unvetted cryptography", and for PyNaCl, "Length
        # validation alone is not a substitute ... closure-audit finding F-03".
        # Installing them is the only correct response; excluding the four suites
        # would be reporting green for tests that never ran. cffi is PyNaCl's
        # native binding, without which the import dies in an unreadable pyo3
        # panic. pydantic is needed by governance-provider-framework's optional
        # adapter. fastapi and httpx are real for console-api: it IS a FastAPI
        # service, and its CP-3 route surface and CP-4 per-answer disclosure are
        # asserted against the running application through TestClient, which needs
        # httpx. Without them those two rulings would be checked by nothing.
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy cffi cryptography pydantic pynacl fastapi httpx tomli
      - name: Suite
        # From the package's own directory: several need their conftest.py to put
        # src/ and their first-party dependencies on sys.path, and cannot be
        # collected from the repository root.
        run: |
          cd "${{ matrix.package }}"
          python -m pytest -q

  refusal-mutation-sweep:
    name: ${{ matrix.package }} refusal sweep
    runs-on: ubuntu-latest
    # Two packages ship a sweep that disables each refusal in src/ in turn and
    # reports the ones no test catches. control-plane-root's README says the
    # coverage claim "ships rather than being described, so it can be run instead
    # of believed" — which it could not, while nothing ran it. The suite job above
    # runs suites only, so these are their own job: the sweep re-runs the whole
    # package suite once per refusal site and is far slower than the suite itself.
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/integration/control-plane-root
          - packages/integration/incident-response
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Every refusal is observed by some test; a survivor fails this job
        # The script exits non-zero when any mutant survives, so no separate
        # assertion on its output is needed.
        run: python ${{ matrix.package }}/scripts/mutation_sweep.py

  clearance-export-distribution:
    name: ugence-clearance-export built artifact (CE-2, CE-3, CE-4, CE-5, CE-7)
    runs-on: ubuntu-latest
    # The package's suite runs against the source tree, where sibling packages are on
    # sys.path and an undeclared import still resolves. The wheel has no such comfort:
    # built, installed into a clean --no-index venv with only its one declared
    # dependency, and interrogated as an installed package. The negative proof —
    # install fails when action-clearance is withheld — cannot be run from source.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build, install into a clean venv, and interrogate the installed package
        run: python packages/integration/clearance-export/scripts/verify_clearance_export_distribution.py

  console-api-distribution:
    name: ugence-console-api built artifact (CP-2, CP-3, CP-4, CP-5)
    runs-on: ubuntu-latest
    # The console's suite runs against the source tree, where the repository root
    # conftest puts every platform package on sys.path. That is exactly the comfort
    # ruling CP-5 exists to remove: an undeclared dependency still imports there. So
    # the four rulings are also proved against the wheel — built, installed into a
    # clean --no-index venv, and interrogated as an installed package. The negative
    # proof (install refuses when a governance dependency is withheld) cannot be run
    # from source at all.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build, install into a clean venv, and interrogate the installed package
        run: python packages/integration/console-api/scripts/verify_console_api_distribution.py
