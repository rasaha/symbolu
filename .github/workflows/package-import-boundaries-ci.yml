name: package-import-boundaries-ci

# Repository-wide package layering guard.
#
# Every wave 2 and wave 3 package README states "no capability package may import
# it", and no package can test that: a package can assert what it imports, never
# what imports it. That claim is about the whole repository, so it is enforced here.
#
# Two rules, both derived from the repository rather than a hand-maintained list,
# so a new package is governed the moment it exists:
#   1. layering — a capability or leaf package may never import an integration
#      package; integration composes, it is not composed.
#   2. declared dependency — every module-scope first-party import must appear in
#      that package's pyproject dependencies.
#
# The checker reads source and manifests only: it imports nothing and installs no
# package, so it needs no dependency present and cannot be defeated by a side effect.

on:
  pull_request:
    paths:
      - "packages/**/pyproject.toml"
      - "packages/**/src/**/*.py"
      - "scripts/check_package_import_boundaries.py"
      - "tests/boundaries/test_package_import_boundaries.py"
      - ".github/workflows/package-import-boundaries-ci.yml"
  push:
    branches:
      - "claude/**"

jobs:
  package-import-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        # The checker itself is stdlib-only; pytest is for the guard's own tests.
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Package import boundaries (blocking)
        run: python scripts/check_package_import_boundaries.py

      - name: Guard tests — the checker must actually catch a violation
        run: python -m pytest tests/boundaries/test_package_import_boundaries.py -q

      - name: Machine-readable report (informational)
        if: always()
        run: python scripts/check_package_import_boundaries.py --json || true
