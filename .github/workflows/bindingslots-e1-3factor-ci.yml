name: bindingslots-e1-3factor-ci

on:
  push:
    paths:
      - 'experiments/bindingslots_e1_3factor/**'
      - 'docs/audits/bindingslots_e1_3factor/**'
      - '.github/workflows/bindingslots-e1-3factor-ci.yml'
  pull_request:
    paths:
      - 'experiments/bindingslots_e1_3factor/**'
      - '.github/workflows/bindingslots-e1-3factor-ci.yml'

permissions:
  contents: read

jobs:
  e1-3factor-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Frozen abc.json digest (pre)
        run: sha256sum experiments/phase_lc/results/abc.json | tee /tmp/abc_before.txt

      - name: Factorial gates / selection / verdict / effects / leakage tests (torch-free)
        run: python experiments/bindingslots_e1_3factor/tests/test_factor_gates.py

      - name: No-oracle-at-inference proof (AST + signature, torch-free)
        run: |
          python - <<'PY'
          import sys, pathlib
          sys.path.insert(0, "experiments/bindingslots_e1_3factor")
          import factor_leakage as L
          r = L.check_scoring_no_oracle()
          assert r["pass"], r["problems"]
          assert r["signature_ok"] == {"scores": True, "forward": True}, r["signature_ok"]
          assert L.check_no_table_import()["pass"]
          print("no-oracle-at-inference: PASS")
          PY

      - name: Verdict invariants (if evidence present)
        run: |
          python - <<'PY'
          import json, pathlib
          a = pathlib.Path("experiments/bindingslots_e1_3factor/results/factorial_analysis.json")
          if a.exists():
              d = json.loads(a.read_text())
              allowed = {"T4_FACTORIAL_SINGLE_FACTOR_SELECTED","T4_FACTORIAL_COMBINATION_SELECTED",
                "T4_FACTORIAL_ALL_FACTORS_REQUIRED","T4_FACTORIAL_NO_INTERVENTION_SELECTED",
                "T4_FACTORIAL_PROTOCOL_VIOLATED","T4_FACTORIAL_RESOURCE_BLOCKED"}
              assert d["verdict"] in allowed, d["verdict"]
              for tok in ("E1_TEMPORAL_TRANSFER_PARTIAL","ORIGINAL_BINDINGSLOTS_NEURAL_ROUTING_UNRESOLVED",
                          "KDA_VALIDATION_BLOCKED"):
                  assert tok in d["preserved"], tok
              blob = json.dumps(d)
              for forbidden in ("E1_TEMPORAL_TRANSFER_VALIDATED","E1_STRUCTURAL_TRANSFER_CONFIRMED"):
                  assert forbidden not in blob, forbidden
              # selected-cell must be consistent with the verdict
              if d["verdict"] == "T4_FACTORIAL_NO_INTERVENTION_SELECTED":
                  assert d["selected_cell"] is None
              print("verdict:", d["verdict"], "| selected:", d["selected_cell"])
          else:
              print("no factorial verdict yet")
          PY

      - name: Frozen abc.json unchanged
        run: |
          sha256sum experiments/phase_lc/results/abc.json | tee /tmp/abc_after.txt
          diff /tmp/abc_before.txt /tmp/abc_after.txt && echo "abc.json unchanged"
