name: TTOR CI/CD Pipeline

on:
  push:
    branches: ["main", "master"]
    paths:
      - "mechanical/pipeline/ttor/**"
      - ".github/workflows/ttor-ci.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "mechanical/pipeline/ttor/**"
      - ".github/workflows/ttor-ci.yml"
  workflow_dispatch:

jobs:
  ttor-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Load cached dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov coverage mypy flake8 pydantic

      - name: Run TTOR unit + integration tests with coverage
        run: |
          pytest mechanical/pipeline/ttor/tests \
            --cov=mechanical/pipeline/ttor \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=90 \
            --disable-warnings --maxfail=1 -q \
            2>&1 | tee ttor-pytest.log

      - name: Type check with mypy
        run: |
          mypy mechanical/pipeline/ttor --strict \
            2>&1 | tee ttor-mypy.log

      - name: Lint with flake8
        run: |
          flake8 mechanical/pipeline/ttor --max-line-length=120 \
            2>&1 | tee ttor-flake8.log

      - name: Upload TTOR test logs
        uses: actions/upload-artifact@v4
        with:
          name: ttor-test-logs
          path: |
            ttor-pytest.log
            ttor-mypy.log
            ttor-flake8.log

      - name: Upload TTOR coverage report
        uses: actions/upload-artifact@v4
        with:
          name: ttor-coverage-report
          path: |
            htmlcov/
            coverage.xml

      - name: Upload TTOR debug snapshots
        if: hashFiles('mechanical/pipeline/ttor/**/*.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ttor-debug-snapshots
          path: mechanical/pipeline/ttor/**/*.log
