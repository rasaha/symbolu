name: agent-workforce-composer-p1-ci

# Scoped CI for the independent ugence-agent-workforce-composer capability (P1).
# Runs the package suite, the compiler-adapter fidelity suite, the eligibility +
# evidence suite, the import-boundary suite, the public-API frozen-artifact check,
# the clean-install isolated-distribution verifier (wheel/sdist, out-of-root import,
# CLI, cross-process determinism, reproducibility), determinism/replay, architecture
# assertions, a stale-terminology scan, and platform-freeze verification (blocking).
# No network runs, no live agents, no secrets, no model APIs. Path-scoped triggers.

on:
  pull_request:
    paths:
      - "packages/capabilities/agent-workforce-composer/**"
      - ".github/workflows/agent-workforce-composer-p1-ci.yml"
  push:
    branches:
      - "claude/setup-symbolu-monorepo-**"
      - "claude/agent-workforce-composer-p1-**"
      - "chatgpt/awc-p1-**"
    paths:
      - "packages/capabilities/agent-workforce-composer/**"
      - ".github/workflows/agent-workforce-composer-p1-ci.yml"

defaults:
  run:
    shell: bash

env:
  PKG: packages/capabilities/agent-workforce-composer
  SRC: packages/capabilities/agent-workforce-composer/src

jobs:
  package-suite:
    name: Package suite (source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install pytest pydantic
      - name: Full test suite
        env:
          PYTHONPATH: ${{ env.SRC }}
        run: python -m pytest ${{ env.PKG }}/tests -q
      - name: Contract + honest P1 maturity
        env:
          PYTHONPATH: ${{ env.SRC }}
        run: |
          python -m ugence_agent_workforce_composer.cli version
          python - <<'PY'
          # What this job asserts is P1's invariants — the contract P1 established and
          # the capabilities P1 delivered — and deliberately NOT the distribution's
          # current version.
          #
          # It used to assert `__version__ == "0.1.0"`, and went red the day P2 shipped
          # 0.2.0, staying red through P2.1. Every phase workflow re-pinned the current
          # version, so only the newest phase could ever pass and each release turned its
          # predecessors red. The literal also lived in three workflows plus the package's
          # own suite, which is four places to update for one fact.
          #
          # The version is pinned exactly once now, in the package's own
          # tests/test_public_api.py and its distribution verifier — both of which travel
          # with the package and change in the same commit the version does. This job runs
          # that suite in the step above, so the fact is still checked; it is just no
          # longer duplicated here where it cannot be kept true.
          import ugence_agent_workforce_composer as u
          # awc.v1 is a real P1 invariant: P2 and P2.1 are additive and must not move it.
          assert u.CONTRACT_VERSION == "awc.v1", u.CONTRACT_VERSION
          i = u.version_info().to_dict()
          for k in ("canonical_object_model_implemented","compiler_adapter_implemented",
                    "hard_constraint_eligibility_implemented","deterministic_replay_verified"):
              assert i[k] is True, k
          # `agent_ranking_implemented` and `team_composition_implemented` were in this
          # list and are now True: P2 implements them, and agent-workforce-composer-p2-ci
          # asserts them True. A later phase delivering them is not this phase regressing.
          for k in ("permission_assignment_implemented","runtime_handoff_implemented",
                    "h16_migration_implemented","live_registry_implemented",
                    "pilot_validated","production_certified"):
              assert i[k] is False, k
          print("maturity honest")
          PY

  compiler-adapter-suite:
    name: Compiler-adapter fidelity (vs live WorkflowIR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip && pip install pytest pydantic
          pip install -e packages/capabilities/decision-authority
          pip install -e packages/products/procurement || true
          pip install -e packages/tooling/policy-workflow-compiler
      - name: Adapter + compiler-reference tests
        env:
          PYTHONPATH: ${{ env.SRC }}
        run: python -m pytest ${{ env.PKG }}/tests/test_adapter.py ${{ env.PKG }}/tests/test_compiler_reference.py ${{ env.PKG }}/tests/test_examples.py -q

  eligibility-and-evidence-suite:
    name: Eligibility + evidence suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install pytest pydantic
      - env:
          PYTHONPATH: ${{ env.SRC }}
        run: python -m pytest ${{ env.PKG }}/tests/test_eligibility.py ${{ env.PKG }}/tests/test_evidence.py ${{ env.PKG }}/tests/test_objects.py -q

  import-boundary-suite:
    name: Import-boundary integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install pytest pydantic
      - env:
          PYTHONPATH: ${{ env.SRC }}
        run: python -m pytest ${{ env.PKG }}/tests/test_boundaries.py -q

  public-api-freeze:
    name: Public-API frozen artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install pydantic
      - name: Snapshot is in sync with the frozen artifact
        env:
          PYTHONPATH: ${{ env.SRC }}
        run: |
          python ${{ env.PKG }}/scripts/public_api_snapshot.py > /tmp/live_api.json
          python - <<'PY'
          import json
          live = json.load(open("/tmp/live_api.json"))
          frozen = json.load(open("packages/capabilities/agent-workforce-composer/artifacts/public_api.json"))
          assert live == frozen, "public API drifted from artifacts/public_api.json"
          print("public API in sync:", live["count"], "names")
          PY

  isolated-distribution:
    name: Clean-install verifier, wheel/sdist, CLI, reproducibility
    runs-on: ubuntu-latest
    # NOTE: intentionally no PYTHONPATH — the verifier resolves the installed wheel.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install build
      - run: python ${{ env.PKG }}/verify_agent_workforce_composer_distribution.py

  determinism-replay:
    name: Determinism + replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install pytest pydantic
      - env:
          PYTHONPATH: ${{ env.SRC }}
        run: python -m pytest ${{ env.PKG }}/tests/test_determinism.py ${{ env.PKG }}/tests/test_cli.py -q

  architecture-assertions:
    name: Architecture assertions (eligibility is score-free; nothing grants or executes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install pydantic
      - name: Eligibility stays score-free, and no grant or execution surface exists
        env:
          PYTHONPATH: ${{ env.SRC }}
        run: |
          python - <<'PY'
          # This job asserted a blacklist of seven names, and had two problems.
          #
          # It was stale: AgentTeamPlan is banned there and P2 delivers it
          # (agent_team_plan_implemented is True), which is what failed here.
          #
          # It was also vacuous, which matters more. The other six names — rank_agents,
          # score_agents, compose_team, select_agent, PolicyWeights, assign_permissions —
          # have never existed in this package under those spellings. The real surface is
          # rank_eligible_candidates, compose_agent_team, build_agent_team_plan and
          # propose_permission_bound, so the blacklist would have passed unchanged even if
          # P1 itself had shipped ranking. A name blacklist only catches the one spelling
          # somebody thought of.
          #
          # What replaces it is the invariant that is actually true and actually load-
          # bearing, tied to what version_info() reports rather than to a list of words:
          # this package proposes and never grants, and plans and never executes.
          import re
          import ugence_agent_workforce_composer as u
          import ugence_agent_workforce_composer.api as api

          names = set(api.__all__)
          maturity = u.version_info().to_dict()

          # 1. No granting, assigning, executing, dispatching or provisioning surface —
          #    checked by pattern, so a new name cannot slip past a fixed list, and tied
          #    to the booleans that must stay False for as long as that is true.
          for flag in ("permission_granting_implemented", "permission_assignment_implemented",
                       "runtime_execution_implemented", "runtime_handoff_implemented"):
              assert maturity[flag] is False, f"{flag} became True; this gate needs rewriting"
          forbidden = re.compile(
              r"grant|assign_permission|execute|execution|dispatch|invoke|authorize|provision|runtime",
              re.I)
          offenders = sorted(n for n in names if forbidden.search(n))
          assert not offenders, (
              "a grant/execute surface appeared while the maturity booleans say there is "
              f"none: {offenders}")

          # 2. Proposing permission is allowed and granting it is not, so the proposal
          #    type must exist — a gate that passes because a surface vanished is not
          #    measuring anything.
          assert "PermissionBoundProposal" in names, "the permission-proposal surface is gone"

          # 3. Every eligibility result is score-free. This is the P1 invariant that
          #    survives P2 intact: ranking happens over the eligible set, and never
          #    inside the eligibility record itself.
          from ugence_agent_workforce_composer import fixtures
          _, res = fixtures.run_demo("procurement")
          checked = 0
          for rep in res.reports:
              for r in rep.results:
                  assert not ({"score","rank","winner","recommended","selected"} & set(r.model_dump()))
                  checked += 1
          assert checked, "no eligibility results were examined"
          print(f"architecture assertions OK ({checked} eligibility results, score-free)")
          PY

  terminology:
    name: Stale-terminology scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No premature maturity claims in package docs
        run: |
          python - <<'PY'
          import pathlib, re, sys
          pkg = pathlib.Path("packages/capabilities/agent-workforce-composer")
          bad = re.compile(r"\b(production[- ]ready|pilot[- ]validated|production[- ]certified)\b", re.I)
          hist = re.compile(r"(false|not |never|no |=false|is False)", re.I)
          offenders = []
          for md in list(pkg.glob("*.md")) + list((pkg/'docs').glob("*.md")):
              for i, line in enumerate(md.read_text(encoding="utf-8").splitlines(), 1):
                  if bad.search(line) and not hist.search(line):
                      offenders.append(f"{md}:{i}: {line.strip()}")
          if offenders:
              print("Stale maturity claims:"); [print("  -", o) for o in offenders]; sys.exit(1)
          print("terminology OK")
          PY

  platform-freeze:
    name: Platform-freeze verification (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip && pip install pytest pydantic
          pip install -e packages/capabilities/decision-authority
      - name: Freeze verification (frozen governance artifacts must be unchanged)
        run: python -m platform_freeze.verify --manifest platform/PLATFORM_FREEZE_V1.json
