name: unseen-identifier-integrity

# Experiment-specific integrity CI for the unseen-identifier copy/selection diagnostic.
# Runs ONLY bounded unit/integrity checks on fixture-only seeds. It never trains the model,
# never generates smoke/development/final cohorts, never consumes a reserved seed, never produces
# scientific evidence, and never issues a scientific verdict.

on:
  pull_request:
    paths:
      - "experiments/unseen_identifier_copy_selection/**"
      - "tests/experiments/unseen_identifier_copy_selection/**"
      - ".github/workflows/unseen-identifier-integrity.yml"
      - "docs/research/hybrid_llm/benchmarks/UNSEEN_IDENTIFIER_COPY_SELECTION_IMPLEMENTATION_*.md"
      - "docs/research/hybrid_llm/benchmarks/UNSEEN_IDENTIFIER_EXECUTION_INTERFACE_*.md"
      - "docs/research/hybrid_llm/benchmarks/UNSEEN_IDENTIFIER_AUTHORIZATION_SECURITY_HARDENING.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unseen-identifier-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile package
        run: python -m compileall -q experiments/unseen_identifier_copy_selection tests/experiments/unseen_identifier_copy_selection

      - name: Static guard — no top-level torch import in the package
        run: |
          if grep -REn '^[[:space:]]*(import torch|from torch)' experiments/unseen_identifier_copy_selection/*.py ; then
            echo "forbidden top-level torch import found (torch must be imported lazily inside functions)"; exit 1
          fi
          echo "OK: no module-load torch import"

      - name: Static guard — CLI --help runs without a model, data, or writes
        env:
          PYTHONPATH: .
        run: |
          python -m experiments.unseen_identifier_copy_selection build-cohort --help >/dev/null
          python -m experiments.unseen_identifier_copy_selection --help >/dev/null
          echo "OK: --help is inert"

      - name: Static guard — reserved seeds fail closed at the command boundary
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from experiments.unseen_identifier_copy_selection.cli import main, EXIT_AUTH_REFUSED
          # A reserved seed with no valid record must be auth-refused (no training, no cohort).
          code = main(["build-cohort", "--seed", "9070", "--cohort", "unseen",
                       "--authorization-record", "/nonexistent.json", "--output-dir", "/tmp/should-not-appear"])
          assert code == EXIT_AUTH_REFUSED, code
          import os
          assert not os.path.exists("/tmp/should-not-appear"), "reserved seed produced output"
          print("OK: reserved seed fails closed")
          PY

      - name: Security guard — authorization forgery is closed (no committed scientific document exists)
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import os
          from experiments.unseen_identifier_copy_selection import execution as ex
          from experiments.unseen_identifier_copy_selection.execution import (
              AuthorizationContext, AuthorizationRecordError, ExecutionNotAuthorized,
              SMOKE_EXECUTION_STATE, active_authorization, authorize, compute_record_digest,
              require_execution_authorization)
          from experiments.unseen_identifier_copy_selection.manifest import frozen_recipe_source_hashes
          # Provenance forgery: a fabricated record naming a non-committed doc must fail closed.
          rec = {"authorization_state": SMOKE_EXECUTION_STATE, "cohort": "unseen", "permitted_seeds": [9070],
                 "protocol_lock_commit": "PL", "implementation_authorization_commit": "a"*40,
                 "implementation_commit": "b"*40, "model_recipe_hashes": frozen_recipe_source_hashes(),
                 "parameter_count": 209728, "scope": "one-run",
                 "authorization_document_commit": "a"*40,
                 "authorization_document_path": "docs/research/hybrid_llm/benchmarks/UNSEEN_IDENTIFIER_EXECUTION_AUTHORIZATION.json",
                 "authorization_document_digest": "c"*64}
          rec["record_digest"] = compute_record_digest(rec)
          try:
              authorize(rec, seed=9070, cohort="unseen"); raise SystemExit("FAIL: fabricated artifact accepted")
          except AuthorizationRecordError:
              pass
          # Context forgery: a directly-constructed context must never satisfy the guard.
          try:
              AuthorizationContext(mint_key=object(), authorization_state=SMOKE_EXECUTION_STATE, seed=9070,
                  cohort="unseen", record_digest="x", document_commit="c", document_digest="d",
                  protocol_lock_commit="p", implementation_authorization_commit="i", implementation_commit="j",
                  model_recipe_hashes=(), parameter_count=209728, scope="one-run")
              raise SystemExit("FAIL: direct context construction succeeded")
          except AuthorizationRecordError:
              pass
          assert ex._ACTIVE_CAPABILITIES == {}
          print("OK: provenance and context forgery are closed; no scientific document committed")
          PY

      - name: Run bounded integrity tests (fixture seeds only; no training, no cohort, no reserved seed, no verdict)
        env:
          PYTHONPATH: .
        run: pytest -q tests/experiments/unseen_identifier_copy_selection
