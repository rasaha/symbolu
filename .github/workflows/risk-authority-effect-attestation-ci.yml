name: risk-authority-effect-attestation-ci

# Scoped CI for the wave 5 "Signed external-effect verification" slice
# (ugence-risk-authority-effect-attestation), scoped by
# docs/architecture/ADR_UGENCE_SIGNED_EFFECT_ATTESTATION_SCOPING.md (SE-1 to SE-5).
#
# A verified effect attestation proves provenance and integrity, never that the effect
# occurred. The package is REFERENCE-GRADE / NOT PRODUCTION-READY and is not wired into
# RA-8.
#
# ADDITIVE and PATH-SCOPED. It does not touch or weaken trusted-evidence-authority-ci,
# cloud-scaling-producer-attestation-ci or any Risk Authority workflow. It runs the
# package suite, the measured mutation sweep, the offline isolated-install proof, and
# the three neighbouring baselines this slice touches or borrows from (the Trusted
# Evidence Authority, whose enum lent two capabilities; 5B-0A, the other TEA consumer;
# RA-8, the future integration target, which must be unchanged).

on:
  pull_request:
    paths:
      - "packages/integration/risk-authority-effect-attestation/**"
      - "packages/trusted-evidence-authority/**"
      - "packages/governance-contracts/**"
      - "packages/integration/risk-authority-execution-assurance/**"
      - "docs/architecture/ADR_UGENCE_SIGNED_EFFECT_ATTESTATION_SCOPING.md"
      - "docs/architecture/ADR_UGENCE_RA8_EFFECT_ATTESTATION_INTEGRATION.md"
      - ".github/workflows/risk-authority-effect-attestation-ci.yml"
  push:
    branches:
      - "claude/effect-attestation-**"
      - "claude/setup-symbolu-monorepo-**"
    paths:
      - "packages/integration/risk-authority-effect-attestation/**"
      - "packages/trusted-evidence-authority/**"
      - "packages/governance-contracts/**"
      - ".github/workflows/risk-authority-effect-attestation-ci.yml"

defaults:
  run:
    shell: bash

jobs:
  effect-attestation-suite:
    name: Package suite + public-API parity + measured mutation sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest build pyflakes \
                      "cryptography>=41.0.7,<47.0.0" "PyNaCl>=1.5.0,<2.0.0"
          pip install --no-deps \
            -e packages/governance-contracts \
            -e packages/trusted-evidence-authority \
            -e packages/integration/risk-authority-effect-attestation
      - name: Static hygiene
        run: |
          cd packages/integration/risk-authority-effect-attestation
          python -m pyflakes src tests scripts conftest.py
      - name: Package suite (from the package directory; its conftest owns sys.path)
        run: |
          cd packages/integration/risk-authority-effect-attestation
          python -m pytest tests -q -p no:cacheprovider
      - name: Public-API manifest is generated, not hand-edited
        run: |
          cd packages/integration/risk-authority-effect-attestation
          python scripts/generate_public_api.py --check
      - name: Measured mutation sweep — every survivor classified or the job fails
        run: python packages/integration/risk-authority-effect-attestation/scripts/mutation_sweep.py
      - name: The committed mutation ledger equals the one just measured
        run: git diff --exit-code -- packages/integration/risk-authority-effect-attestation/mutation_ledger.json

  neighbouring-baselines:
    name: TEA, 5B-0A and RA-8 baselines remain green
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy build pydantic "requests>=2.28.0" \
                      "cryptography>=41.0.7,<47.0.0" "PyNaCl>=1.5.0,<2.0.0"
          pip install --no-deps \
            -e packages/risk_authority \
            -e packages/trusted-evidence-authority \
            -e packages/capabilities/cloud-scaling-controller \
            -e packages/integration/cloud-scaling-risk-integration \
            -e packages/integration/cloud-scaling-authorization-contracts \
            -e packages/governance-contracts \
            -e packages/governance-provider-framework \
            -e packages/providers/tap \
            -e packages/runtime/agent-runtime \
            -e packages/integration/risk-authority-evidence-runtime \
            -e packages/integration/risk-authority-status-runtime \
            -e packages/providers/actiongate \
            -e packages/capabilities/cloud-scaling-operations \
            -e packages/integration/cloud-scaling-producer-attestation \
            -e packages/integration/risk-authority-effect-attestation
      - name: Trusted Evidence Authority (lent two effect capabilities; second consumer named)
        run: python -m pytest packages/trusted-evidence-authority -q -p no:cacheprovider
      - name: Cloud Scaling 5B-0A producer attestation (the other TEA consumer)
        run: python -m pytest packages/integration/cloud-scaling-producer-attestation -q -p no:cacheprovider
      - name: RA-8 execution assurance (attested ingress, RI-1 to RI-5)
        run: python -m pytest packages/integration/risk-authority-execution-assurance -q -p no:cacheprovider
      - name: Repository import boundaries and package-CI coverage
        run: |
          python -m pytest tests/boundaries/test_package_import_boundaries.py tests/boundaries/test_package_ci_coverage.py -q -p no:cacheprovider
          python scripts/check_package_ci_coverage.py

  isolated-install:
    name: Offline isolated install, negative controls, source-vs-installed parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling (host environment only)
        run: |
          python -m pip install --upgrade pip
          pip install build wheel
      - name: Phase A online, phases B–D offline
        run: python packages/integration/risk-authority-effect-attestation/scripts/verify_isolated_install.py
