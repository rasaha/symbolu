name: agent-workforce-composer-spec-ci

# Scoped, documentation-only CI for the Agent Workforce Composer architecture
# documents. It checks that the documents agree with the boundaries contract and the
# reconciliation ADR:
#   - architecture-assertion validation (boundaries contract);
#   - stale-terminology scan (no active "spec-only" / "when it ships" compiler claim);
#   - Markdown-link validation for the AWC documents, the ADR and the audit set;
#   - platform-freeze verification (blocking; digest must be unchanged);
#   - confirmation that H16 source behavior was not modified;
#   - confirmation that Policy Workflow Compiler source behavior was not modified.
# Triggered only by changes to the AWC docs, the ADR/boundary artifacts, the
# validation script, or this workflow.
#
# This described a "Phase 0" that adds no production package. That phase ended when
# the AWC P1 package shipped in 36f520396 (2026-08-03); the package now has its own
# p1, p2 and p2-1 workflows, which are where its production behavior is proved. What
# remains here is documentation consistency, and the two upstream-source guards.

concurrency:
  # A superseded run proves nothing about the commit that replaced it. Cancel
  # in-flight runs for the same ref on pull requests; never on a branch push,
  # where each commit's run is the evidence that commit was green.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - "Project_documentation/governance/workforce_composer/AGENT_WORKFORCE_COMPOSER_*.md"
      - "docs/architecture/ADR_AGENT_WORKFORCE_COMPOSER_H16_CANONICALIZATION.md"
      - "docs/architecture/agent_workforce_composer_boundaries.json"
      - "docs/audits/agent_workforce_composer_phase0/**"
      - "scripts/validate_awc_boundaries.py"
      - ".github/workflows/agent-workforce-composer-spec-ci.yml"
  push:
    branches:
      - "claude/setup-symbolu-monorepo-**"
      - "claude/awc-phase0-**"
      - "chatgpt/awc-phase0-**"
    paths:
      - "Project_documentation/governance/workforce_composer/AGENT_WORKFORCE_COMPOSER_*.md"
      - "docs/architecture/ADR_AGENT_WORKFORCE_COMPOSER_H16_CANONICALIZATION.md"
      - "docs/architecture/agent_workforce_composer_boundaries.json"
      - "docs/audits/agent_workforce_composer_phase0/**"
      - "scripts/validate_awc_boundaries.py"
      - ".github/workflows/agent-workforce-composer-spec-ci.yml"

defaults:
  run:
    shell: bash

jobs:
  doc-consistency:
    name: Architecture assertions, stale-terminology, Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Architecture-assertion + stale-terminology validation
        run: python scripts/validate_awc_boundaries.py
      - name: Markdown-link validation (AWC docs, ADR, audit set)
        run: |
          python - <<'PY'
          import pathlib, re, sys
          repo = pathlib.Path(".")
          # The seven AWC documents moved out of the repository root in the Stage-1
          # documentation migration; glob them where they live, or this finds nothing
          # and reports "links OK" over a set that excludes them.
          awc = repo / "Project_documentation/governance/workforce_composer"
          docs = sorted(awc.glob("AGENT_WORKFORCE_COMPOSER_*.md"))
          if len(docs) != 7:
              sys.exit(f"expected 7 AWC documents under {awc}, found {len(docs)}")
          docs.append(repo / "docs/architecture/ADR_AGENT_WORKFORCE_COMPOSER_H16_CANONICALIZATION.md")
          docs += list((repo / "docs/audits/agent_workforce_composer_phase0").glob("*.md"))
          link = re.compile(r"\[[^\]]*\]\((?!https?://|mailto:)([^)#]+)(?:#[^)]*)?\)")
          broken = []
          for d in docs:
              base = d.parent
              for i, line in enumerate(d.read_text(encoding="utf-8").splitlines(), 1):
                  for m in link.finditer(line):
                      target = m.group(1).strip()
                      if not target:
                          continue
                      # resolve relative to the doc, then relative to repo root
                      if not ((base / target).exists() or (repo / target).exists()):
                          broken.append(f"{d}:{i} -> {target}")
          if broken:
              print("Broken relative Markdown links:")
              for b in broken:
                  print("  -", b)
              sys.exit(1)
          print(f"Markdown links OK across {len(docs)} documents")
          PY

  no-upstream-source-change:
    # This job used to begin by asserting that
    # packages/capabilities/agent-workforce-composer did not exist. That assertion
    # became false in 36f520396 (2026-08-03), when the AWC P1 package shipped, and
    # it cannot pass again: the package is a released capability with its own three
    # workflows. An assertion that can never hold gates nothing — it only keeps the
    # check permanently red, which teaches readers to ignore it. It is removed
    # rather than relaxed. See the pull request for the ratification this needs.
    #
    # The two guards below are the part that still means something and are
    # unchanged: a change to the AWC documents must not smuggle in a change to H16
    # coordination or to Policy Workflow Compiler source.
    name: No H16 or compiler source change
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine diff base
        id: base
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: H16 coordination source behavior unchanged
        run: |
          CHANGED=$(git diff --name-only "${{ steps.base.outputs.sha }}"...HEAD -- \
            agentic/agentic_framework/coordination.py \
            agentic/agentic_framework/multi_agent.py || true)
          if [ -n "$CHANGED" ]; then
            echo "FAIL: H16 source changed in a documentation-only phase:"; echo "$CHANGED"; exit 1
          fi
          echo "OK: H16 source unchanged"
      - name: Policy Workflow Compiler source behavior unchanged
        run: |
          CHANGED=$(git diff --name-only "${{ steps.base.outputs.sha }}"...HEAD -- \
            'packages/tooling/policy-workflow-compiler/src/**' || true)
          if [ -n "$CHANGED" ]; then
            echo "FAIL: compiler source changed in a documentation-only phase:"; echo "$CHANGED"; exit 1
          fi
          echo "OK: compiler source unchanged"

  freeze:
    name: Platform-freeze verification (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic
          pip install -e packages/capabilities/decision-authority
      - name: Freeze verification (frozen governance artifacts must be unchanged)
        run: python -m platform_freeze.verify --manifest platform/PLATFORM_FREEZE_V1.json
