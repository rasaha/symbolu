name: agentic-proposer-ci

# Scoped CI for the independent ugence-agentic-proposer leaf capability (S1: the
# canonical contracts and equations are implemented, per
# docs/architecture/ADR_UGENCE_AGENTIC_PROPOSER_MVP_READINESS.md's OD-1 - OD-6).
# Runs the package suite (contracts, equations, leaf-dependency and import boundaries,
# the ratified D4 vocabulary, and the no-local-canonicalization guard), builds the
# wheel + sdist, and verifies isolated clean-venv installation against a locally built
# ugence-jcs wheel. public_api.json is the authorized S1 public-API snapshot (I6, I8).
# Triggered only by changes to the package, its declared identity substrate, or this
# workflow.

on:
  pull_request:
    paths:
      - "packages/capabilities/agentic-proposer/**"
      - "packages/jcs/**"
      - "docs/architecture/ADR_UGENCE_AGENTIC_PROPOSER_MVP_READINESS.md"
      - ".github/workflows/agentic-proposer-ci.yml"
  push:
    # Run on feature-branch pushes AND on the repository's actual default branch, so a
    # merge touching the package (matching the path filter) gets a recorded CI run.
    branches:
      - "claude/setup-symbolu-monorepo-**"
      - "claude/agentic-proposer-**"
    paths:
      - "packages/capabilities/agentic-proposer/**"
      - "packages/jcs/**"
      - "docs/architecture/ADR_UGENCE_AGENTIC_PROPOSER_MVP_READINESS.md"
      - ".github/workflows/agentic-proposer-ci.yml"

defaults:
  run:
    shell: bash

jobs:
  package-suite:
    name: Agentic Proposer package suite (source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        # pydantic and ugence-jcs are both declared core dependencies (I6's public
        # surface imports both at module load), so the environment must match what the
        # package actually declares and imports, not only what an earlier stage did.
        run: |
          python -m pip install --upgrade pip
          pip install pytest build pydantic
          pip install packages/jcs
      - name: Package suite (contracts, equations, boundaries, vocabulary, no-local-canonicalization)
        run: python -m pytest packages/capabilities/agentic-proposer/tests -q

  readiness-artifact:
    name: MVP readiness artifact must exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Readiness artifact present and records D1-D5
        # No public contract may be frozen and no version declared before this exists.
        run: |
          artifact=docs/architecture/ADR_UGENCE_AGENTIC_PROPOSER_MVP_READINESS.md
          test -f "$artifact"
          for d in D1 D2 D3 D4 D5; do
            grep -q "^## $d" "$artifact" || { echo "missing decision $d"; exit 1; }
          done

  isolated-install:
    name: Wheel build + isolated installation verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build wheel + sdist, install into a clean venv, run the leaf proof
        run: python packages/capabilities/agentic-proposer/verify_agentic_proposer_distribution.py

  freeze:
    name: Platform-freeze verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic
      - name: Freeze verification (blocking — frozen artifacts must be unchanged)
        run: python -m platform_freeze.verify --manifest platform/PLATFORM_FREEZE_V1.json
