name: approver-identity-jwt-ci

# Scoped CI for ugence-approver-identity-jwt (AI-C, owner rulings IA-1 to IA-5).
#
# The suite runs against an in-process issuer on 127.0.0.1 with keys generated at test
# time: no egress, no external identity provider, no credential. PyJWT and cryptography
# are installed within the bounds pyproject.toml declares, and the installed versions are
# printed so a drift outside them is visible in the log.
#
# The suite job runs on 3.10, 3.11 and 3.12 — the whole range this package declares
# with requires-python >= 3.10, and which no job ran until now. What blocked 3.10 was
# a bare `import tomllib` in the packaging/boundary test: stdlib only from 3.11, and a
# bare import, so installing the backport was not enough and the import itself had to
# change. It now falls back to `tomli`, which this job installs — a hard import rather
# than pytest.importorskip, so a missing backport fails loudly instead of silently
# dropping the assertions from the 3.10 leg. The `build` job stays on one interpreter: it
# proves what the built artifact contains, which is a property of the wheel and its
# declared metadata rather than of the interpreter that ran the build.

concurrency:
  # A superseded run proves nothing about the commit that replaced it. Cancel
  # in-flight runs for the same ref on pull requests; never on a branch push,
  # where each commit's run is the evidence that commit was green.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - "packages/integration/approver-identity-jwt/**"
      - "packages/integration/governed-review-service/**"
      - ".github/workflows/approver-identity-jwt-ci.yml"
  push:
    branches:
      - "claude/setup-symbolu-monorepo-**"
      - "claude/**"
    paths:
      - "packages/integration/approver-identity-jwt/**"
      - "packages/integration/governed-review-service/**"
      - ".github/workflows/approver-identity-jwt-ci.yml"

defaults:
  run:
    shell: bash

jobs:
  adapter-suite:
    name: Approver identity JWT adapter (in-process issuer, no egress, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # One interpreter's failure must not hide another's.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      PYTHONPATH: >-
        packages/integration/approver-identity-jwt/src:packages/integration/governed-review-service/src:packages/integration/governed-review/src:packages/integration/control-plane-root/src:packages/integration/approval-workflow/src:packages/integration/authority-directory/src:packages/governance-contracts/src:packages/integration/agent-runtime-governance/src:packages/integration/risk-authority-runtime/src:packages/integration/risk-authority-status-runtime/src:packages/runtime/agent-runtime/src:packages/risk_authority/src:packages/capabilities/decision-authority/src:packages/providers/actiongate/src:packages/integration/durable-execution/src:packages/integration/governed-review/tests:packages/integration/governed-review-service/tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python-version }}"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies within the declared bounds
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic "dbos>=2.0" "SQLAlchemy>=2.0" tomli \
            "PyJWT[crypto]>=2.8.0,<3.0.0" "cryptography>=41.0.7,<47.0.0"
          python -c "import importlib.metadata as m; print('PyJWT', m.version('PyJWT')); print('cryptography', m.version('cryptography'))"

      - name: Boundaries, public API, packaging
        run: |
          cd packages/integration/approver-identity-jwt
          python -m pytest tests/test_boundaries.py -o addopts= -v --no-header

      - name: Failure matrix (adapter ADR §4) over the in-process issuer
        run: |
          cd packages/integration/approver-identity-jwt
          python -m pytest tests/test_failure_matrix.py -o addopts= -v --no-header

      - name: Claim mapping (IA-4)
        run: |
          cd packages/integration/approver-identity-jwt
          python -m pytest tests/test_claim_mapping.py -o addopts= -v --no-header

      - name: Token redaction
        run: |
          cd packages/integration/approver-identity-jwt
          python -m pytest tests/test_redaction.py -o addopts= -v --no-header

      - name: Cloudflare Access issuer profile (AP3-D1 to AP3-D3, in-process issuer only)
        run: |
          cd packages/integration/approver-identity-jwt
          python -m pytest tests/test_cloudflare_access_profile.py -o addopts= -v --no-header

      - name: Behind the real review service (real SQLite ledger)
        run: |
          cd packages/integration/approver-identity-jwt
          python -m pytest tests/test_end_to_end.py -o addopts= -v --no-header

      - name: The composed packages are unmodified
        run: |
          for p in packages/integration/governed-review-service packages/integration/governed-review \
                   packages/integration/control-plane-root packages/integration/durable-execution \
                   packages/integration/approval-workflow packages/integration/authority-directory \
                   packages/integration/agent-runtime-governance packages/runtime/agent-runtime \
                   apps/ugence-governance-studio; do
            if ! git diff --quiet HEAD -- "$p"; then
              echo "$p was modified by this job; the dependency must stay one-way."; exit 1
            fi
          done

  build:
    name: Wheel + sdist build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: |
          python -m pip install --upgrade pip build
          python -m build packages/integration/approver-identity-jwt
          ls -la packages/integration/approver-identity-jwt/dist/
