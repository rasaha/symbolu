name: Formula Drift Tests CI

on:
  push:
    branches: ["main", "master", "dev", "claude/**"]
    paths:
      - "symbolu/formulas/**"
      - "symbolu/temporal/**"
      - "symbolu/core/coherence/**"
      - "symbolu/core/**"
      - "symbolu/core/formula_drift_tests/**"
      - "symbolu/tools/resonance_simulator/**"
      - "symbolu/mechanical/**"
      - "symbolu/api/**"
      - "symbolu/policy/**"
      - "symbolu/adapter/**"
      - "tests/test_phase*_invariance_audit.py"
      - "PHASE_*_MERGE_SAFETY_REPORT.md"
      - "docs/patent_formula_coverage_matrix.md"
      - ".github/workflows/formula-drift-ci.yml"
  pull_request:
    branches: ["main", "master", "dev", "claude/**"]
    paths:
      - "symbolu/formulas/**"
      - "symbolu/temporal/**"
      - "symbolu/core/coherence/**"
      - "symbolu/core/**"
      - "symbolu/core/formula_drift_tests/**"
      - "symbolu/tools/resonance_simulator/**"
      - "symbolu/mechanical/**"
      - "symbolu/api/**"
      - "symbolu/policy/**"
      - "symbolu/adapter/**"
      - "tests/test_phase*_invariance_audit.py"
      - "PHASE_*_MERGE_SAFETY_REPORT.md"
      - "docs/patent_formula_coverage_matrix.md"
      - ".github/workflows/formula-drift-ci.yml"
  workflow_dispatch:

jobs:
  formula-drift-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .
          pip install pytest pytest-cov

      - name: Run Formula Drift Tests
        run: |
          pytest \
            symbolu/core/formula_drift_tests/test_phase1_resonance_formulas.py \
            -v \
            --tb=short \
            --disable-warnings \
            --maxfail=1 \
            2>&1 | tee formula-drift-pytest.log

      - name: Run Patent Formula Tag Drift Tests
        run: |
          pytest \
            symbolu/core/formula_drift_tests/test_patent_alignment_tags.py \
            -v \
            --tb=short \
            --disable-warnings \
            --maxfail=1 \
            2>&1 | tee patent-formula-tags-pytest.log

      - name: Run Phase 8 Guna/Kosha Resonance Drift Tests
        run: |
          pytest \
            symbolu/core/formula_drift_tests/test_phase8_guna_kosha_resonance_drift.py \
            -v \
            --tb=short \
            --disable-warnings \
            --maxfail=1 \
            2>&1 | tee phase8-guna-kosha-pytest.log

      - name: Run Phase 14 Vritti Momentum & Arc-Tension Harmonizer Tests
        run: |
          pytest \
            symbolu/core/formula_drift_tests/test_phase14_vritti_and_ath.py \
            -v \
            --tb=short \
            --disable-warnings \
            --maxfail=1 \
            2>&1 | tee phase14-vritti-arc-harmonizer.log

      - name: Run Phase 23 Cause-Effect Inversion Analytics Tests
        run: |
          pytest \
            tests/test_phase23_cause_effect_inversion.py \
            -v \
            --tb=short \
            --disable-warnings \
            --maxfail=1 \
            2>&1 | tee phase23-cause-effect-inversion-pytest.log

      - name: Run Phase 24 Resonance Weighting Function Tests
        run: |
          pytest \
            tests/test_phase24_resonance_weighting.py \
            -v \
            --tb=short \
            --disable-warnings \
            --maxfail=1 \
            2>&1 | tee phase24-resonance-weighting-pytest.log

      - name: Run Phase 25 Resonance Simulator Tests
        run: |
          pytest \
            tests/test_phase25_resonance_simulator.py \
            symbolu/tools/resonance_simulator/tests/test_resonance_simulator.py \
            -v \
            --tb=short \
            --disable-warnings \
            --maxfail=1 \
            2>&1 | tee phase25-resonance-simulator-pytest.log

      - name: Run Phase 39 Multi-Horizon Temporal Forecasting Tests
        run: |
          python test_phase39_validation.py 2>&1 | tee phase39-multi-horizon-forecast.log

      - name: Upload Formula Drift test logs and fixtures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: formula-drift-test-logs
          path: |
            formula-drift-pytest.log
            patent-formula-tags-pytest.log
            phase8-guna-kosha-pytest.log
            phase14-vritti-arc-harmonizer.log
            phase23-cause-effect-inversion-pytest.log
            phase24-resonance-weighting-pytest.log
            phase25-resonance-simulator-pytest.log
            phase39-multi-horizon-forecast.log
            symbolu/core/formula_drift_tests/phase1_resonance_fixtures.json

      - name: Check for drift
        run: |
          echo "✅ Formula drift tests passed! All formulas remain deterministic and within expected ranges."
          echo "✅ Patent formula tag drift tests passed! All formula tags remain stable."
          echo "✅ Phase 8 Guna/Kosha resonance drift tests passed! All formulas remain stable."
          echo "✅ Phase 14 Vritti Momentum & Arc-Tension Harmonizer tests passed! All formulas remain stable."
          echo "✅ Phase 23 Cause-Effect Inversion Analytics tests passed! All formulas remain stable."
          echo "✅ Phase 24 Resonance Weighting Function tests passed! All formulas remain stable."
          echo "✅ Phase 25 Resonance Simulator tests passed! All what-if scenarios remain deterministic."
          echo "✅ Phase 39 Multi-Horizon Temporal Forecasting tests passed! MHTFE is operational and deterministic."

  # ========================================================================
  # INVARIANCE AUDIT CI JOB
  # ========================================================================
  # This job runs ALL invariance audit tests for Tier 1 (phases 8,13,14,16,
  # 17,18,19,21,22,26) and Advanced phases (27-47).
  # These tests ensure that core formulas and behaviors remain stable
  # across changes to the codebase.
  # CRITICAL: Any failure in this job indicates a potential regression
  # in formula stability or system invariants.
  # Total: 18 phase audit files covering 1,700+ invariance tests
  # ========================================================================
  invariance-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-invariance-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-invariance-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .
          pip install pytest pytest-cov coverage pydantic 'fastapi[standard]' uvicorn httpx

      - name: Run ALL Invariance Audit Tests (Phases 8-47, incl. 21, 22)
        run: |
          pytest -vv \
            tests/test_phase8_guna_kosha_invariance_audit.py \
            tests/test_phase10_formula_fusion_invariance_audit.py \
            tests/test_phase13_enhanced_smi_invariance_audit.py \
            tests/test_phase14_vritti_ath_invariance_audit.py \
            tests/test_phase16_formula_fusion_stabilizer_invariance_audit.py \
            tests/test_phase17_semantic_integrity_invariance_audit.py \
            tests/test_phase18_temporal_entropy_invariance_audit.py \
            tests/test_phase19_drift_fusion_invariance_audit.py \
            tests/test_phase21_mirror_time_loop_invariance_audit.py \
            tests/test_phase22_mirror_time_cycle_invariance_audit.py \
            tests/test_phase26_unified_consciousness_invariance_audit.py \
            tests/test_phase27_invariance_audit.py \
            tests/test_phase31_apel_invariance_audit.py \
            tests/test_phase32_invariance_audit.py \
            tests/test_phase38_tcfm_invariance_audit.py \
            tests/test_phase40_chrae_invariance_audit.py \
            tests/test_phase45_mtsf_invariance_audit.py \
            tests/test_phase46_trajectory_convergence_invariance_audit.py \
            tests/test_phase47_utsse_invariance_audit.py \
            --tb=short \
            --disable-warnings \
            2>&1 | tee invariance-audit-all-phases.log

      - name: Upload Invariance Audit Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invariance-audit-logs
          path: |
            invariance-audit-all-phases.log

      - name: Invariance Audit Summary
        if: success()
        run: |
          echo "✅ =========================================="
          echo "✅ INVARIANCE AUDIT: ALL TESTS PASSED"
          echo "✅ =========================================="
          echo "✅ TIER 1 PHASES (Core Formula Engine):"
          echo "✅   Phase 8: Guna/Kosha Resonance invariants verified"
          echo "✅   Phase 10: Coherence v3 Formula Fusion invariants verified"
          echo "✅   Phase 13: Enhanced SMI invariants verified"
          echo "✅   Phase 14: Vritti/ATH invariants verified"
          echo "✅   Phase 16: Formula Fusion Stabilizer invariants verified"
          echo "✅   Phase 17: Semantic Integrity invariants verified"
          echo "✅   Phase 18: Temporal Entropy invariants verified"
          echo "✅   Phase 19: Drift Fusion invariants verified"
          echo "✅   Phase 21: Mirror-Time Loop Engine invariants verified"
          echo "✅   Phase 22: Mirror-Time Cycle Engine invariants verified"
          echo "✅   Phase 26: Unified Consciousness invariants verified"
          echo "✅ "
          echo "✅ ADVANCED PHASES:"
          echo "✅   Phase 27: Symbolic Harmonization invariants verified"
          echo "✅   Phase 31: APEL invariants verified"
          echo "✅   Phase 32: Insight Window Gating invariants verified"
          echo "✅   Phase 38: TCFM invariants verified"
          echo "✅   Phase 40: CHRAE invariants verified"
          echo "✅   Phase 45: MTSF invariants verified"
          echo "✅   Phase 46: Trajectory Convergence invariants verified"
          echo "✅   Phase 47: UTSSE invariants verified"
          echo "✅ =========================================="
          echo "✅ All formulas remain stable and deterministic!"
          echo "✅ No regressions detected in system invariants."
          echo "✅ =========================================="

      - name: Invariance Audit Failure Report
        if: failure()
        run: |
          echo "❌ =========================================="
          echo "❌ INVARIANCE AUDIT: FAILURES DETECTED"
          echo "❌ =========================================="
          echo "❌ One or more invariance tests have failed."
          echo "❌ This indicates a potential regression in:"
          echo "❌   - Formula stability"
          echo "❌   - System invariants"
          echo "❌   - Core behavioral guarantees"
          echo "❌ =========================================="
          echo "❌ ACTION REQUIRED:"
          echo "❌ 1. Review the test log artifact above"
          echo "❌ 2. Identify which phase(s) failed"
          echo "❌ 3. Check recent changes to core formulas"
          echo "❌ 4. Consult PHASE_*_MERGE_SAFETY_REPORT.md"
          echo "❌ 5. Do NOT merge until all tests pass"
          echo "❌ =========================================="
          exit 1
