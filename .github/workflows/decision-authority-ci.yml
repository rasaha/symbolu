name: decision-authority-ci

# Scoped CI for the independent ugence-decision-authority capability package — the
# bounded governance kernel that decides when an AI recommendation may become a binding
# business decision (frozen public contract 1.0.0).
#
# Until now this package had no workflow of its own: its suite ran only as a baseline
# step inside risk-authority-execution-assurance-ci, and its distribution verifier ran
# in no workflow at all. This adds both under a path scope of the package's own tree, so
# a change to the kernel proves itself. It is additive and touches no existing workflow.

on:
  pull_request:
    paths:
      - "packages/capabilities/decision-authority/**"
      - ".github/workflows/decision-authority-ci.yml"
  push:
    branches:
      - "claude/decision-authority-**"
      - "claude/setup-symbolu-monorepo-**"
    paths:
      - "packages/capabilities/decision-authority/**"
      - ".github/workflows/decision-authority-ci.yml"

defaults:
  run:
    shell: bash

jobs:
  package-suite:
    name: Decision Authority kernel suite (source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic
      - name: Kernel suite (public surface, frozen vocabulary, boundaries, compatibility)
        run: python -m pytest packages/capabilities/decision-authority/tests -q

  isolated-install:
    name: Wheel build + isolated single-wheel installation verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build wheel pytest pydantic
      - name: Build the wheel, install it into a clean venv, run the isolated capability proof
        run: python packages/capabilities/decision-authority/verify_decision_authority_distribution.py
