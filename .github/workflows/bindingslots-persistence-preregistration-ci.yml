name: bindingslots-persistence-preregistration-ci

# Torch-free CI for the persistence PREREGISTRATION. There is NO training job. Training requires a
# separate, later authorization and a separate execution path.

on:
  push:
    paths:
      - 'experiments/bindingslots_persistence/**'
      - 'docs/audits/bindingslots_persistence_preregistration/**'
      - '.github/workflows/bindingslots-persistence-preregistration-ci.yml'
  pull_request:
    paths:
      - 'experiments/bindingslots_persistence/**'
      - '.github/workflows/bindingslots-persistence-preregistration-ci.yml'

permissions:
  contents: read

jobs:
  preregistration-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Frozen abc.json digest (pre)
        run: sha256sum experiments/phase_lc/results/abc.json | tee /tmp/abc_before.txt

      - name: Pre-registration integrity (six arms, seeds 23-27, O1R/H1/H2 frozen, no results)
        run: python experiments/bindingslots_persistence/verify_persistence_prereg.py

      - name: Frozen classifier / gates / instrumentation / seed manifest tests
        run: python experiments/bindingslots_persistence/tests/test_persistence.py

      - name: Diagnostic non-interference report present and proven
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("experiments/bindingslots_persistence/results/diagnostic_noninterference.json")
          if not p.exists():
              print("FAIL: non-interference report missing"); sys.exit(1)
          r = json.loads(p.read_text())
          if not (r.get("step_700_noninterference_proven") and r["test1_state_invariance"]["pass"] and r["test2_ab_trajectory"]["pass"]):
              print("FAIL: step-700 non-interference not proven"); sys.exit(1)
          print("step-700 non-interference proven")
          PY

      - name: No training outputs exist (preregistration mode only)
        run: |
          python - <<'PY'
          import json, pathlib, sys
          base = pathlib.Path("experiments/bindingslots_persistence")
          auth = base/"execution_authorization.json"
          if auth.exists() and json.loads(auth.read_text()).get("pr_1332_merge_commit") == "101951cb8bbccca32b6e3faa371bc675371dca89":
              print("execution-authorized mode: training outputs permitted (validated by execution CI)"); sys.exit(0)
          sd = base/"results"/"seeds"
          banned = [base/"results"/"aggregate_classification.json", base/"results"/"selection_decision.json"]
          bad = (sd.exists() and any(sd.iterdir())) or any(b.exists() for b in banned)
          print("FAIL: training outputs present in preregistration mode" if bad else "no training outputs")
          sys.exit(1 if bad else 0)
          PY

      - name: Historical-artifact protection
        run: python hybrid_llm_vnext_lab/scripts/verify_historical_artifact_protection.py

      - name: Lab integrity verifier
        run: python hybrid_llm_vnext_lab/scripts/verify_lab.py

      - name: Terminology / no premature KDA promotion
        run: |
          python - <<'PY'
          import pathlib, re, sys
          roots = ["experiments/bindingslots_persistence", "docs/audits/bindingslots_persistence_preregistration"]
          bad = []
          for root in roots:
              for p in pathlib.Path(root).rglob("*"):
                  if p.suffix not in (".md", ".json", ".py"): continue
                  for i, line in enumerate(p.read_text().splitlines(), 1):
                      if re.search(r"READY_FOR_KDA_VALIDATION[^_]", line) and not re.search(r"never emit|not emit|BLOCKED|NOT_READY", line):
                          bad.append(f"{p}:{i}")
          print("FAIL bare KDA-ready:" , bad) if bad else print("terminology ok")
          sys.exit(1 if bad else 0)
          PY

      - name: Frozen abc.json unchanged (post)
        run: |
          sha256sum experiments/phase_lc/results/abc.json | tee /tmp/abc_after.txt
          diff /tmp/abc_before.txt /tmp/abc_after.txt && echo "abc.json UNCHANGED"
