name: hybrid-llm-vnext-lab-ci

# Narrowly scoped, torch-free CI for the bounded binding-slot incubation lab.
# It runs the stdlib reference tests, provenance/boundary/complexity/artifact-protection checks,
# the launcher argument checks, the lab integrity verifier, and the merged audit verifier.
# It does NOT run neural training (see hybrid-llm-slot-neural-reproduction.yml, manual dispatch).

on:
  push:
    paths:
      - 'hybrid_llm_vnext_lab/**'
      - 'Project_documentation/repository/docs/audits/hybrid_llm/BINDING_SLOT_EVIDENCE_RECONCILIATION.md'
      - 'docs/audits/hybrid_llm/artifacts/binding_slot_evidence_reconciliation.json'
      - '.github/workflows/hybrid-llm-vnext-lab-ci.yml'
  pull_request:
    paths:
      - 'hybrid_llm_vnext_lab/**'
      - 'Project_documentation/repository/docs/audits/hybrid_llm/BINDING_SLOT_EVIDENCE_RECONCILIATION.md'
      - 'docs/audits/hybrid_llm/artifacts/binding_slot_evidence_reconciliation.json'
      - '.github/workflows/hybrid-llm-vnext-lab-ci.yml'

jobs:
  lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Lab integrity (provenance, boundaries, JSON, status markers)
        run: python hybrid_llm_vnext_lab/scripts/verify_lab.py

      - name: Historical-artifact protection
        run: python hybrid_llm_vnext_lab/scripts/verify_historical_artifact_protection.py

      - name: Launcher argument / environment checks (torch-free)
        run: |
          python hybrid_llm_vnext_lab/experiments/reproduce_legacy_slots/run.py --check-environment
          python hybrid_llm_vnext_lab/experiments/neural_slots_only/run.py --check-environment

      - name: Stdlib reference tests (parity self-skips without torch)
        run: python hybrid_llm_vnext_lab/scripts/run_stdlib_tests.py

      - name: No-Phase import boundaries (core + slots-only)
        run: |
          python hybrid_llm_vnext_lab/tests/boundaries/test_no_phase_imports.py
          python hybrid_llm_vnext_lab/tests/boundaries/test_slots_only_no_phase.py

      - name: No-KDA/MLA boundary
        run: python hybrid_llm_vnext_lab/tests/boundaries/test_no_kda_mla.py

      - name: Five-seed pre-registration integrity + config
        run: |
          python hybrid_llm_vnext_lab/experiments/five_seed_slots/verify_preregistration.py
          python hybrid_llm_vnext_lab/experiments/five_seed_slots/run.py --check-environment

      - name: Merged audit-integrity verifier (must still pass)
        run: python docs/audits/hybrid_llm/verify_hybrid_llm_audit.py
