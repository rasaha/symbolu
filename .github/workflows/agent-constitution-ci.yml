name: agent-constitution-ci

# Scoped CI for the two ACC-S1 Agent Constitution integration distributions:
#
#   * ugence-agent-constitution-policy      — the policy family, its Policy
#     Authority adapter, and the ACC-S1-Q3 registration-time family-collision
#     guard (the artifact side);
#   * ugence-agent-constitution-conformance — the concrete fail-closed resolver,
#     the structural conformance verifier, and the end-to-end proof (the
#     conformance side).
#
# One workflow for both, because they are one integration: the conformance suite
# imports the family, and a change to either can break the other. Both suites
# drive the GENUINE pipeline — real issuance, real Ed25519 signing, the real
# registry, real resolution, the guarded composition path, and the ratified
# conformance predicate in both directions — so a green run here is evidence
# about the integration, not about a stub.
#
# The neighbouring suites run too, and deliberately: the Agentic Proposer and
# Policy Authority test trees each carry REPOSITORY-WIDE scans that these
# packages' files must satisfy (the role-projection substring scan and the
# authority-internals import scan). A change here can only break those, never see
# them, so they run on this workflow's own triggers.

on:
  pull_request:
    paths:
      - "packages/integration/agent-constitution-policy/**"
      - "packages/integration/agent-constitution-conformance/**"
      - "packages/capabilities/agentic-proposer/**"
      - "packages/policy-authority/**"
      - "docs/architecture/AGENT_CONSTITUTION_AND_CONFORMANCE_FIRST_SLICE_DESIGN_SPECIFICATION.md"
      - "docs/architecture/ADR_UGENCE_AGENT_CONSTITUTION_FIRST_SLICE_RATIFICATION.md"
      - ".github/workflows/agent-constitution-ci.yml"
  push:
    branches:
      - "claude/setup-symbolu-monorepo-**"
      - "claude/agent-constitution-**"
    paths:
      - "packages/integration/agent-constitution-policy/**"
      - "packages/integration/agent-constitution-conformance/**"
      - "packages/capabilities/agentic-proposer/**"
      - "packages/policy-authority/**"
      - "docs/architecture/AGENT_CONSTITUTION_AND_CONFORMANCE_FIRST_SLICE_DESIGN_SPECIFICATION.md"
      - "docs/architecture/ADR_UGENCE_AGENT_CONSTITUTION_FIRST_SLICE_RATIFICATION.md"
      - ".github/workflows/agent-constitution-ci.yml"

defaults:
  run:
    shell: bash

jobs:
  package-suites:
    name: Constitution family + conformance suites (source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        # pydantic and ugence-jcs arrive transitively through the Agentic
        # Proposer, which both packages depend on for the ratified vocabulary.
        run: |
          python -m pip install --upgrade pip
          pip install pytest build pydantic
          pip install packages/jcs
      - name: Family suite (artifact, adapter, collision guard, authority registration)
        run: python -m pytest packages/integration/agent-constitution-policy/tests -q
      - name: Conformance suite (facts, predicate, resolution, end-to-end proof)
        run: python -m pytest packages/integration/agent-constitution-conformance/tests -q

  neighbour-scans:
    name: Repository-wide scans these packages must satisfy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic
          pip install packages/jcs
      - name: Agentic Proposer suite (carries the role-projection scan)
        run: python -m pytest packages/capabilities/agentic-proposer/tests -q
      - name: Policy Authority suite (carries the authority-internals import scan)
        run: python -m pytest packages/policy-authority/tests -q

  isolated-install:
    name: Wheel build + isolated installation verification (both distributions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Both distributions — build, install into a clean venv, exercise end to end
        # One script covers the pair: the conformance wheel declares the family
        # wheel as a dependency, so the offline install proves both, and the
        # in-venv proof drives issuance, guarded composition, resolution and the
        # conformance predicate across the installed packaging boundary.
        run: python packages/integration/agent-constitution-conformance/verify_agent_constitution_conformance_distribution.py

  freeze:
    name: Platform-freeze verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic
      - name: Freeze verification (blocking — frozen artifacts must be unchanged)
        run: python -m platform_freeze.verify --manifest platform/PLATFORM_FREEZE_V1.json
