name: bindingslots-functional-routing-ci

# Scoped CI for the BindingSlots functional-routing development phase.
# Push/PR job is TORCH-FREE and never runs the training matrix: it verifies pre-registration + frozen
# reference integrity, the training-perturbation isolation (distinct from the frozen randomized-address
# gate), the objective leakage guards, the classifier/selection tests, known-signature reproduction on
# committed evidence, historical-artifact integrity, the lab verifier, and terminology. It can
# re-derive the Stage-1 verdict from committed results WITHOUT retraining.
# The expensive Stage-1 matrix runs only via manual dispatch.

on:
  push:
    paths:
      - 'experiments/bindingslots_functional_routing/**'
      - 'docs/audits/bindingslots_functional_routing_development/**'
      - 'docs/research/bindingslots/FUNCTIONAL_ROUTING_*'
      - '.github/workflows/bindingslots-functional-routing-ci.yml'
  pull_request:
    paths:
      - 'experiments/bindingslots_functional_routing/**'
      - '.github/workflows/bindingslots-functional-routing-ci.yml'
  workflow_dispatch:
    inputs:
      job:
        description: 'stage1_run | classify_only | verify_only'
        required: true
        default: 'verify_only'

permissions:
  contents: read

jobs:
  integrity:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}

      - name: Frozen abc.json digest (pre)
        run: sha256sum experiments/phase_lc/results/abc.json | tee /tmp/abc_before.txt

      - name: Pre-registration + frozen-reference + training-perturbation-isolation integrity
        run: python experiments/bindingslots_functional_routing/verify_fr_prereg.py

      - name: Classifier / selection / target-slot / schedule tests
        run: python experiments/bindingslots_functional_routing/tests/test_fr.py

      - name: Known-signature reproduction on committed confirmatory evidence
        run: python experiments/bindingslots_functional_routing/validate_known_signatures.py

      - name: Re-derive Stage-1 verdict from committed results (no training)
        run: |
          D=experiments/bindingslots_functional_routing/results/seeds
          if [ -f "$D/O1_results.json" ] && [ -f "$D/R0_results.json" ] && [ -f "$D/A+_results.json" ]; then
            python experiments/bindingslots_functional_routing/fr_classifier.py --results-dir "$D"
          else
            echo "no committed Stage-1 results yet — skipping re-derivation"
          fi

      - name: Lab integrity verifier
        run: python hybrid_llm_vnext_lab/scripts/verify_lab.py
      - name: Historical-artifact protection
        run: python hybrid_llm_vnext_lab/scripts/verify_historical_artifact_protection.py

      - name: Terminology / no premature KDA promotion / no forbidden architecture
        run: |
          set -e
          D=experiments/bindingslots_functional_routing
          BARE=$(grep -rniE "READY_FOR_KDA_VALIDATION[^_]" $D docs/audits/bindingslots_functional_routing_development docs/research/bindingslots 2>/dev/null | grep -viE "NOT_READY|BLOCKED|not emitted|never emit" || true)
          test -z "$BARE" || (echo "bare KDA-ready claim:" && echo "$BARE" && exit 1)
          FORB=$(grep -rniE "PhaseAttentionLayer|HybridPhaseTransformer|^import kda|^import mla|import MultiLatentAttention" $D/objectives.py $D/curriculum_gradual.py $D/fr_runner.py $D/fr_classifier.py 2>/dev/null || true)
          test -z "$FORB" || (echo "forbidden import:" && echo "$FORB" && exit 1)

      - name: Frozen abc.json unchanged (post)
        run: |
          sha256sum experiments/phase_lc/results/abc.json | tee /tmp/abc_after.txt
          diff /tmp/abc_before.txt /tmp/abc_after.txt && echo "abc.json UNCHANGED"

  stage1_run:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Disk guard
        run: df -h .
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Pre-registration integrity
        run: python experiments/bindingslots_functional_routing/verify_fr_prereg.py
      - name: Install CPU torch
        if: ${{ inputs.job == 'stage1_run' }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "numpy<2" "torch==2.*"
      - name: Run Stage-1 matrix (A+/R0/O1/O2/H3 x seeds 18-22)
        if: ${{ inputs.job == 'stage1_run' }}
        run: OMP_NUM_THREADS=4 python experiments/bindingslots_functional_routing/fr_runner.py
      - name: Classify
        if: ${{ inputs.job == 'stage1_run' || inputs.job == 'classify_only' }}
        run: |
          D=experiments/bindingslots_functional_routing/results/seeds
          [ -f "$D/O1_results.json" ] && python experiments/bindingslots_functional_routing/fr_classifier.py --results-dir "$D" --out experiments/bindingslots_functional_routing/results/stage1_aggregate.json || echo "no results"
      - name: Verify only
        if: ${{ inputs.job == 'verify_only' }}
        run: python experiments/bindingslots_functional_routing/verify_fr_prereg.py
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bindingslots-functional-routing-results
          path: experiments/bindingslots_functional_routing/results/**
          if-no-files-found: ignore
