name: Routing Risk Analysis

on:
  pull_request:
    branches: [ "main" ]

jobs:
  routing-risk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Load cached dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Symbol-U
        run: |
          pip install -e .
          pip install pytest matplotlib

      - name: Run Drift Tests (Generate Reports)
        run: |
          pytest symbolu/core/drift_tests -q --tb=no || true
        continue-on-error: true

      - name: Run Drift Dashboard
        id: drift_analysis
        run: |
          python -m symbolu.tools.drift_dashboard.dashboard > routing_risk.txt 2>&1
          DASHBOARD_EXIT=$?
          cat routing_risk.txt
          echo "dashboard_exit_code=$DASHBOARD_EXIT" >> $GITHUB_OUTPUT
          exit 0

      - name: Analyze Drift Ratio
        id: analyze_drift
        run: |
          # Parse drift ratio from dashboard output
          if grep -q "Drift cases:.*0 (0.00%)" routing_risk.txt; then
            echo "drift_status=ok" >> $GITHUB_OUTPUT
            echo "drift_message=✓ No routing drift detected" >> $GITHUB_OUTPUT
          elif grep -q "drift_ratio.*[0-4]\.[0-9]*%" routing_risk.txt; then
            echo "drift_status=warning" >> $GITHUB_OUTPUT
            echo "drift_message=⚠️ Minor drift detected (< 5%)" >> $GITHUB_OUTPUT
          else
            echo "drift_status=critical" >> $GITHUB_OUTPUT
            echo "drift_message=❌ Significant drift detected (≥ 5%)" >> $GITHUB_OUTPUT
          fi

          # Check for CRITICAL status
          if grep -q "Status: CRITICAL" routing_risk.txt; then
            echo "drift_status=critical" >> $GITHUB_OUTPUT
            echo "drift_message=❌ CRITICAL: Drift exceeds threshold!" >> $GITHUB_OUTPUT
          elif grep -q "Status: WARNING" routing_risk.txt; then
            echo "drift_status=warning" >> $GITHUB_OUTPUT
            echo "drift_message=⚠️ WARNING: Minor drift detected" >> $GITHUB_OUTPUT
          elif grep -q "Status: OK" routing_risk.txt; then
            echo "drift_status=ok" >> $GITHUB_OUTPUT
            echo "drift_message=✓ No routing drift detected" >> $GITHUB_OUTPUT
          fi

      - name: Upload Routing Risk Report
        uses: actions/upload-artifact@v4
        with:
          name: routing-risk-report
          path: routing_risk.txt

      - name: Upload Drift Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-test-reports
          path: |
            symbolu/core/drift_tests/*.json

      - name: Post PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const driftStatus = '${{ steps.analyze_drift.outputs.drift_status }}';
            const driftMessage = '${{ steps.analyze_drift.outputs.drift_message }}';

            let statusEmoji, statusLabel;
            if (driftStatus === 'ok') {
              statusEmoji = '✅';
              statusLabel = 'PASSED';
            } else if (driftStatus === 'warning') {
              statusEmoji = '⚠️';
              statusLabel = 'WARNING';
            } else {
              statusEmoji = '❌';
              statusLabel = 'FAILED';
            }

            const body = `## ${statusEmoji} Routing Risk Analysis: ${statusLabel}

            ${driftMessage}

            ### Summary
            - **Status**: ${statusLabel}
            - **Dashboard Exit Code**: ${{ steps.drift_analysis.outputs.dashboard_exit_code }}

            ### Details
            The routing risk analysis checks for drift between TTOR and MLCR canonical mapper rules.

            | Threshold | Status |
            |-----------|--------|
            | Drift = 0% | ✅ OK |
            | 0% < Drift < 5% | ⚠️ Warning |
            | Drift ≥ 5% | ❌ Critical |

            View the full report in the workflow artifacts.
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Check Drift Status
        run: |
          DRIFT_STATUS="${{ steps.analyze_drift.outputs.drift_status }}"
          echo "Drift status: $DRIFT_STATUS"

          if [ "$DRIFT_STATUS" = "critical" ]; then
            echo "❌ CRITICAL: Routing drift exceeds 5% threshold!"
            echo "PR should be blocked until drift is resolved."
            exit 1
          elif [ "$DRIFT_STATUS" = "warning" ]; then
            echo "⚠️ WARNING: Minor routing drift detected (< 5%)"
            echo "PR can proceed but drift should be investigated."
            exit 0
          else
            echo "✓ No routing drift detected"
            exit 0
          fi
