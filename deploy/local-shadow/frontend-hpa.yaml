# A real HPA on the Boutique frontend — the genuine autoscaler the controller
# shadows. maxReplicas=20 keeps the guard's >=20 high-replica regime reachable
# under load; set to 8 to reproduce synthetic scenario #9 budget_cap.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend
  namespace: boutique
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend
  minReplicas: 1
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
