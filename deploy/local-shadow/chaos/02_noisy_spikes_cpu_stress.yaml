# Synthetic scenario #2 noisy_spikes → real CPU bursts on random frontend pods.
# Real noisy-neighbor CPU pressure; the controller's damping should absorb it
# without scale thrash.
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: noisy-spikes-cpu
  namespace: boutique
spec:
  mode: random-max-percent
  value: "40"                 # ~40% of matching pods at a time
  selector:
    namespaces: [boutique]
    labelSelectors:
      app: frontend
  stressors:
    cpu:
      workers: 2
      load: 80
  duration: "30s"
  # Chaos Mesh re-applies on a schedule via a Schedule resource (see README) to
  # produce the intermittent "15% of cycles" spike pattern.
