# kind cluster for the live-shadow validation.
# 1 control-plane + 2 workers gives the scheduler room to actually move pods
# under chaos (pod kills, node pressure). ~6-8 GB RAM recommended for the full
# Online Boutique; see README for the lighter subset.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ncc-shadow
nodes:
  - role: control-plane
  - role: worker
  - role: worker
