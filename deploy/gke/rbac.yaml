apiVersion: v1
kind: ServiceAccount
metadata:
  name: ncc-controller
  namespace: ncc
  labels:
    app.kubernetes.io/part-of: neural-cloud-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ncc-controller
  labels:
    app.kubernetes.io/part-of: neural-cloud-controller
rules:
  # Read pods, deployments, replicasets for state observation
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  # Patch deployment scale (only needed for scale_patch mode)
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  # Read HPA for shadow mode comparison
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  # Read events for rollback detection
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ncc-controller
  labels:
    app.kubernetes.io/part-of: neural-cloud-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ncc-controller
subjects:
  - kind: ServiceAccount
    name: ncc-controller
    namespace: ncc
