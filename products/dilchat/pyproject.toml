[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ugence-dilchat"
version = "0.1.0"
description = "DilChat backend (Ugence Labs) — Phase A/B foundation: identity, birth profiles, deterministic natal-Moon derivation, three-scope authorization, couple/consent/audit primitives. No user-facing Guna Milan, AI, or production deployment."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Ugence Labs" }]
keywords = ["dilchat", "vedic", "sidereal", "authorization", "fastapi"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
    # Phase 3C relay: HTTP client for the Expo push transport.
    "httpx>=0.27",
]

[project.optional-dependencies]
# Development/TEST ONLY. Swiss Ephemeris (pyswisseph) is AGPL-licensed; see
# docs/DILCHAT_DECISION_LOG.md DEC-007 and the "Swiss Ephemeris licensing" notice in
# README.md. It must not be enabled in a public/production environment in this phase.
swiss = ["pyswisseph>=2.10.3.2"]
test = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "hypothesis>=6.100",
    "aiosqlite>=0.20",
]
dev = [
    "mypy>=1.10",
    "ruff>=0.5",
]
# Independent astronomical validation ONLY (Workstream A). Astropy is a separate
# ERFA/IAU-SOFA implementation, independent of Swiss Ephemeris; used offline to
# regenerate INDEPENDENT_REFERENCE fixtures. Not required to run the test suite
# (the committed fixtures carry the frozen independently-sourced values).
validation = ["astropy>=6.0"]

[project.scripts]
dilchat-openapi = "ugence_dilchat.scripts_openapi:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ugence_dilchat*"]

[tool.setuptools.package-data]
ugence_dilchat = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
markers = [
    "postgres: integration/migration tests that need a live PostgreSQL (DILCHAT_TEST_DATABASE_URL).",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "UP042",  # keep (str, Enum) pattern consistent with the wider monorepo
]

[tool.mypy]
python_version = "3.12"
packages = ["ugence_dilchat"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
