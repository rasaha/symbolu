[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "symbolu"
version = "0.1.0"
description = "Symbol-U / Soulpi AGI deterministic engine"
authors = [
    { name = "Rakesh Mohan" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.40.0"]
mistral = ["mistralai>=0.0.7"]
all = [
    "openai>=1.0.0",
    "anthropic>=0.40.0",
    "mistralai>=0.0.7",
    "fastapi[standard]>=0.100.0",
    "uvicorn>=0.20.0",
    "matplotlib>=3.7.0",
]

# Top-level packages containing all modules
[tool.setuptools.packages.find]
where = ["."]
include = [
    "symbolu*", "agentic*", "ai_hiring*",
    # Phase 5A: extracted Decision Governance kernel + domain/application layers
    "decision_governance*", "domains*", "applications*",
    # Phase 5F: application-layer governance-provider framework
    "governance_providers*",
    # Phase 5G: ActionGate action-governance provider
    "actiongate_provider*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: hardware-sensitive timing tests (skipped in normal CI runs)",
]
# Ignore directories with broken or missing dependencies
norecursedirs = [
    "restoration",
    "symbolu/core/drift_tests",
    "symbolu/mechanical/pipeline/integration_tests",
    "symbolu/mechanical/pipeline/tests_*",
    "symbolu/mechanical/pipeline/ttor",
    "tests/core_phases",
    "tests/experiments",
    "tests/phase11",
    "tests/unit/mechanical/pipeline/ttor",
    "tests/unit/mechanical/pipeline/p15_interaction",
    "tests/unit/service",
    "tests/unit/renderer",
]
# Individual test files to skip (require missing dependencies)
addopts = "--ignore=tests/test_phase28_symbolic_harmonization_renderer.py --import-mode=importlib"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
