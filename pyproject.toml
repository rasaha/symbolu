[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "symbolu"
version = "0.1.0"
description = "Symbol-U / Soulpi AGI deterministic engine"
authors = [
    { name = "Rakesh Mohan" }
]
readme = "README.md"
requires-python = ">=3.10"

# Top-level packages containing all modules
[tool.setuptools.packages.find]
where = ["."]
include = ["symbolu*", "agentic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Ignore directories with broken or missing dependencies
norecursedirs = [
    "restoration",
    "symbolu/core/drift_tests",
    "symbolu/mechanical/pipeline/integration_tests",
    "symbolu/mechanical/pipeline/tests_*",
    "symbolu/mechanical/pipeline/ttor",
    "tests/core_phases",
    "tests/experiments",
    "tests/phase11",
    "tests/unit/mechanical/pipeline/ttor",
    "tests/unit/mechanical/pipeline/p15_interaction",
    "tests/unit/service",
    "tests/unit/renderer",
]
# Individual test files to skip (require missing dependencies)
addopts = "--ignore=tests/test_phase28_symbolic_harmonization_renderer.py"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
