# COMPATIBILITY distribution for the legacy ``dgm-tap-provider`` wheel name.
#
# The TAP assertion-governance provider was migrated to the canonical package
# ``ugence-tap-provider`` (``packages/providers/tap``). The ./tap_provider entry is
# a SYMLINK to the root ``tap_provider`` compatibility shim — a logic-free namespace
# that re-exports the canonical package. This distribution therefore ships NO TAP
# implementation of its own; it exists only so existing ``dgm-tap-provider``
# dependency declarations keep resolving and ``import tap_provider`` keeps working
# in a clean environment. It depends on the canonical wheel WITH the
# ``decision-authority`` extra so the pre-migration transitive closure (the kernel
# facade + provider framework + governance contracts) is preserved exactly.
#
# It does NOT ship a second TAP implementation, does NOT depend on ActionGate
# (TAP and ActionGate are independent peer providers), and does NOT pull
# applications or domains.
#
# Transitional: pinned to the frozen provider version 0.1.0. Removal/review target
# tracked with the ``tap_provider`` shim.
#
# Build with:  python -m build packaging/dgm-tap-provider
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dgm-tap-provider"
version = "0.1.0"
description = "TAP assertion-governance provider (compatibility distribution) — re-exports ugence-tap-provider."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Rakesh Mohan" }]
# No implementation here: the canonical package carries TAP. The
# ``decision-authority`` extra preserves the legacy wheel's kernel-bound transitive
# closure (framework adapters → decision-governance kernel facade + contracts).
dependencies = ["ugence-tap-provider[decision-authority]==0.1.0"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tap_provider*"]
exclude = ["tap_provider.tests", "tap_provider.tests.*"]
