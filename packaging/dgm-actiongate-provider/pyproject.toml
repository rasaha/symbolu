# Independent PRIVATE distribution for the ActionGate action-governance provider.
#
# ./actiongate_provider is a SYMLINK to the canonical ../../actiongate_provider
# package. It DEPENDS ON the DGM kernel and provider-framework distributions and
# owns no kernel or framework files.
#
# Build with:  python -m build packaging/dgm-actiongate-provider
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dgm-actiongate-provider"
dynamic = ["version"]
description = "ActionGate action-governance provider for the Decision Governance Middleware."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Rakesh Mohan" }]
dependencies = [
    "decision-governance==1.0.0",
    "dgm-provider-framework==0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.dynamic]
version = { attr = "actiongate_provider.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["actiongate_provider*"]
exclude = ["actiongate_provider.tests", "actiongate_provider.tests.*"]
